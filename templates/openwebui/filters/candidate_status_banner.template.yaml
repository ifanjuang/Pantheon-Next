# Non-executable OpenWebUI Filter template.
# This is not an installable Filter.

template_id: candidate_status_banner
owner_layer: openwebui
status: candidate_template_only
surface_type: display_filter
purpose: >
  Display visible governance status on candidate outputs.

allowed_inputs:
  - output_candidate
  - evidence_pack_candidate
  - approval_state
  - memory_state
  - user_decision_gate_state

allowed_outputs:
  - visible_status_banner
  - missing_evidence_warning
  - approval_required_warning
  - memory_candidate_warning

forbidden_outputs:
  - hidden_prompt_modification
  - approval_final
  - canonical_memory
  - evidence_pack_mutation
  - task_contract_mutation

status_labels:
  - draft
  - candidate
  - evidence_missing
  - approval_required
  - human_decision_required
  - blocked_for_delivery
  - memory_candidate_only

notes:
  - This template describes visible labeling only.
  - It must not rewrite substance or hide contradictions.
