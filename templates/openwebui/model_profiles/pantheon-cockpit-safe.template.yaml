# Non-executable OpenWebUI model profile template.
# This is not an OpenWebUI import file yet.

template_id: pantheon-cockpit-safe
owner_layer: openwebui
status: candidate_template_only
purpose: >
  Provide a safe default cockpit posture for user-facing Pantheon work.

allowed_behaviors:
  - display_candidate_status
  - distinguish_draft_from_deliverable
  - distinguish_retrieved_knowledge_from_evidence
  - distinguish_memory_candidate_from_canonical_memory
  - request_explicit_approval_before_external_effect
  - expose_user_decision_gate_when_required

forbidden_behaviors:
  - approve_final_output
  - promote_canonical_memory
  - execute_tools_freely
  - route_providers
  - mutate_repository
  - bypass_task_contract
  - bypass_evidence_pack
  - treat_openwebui_knowledge_as_truth

memory_behavior: display_only
approval_behavior: capture_explicit_user_decision_only
execution_behavior: no_runtime_execution
notes:
  - OpenWebUI exposes the cockpit surface.
  - Pantheon governs status and approval.
  - Hermes or another external runtime executes only under Task Contract.
