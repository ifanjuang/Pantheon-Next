# Non-executable OpenWebUI Action template.
# This is not an installable Action or an implemented bridge.

template_id: request_hermes_execution
owner_layer: openwebui
status: candidate_template_only
implementation_status: documented_non_implemented_here
binding_location: external_openwebui_hermes_adapter
surface_type: thin_action
purpose: >
  Prepare a request candidate for external Hermes execution only when a governed
  Task Contract, Context Pack, expected evidence and approval ceiling exist.

required_inputs:
  - task_contract_id
  - context_pack_id
  - requested_executor_class
  - approval_ceiling
  - expected_evidence
  - retention_and_register_rule

allowed_outputs:
  - bridge_request_candidate
  - blocked_status
  - missing_governance_artifact_note

forbidden_outputs:
  - direct_tool_execution
  - direct_hermes_runtime_control
  - approval_final
  - registre_probatoire_entry
  - register_admission
  - provider_routing
  - external_effect

blocking_conditions:
  - missing_task_contract
  - missing_context_pack
  - missing_retention_or_register_rule
  - missing_expected_evidence
  - approval_ceiling_unclear
  - scope_unclear
  - external_bridge_not_installed

expected_external_return:
  contract_fixture: docs/examples/external_run_returns/architecture_devis_reprise.example.yaml
  validator: scripts/validate_devis_reprise_return.py

notes:
  - A future external Action may request execution; this template cannot.
  - The Action must never execute, approve, send or admit a register entry.
  - An external implementation ref and rollback evidence are required before a full-loop claim.
  - template present != bridge implemented.
