# Non-executable Hermes skill candidate template.
# This is not an installed Hermes skill.

template_id: source_audit_skill_candidate
owner_layer: hermes
status: candidate_template_only
purpose: >
  Audit selected sources and return candidate evidence, gaps and contradictions.

requires_task_contract: true
requires_context_pack: true

allowed_inputs:
  - selected_sources
  - source_references
  - task_contract
  - context_pack
  - evidence_requirements

allowed_outputs:
  - evidence_candidate
  - source_risk_note
  - contradiction_note
  - missing_source_note
  - capability_gap

forbidden_outputs:
  - approval_final
  - canonical_memory
  - external_send
  - doctrine_change
  - source_truth_by_retrieval

memory_behavior: may_propose_memory_candidate_only_when_explicitly_allowed
approval_behavior: must_report_approval_need_only
scope_behavior: must_report_scope_gap

notes:
  - Retrieved does not mean evidence.
  - Evidence Candidate does not mean Evidence Pack approved.
