# Non-executable Hermes skill candidate template.
# This is not an installed Hermes skill. Bridges the architecture_devis_reprise
# vertical slice (docs/examples/vertical_devis_reprise/) to a future Hermes run.

template_id: quote_variation_review_skill_candidate
owner_layer: hermes
status: candidate_template_only
purpose: >
  Review a complementary quote (devis complémentaire) against the prior signed
  amendment and the project dossier, and return a candidate opinion with the
  points to verify. It never approves the quote, advises payment or sends anything.

capability_id: quote-variation-review
requires_task_contract: true
requires_context_pack: true

allowed_inputs:
  - the complementary quote
  - prior signed amendment
  - project dossier
  - task_contract
  - context_pack

allowed_outputs:
  - candidate opinion
  - point_to_verify
  - amount_or_scope_discrepancy_note
  - capability_gap

forbidden_outputs:
  - approval_final
  - payment_recommendation_as_final
  - external_send
  - quote_validated
  - canonical_memory

memory_behavior: may_propose_register_candidate_only_when_explicitly_allowed
approval_behavior: must_report_approval_need_only
scope_behavior: must_report_scope_gap

notes:
  - A discrepancy is returned as a point to verify, not a decision.
  - Candidate opinion does not mean the quote is approved.
