# Candidate only — merge this fragment into ~/.hermes/config.yaml on the
# external Hermes host after reviewing paths and the pinned Pantheon version.
#
# Presence in Pantheon Next does not mean installed, reachable, registered,
# approved or used.
#
# The executable and repository paths are deliberately versioned placeholders.
# Keep a previous working executable and checkout available for rollback.

mcp_servers:
  pantheon-policy:
    enabled: true
    command: "/opt/data/pantheon-mcp/<PANTHEON_VERSION>/venv/bin/pantheon-mcp-server"
    args: []

    env:
      # Mount the audited Pantheon checkout read-only at this path.
      PANTHEON_REPO_PATH: "/opt/pantheon-next-<COMMIT_SHORT>"

    # These tools only read governed sources or qualify caller-provided status.
    # The Hermes dashboard plugin remains the live observation producer; this
    # MCP does not probe Hermes or infer approval from dashboard labels.
    tools:
      include:
        - list_sources
        - read_doctrine
        - explain_governance_structure
        - get_consultation_catalog
        - explain_architecture
        - get_capability_status
      prompts: false
      resources: false

    # The policy/wiki server never needs to request model inference from Hermes.
    sampling:
      enabled: false

    # Conservative common-baseline default. The six tools are read-only, but
    # serialized calls simplify trace review and avoid claiming concurrency need.
    supports_parallel_tool_calls: false

# Do not copy a platform_toolsets.api_server entry from another Hermes release
# without testing that exact version. Dynamic MCP registration and the static
# /v1/toolsets catalog may expose different naming surfaces.
