$schema: "https://json-schema.org/draft/2020-12/schema"
title: Pantheon Hermes Distribution Lock
description: Template-only composition lock for an external Hermes installation. It pins reviewed artifacts and required checks without installing, activating or authorizing them.
type: object
required:
  - schema_id
  - revision
  - distribution_id
  - status
  - source_pins
  - components
  - required_checks
  - state
  - authority
  - governance_refs
properties:
  schema_id:
    const: pantheon.hermes_distribution_lock
  revision:
    const: 1
  distribution_id:
    type: string
    pattern: "^[a-z0-9._-]+$"
  status:
    type: string
    enum:
      - candidate
      - observed
      - qualified
      - retired
  source_pins:
    type: object
    required:
      - pantheon_next
      - pantheon_mvp
      - hermes_runtime
    properties:
      pantheon_next:
        $ref: "#/$defs/repositoryPin"
      pantheon_mvp:
        $ref: "#/$defs/repositoryPin"
      hermes_runtime:
        type: object
        required:
          - runtime_id
          - version
          - observation_ref
        properties:
          runtime_id:
            type: string
            minLength: 1
          version:
            type: string
            minLength: 1
          observation_ref:
            type: string
            minLength: 1
        additionalProperties: false
    additionalProperties: false
  components:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      required:
        - component_id
        - kind
        - source_repository
        - path
        - required
        - enabled_by_default
        - capabilities
      properties:
        component_id:
          type: string
          pattern: "^[a-z0-9._-]+$"
        kind:
          type: string
          enum:
            - run_binding
            - context_bridge
            - runtime_observer
            - skill
            - policy_mcp
            - dashboard
            - profile
            - configuration
        source_repository:
          type: string
          enum:
            - Pantheon-Next
            - pantheon-mvp
        path:
          type: string
          minLength: 1
          pattern: "^(?!/)(?!.*\\.\\.).+$"
        content_digest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        required:
          type: boolean
        enabled_by_default:
          type: boolean
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z0-9._-]+$"
        notes:
          type: string
      additionalProperties: false
  required_checks:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      required:
        - check_id
        - kind
        - required
      properties:
        check_id:
          type: string
          pattern: "^[a-z0-9._-]+$"
        kind:
          type: string
          enum:
            - static_structure
            - route_contract
            - plugin_contract
            - end_to_end
            - no_authority
        required:
          const: true
        command:
          type: string
        expected:
          type: string
      additionalProperties: false
  state:
    type: object
    required:
      - installation_state
      - activation_state
      - task_authorization_state
      - acceptance_state
    properties:
      installation_state:
        type: string
        enum:
          - not_observed
          - partially_observed
          - installed_observed
      activation_state:
        const: not_activated
      task_authorization_state:
        const: not_authorized
      acceptance_state:
        type: string
        enum:
          - not_run
          - passed
          - failed
          - inconclusive
      observation_refs:
        type: array
        uniqueItems: true
        items:
          type: string
    additionalProperties: false
  authority:
    type: object
    required:
      - installs_components
      - activates_binding
      - authorizes_tasks
      - dispatches_runs
      - accepts_results
      - admits_evidence
    properties:
      installs_components:
        const: false
      activates_binding:
        const: false
      authorizes_tasks:
        const: false
      dispatches_runs:
        const: false
      accepts_results:
        const: false
      admits_evidence:
        const: false
    additionalProperties: false
  governance_refs:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
$defs:
  repositoryPin:
    type: object
    required:
      - repository
      - ref
    properties:
      repository:
        type: string
        pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
      ref:
        type: string
        pattern: "^[a-f0-9]{40}$"
    additionalProperties: false
additionalProperties: false
x-boundary:
  governed_identity: false
  runtime_execution: false
  installation: false
  activation: false
  task_authorization: false
  dispatch: false
  provider_routing: false
  scheduler: false
  queue_system: false
  plugin_manager: false
  memory_promotion: false
  evidence_admission: false
