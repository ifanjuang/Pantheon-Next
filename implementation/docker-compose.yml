services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pantheon
      POSTGRES_PASSWORD: pantheon
      POSTGRES_DB: pantheon
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mvp -d mvp"]
      interval: 2s
      timeout: 2s
      retries: 15

  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.21.0
    profiles: ["documents"]
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "0"
    restart: unless-stopped

  cockpit-api:
    profiles: ["cockpit"]
    build: .
    environment:
      PANTHEON_PG_DSN: postgresql://pantheon:pantheon@pgvector:5432/mvp
      PANTHEON_DOCUMENT_ROOT: /documents
      PANTHEON_COCKPIT_API_KEY: ${PANTHEON_COCKPIT_API_KEY:-}
      PANTHEON_EDITOR_API_KEY: ${PANTHEON_EDITOR_API_KEY:-}
      PANTHEON_HERMES_API_KEY: ${PANTHEON_HERMES_API_KEY:-}
      PANTHEON_UPDATE_SIGNING_SECRET: ${PANTHEON_UPDATE_SIGNING_SECRET:-}
      PANTHEON_COCKPIT_PUBLIC_URL: ${PANTHEON_COCKPIT_PUBLIC_URL:-http://127.0.0.1:8081}
      PANTHEON_COCKPIT_HOST: 0.0.0.0
      PANTHEON_COCKPIT_PORT: 8081
    volumes:
      - ${PANTHEON_DOCUMENT_ROOT:-./dossiers}:/documents:ro
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      pgvector:
        condition: service_healthy
