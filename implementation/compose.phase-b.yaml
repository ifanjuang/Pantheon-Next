x-mvp-runtime: &mvp-runtime
  image: ${PANTHEON_MVP_IMAGE_NAME:-pantheon-mvp}:${PANTHEON_MVP_IMAGE_TAG:-phase-b}
  build:
    context: .
    dockerfile: Dockerfile

services:
  pgvector:
    image: ${MVP_PGVECTOR_IMAGE:?set MVP_PGVECTOR_IMAGE to a reviewed pinned pgvector image}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MVP_PG_USER:-pantheon_mvp}
      POSTGRES_PASSWORD: ${MVP_PG_PASSWORD:?set MVP_PG_PASSWORD outside the repository}
      POSTGRES_DB: ${MVP_PG_DB:-pantheon_mvp}
    volumes:
      - type: bind
        source: ${MVP_PG_DATA_PATH:?set MVP_PG_DATA_PATH outside the repository}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MVP_PG_USER:-pantheon_mvp} -d ${MVP_PG_DB:-pantheon_mvp}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - ai-net

  docling:
    image: ${DOCLING_IMAGE:?set DOCLING_IMAGE to a reviewed pinned Docling Serve image}
    restart: unless-stopped
    environment:
      DOCLING_SERVE_ENABLE_UI: "0"
    networks:
      - ai-net

  paperless-broker:
    image: ${PAPERLESS_BROKER_IMAGE:?set PAPERLESS_BROKER_IMAGE to a reviewed pinned Valkey image}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${PAPERLESS_BROKER_DATA_PATH:?set PAPERLESS_BROKER_DATA_PATH outside the repository}
        target: /data
    networks:
      - ai-net

  paperless-db:
    image: ${PAPERLESS_DB_IMAGE:?set PAPERLESS_DB_IMAGE to a reviewed pinned PostgreSQL image}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PAPERLESS_DB_NAME:-paperless}
      POSTGRES_USER: ${PAPERLESS_DB_USER:-paperless}
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD:?set PAPERLESS_DB_PASSWORD outside the repository}
    volumes:
      - type: bind
        source: ${PAPERLESS_DB_DATA_PATH:?set PAPERLESS_DB_DATA_PATH outside the repository}
        target: /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAPERLESS_DB_USER:-paperless} -d ${PAPERLESS_DB_NAME:-paperless}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - ai-net

  paperless:
    image: ${PAPERLESS_IMAGE:?set PAPERLESS_IMAGE to a reviewed pinned Paperless-ngx image}
    restart: unless-stopped
    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-broker:
        condition: service_started
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBNAME: ${PAPERLESS_DB_NAME:-paperless}
      PAPERLESS_DBUSER: ${PAPERLESS_DB_USER:-paperless}
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD:?set PAPERLESS_DB_PASSWORD outside the repository}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?set PAPERLESS_SECRET_KEY outside the repository}
      PAPERLESS_TIME_ZONE: ${PAPERLESS_TIME_ZONE:-Europe/Paris}
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-fra}
      PAPERLESS_URL: ${PAPERLESS_URL:-}
    volumes:
      - type: bind
        source: ${PAPERLESS_DATA_PATH:?set PAPERLESS_DATA_PATH outside the repository}
        target: /usr/src/paperless/data
      - type: bind
        source: ${PAPERLESS_MEDIA_PATH:?set PAPERLESS_MEDIA_PATH outside the repository}
        target: /usr/src/paperless/media
      - type: bind
        source: ${PAPERLESS_CONSUME_PATH:?set PAPERLESS_CONSUME_PATH outside the repository}
        target: /usr/src/paperless/consume
      - type: bind
        source: ${PAPERLESS_EXPORT_PATH:?set PAPERLESS_EXPORT_PATH outside the repository}
        target: /usr/src/paperless/export
    ports:
      - "${PAPERLESS_HOST_BIND:-127.0.0.1}:${PAPERLESS_HOST_PORT:-8000}:8000"
    networks:
      - ai-net

  paperless-gateway:
    <<: *mvp-runtime
    command: ["python", "-m", "mvp_vertical.paperless_gateway"]
    restart: unless-stopped
    depends_on:
      paperless:
        condition: service_started
    environment:
      PAPERLESS_API_URL: http://paperless:8000
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN:-}
      PANTHEON_POLICY_API_URL: http://pantheon-policy-api:8000
      PANTHEON_POLICY_API_KEY: ${PANTHEON_POLICY_API_KEY:?set PANTHEON_POLICY_API_KEY outside the repository}
      MVP_COCKPIT_API_KEY: ${MVP_COCKPIT_API_KEY:?set MVP_COCKPIT_API_KEY outside the repository}
      MVP_HERMES_API_KEY: ${MVP_HERMES_API_KEY:?set MVP_HERMES_API_KEY outside the repository}
      MVP_PAPERLESS_GATEWAY_HOST: 0.0.0.0
      MVP_PAPERLESS_GATEWAY_PORT: 8082
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - ai-net

  cockpit-api:
    <<: *mvp-runtime
    command: ["mvp-cockpit-api"]
    restart: unless-stopped
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      MVP_PG_DSN: ${MVP_PG_DSN:?set MVP_PG_DSN outside the repository}
      MVP_DOCUMENT_ROOT: /documents
      MVP_COCKPIT_API_KEY: ${MVP_COCKPIT_API_KEY:?set MVP_COCKPIT_API_KEY outside the repository}
      MVP_EDITOR_API_KEY: ${MVP_EDITOR_API_KEY:-}
      MVP_HERMES_API_KEY: ${MVP_HERMES_API_KEY:?set MVP_HERMES_API_KEY outside the repository}
      MVP_UPDATE_SIGNING_SECRET: ${MVP_UPDATE_SIGNING_SECRET:-}
      MVP_COCKPIT_PUBLIC_URL: ${MVP_COCKPIT_PUBLIC_URL:-http://cockpit-api:8081}
      MVP_COCKPIT_HOST: 0.0.0.0
      MVP_COCKPIT_PORT: 8081
    volumes:
      - type: bind
        source: ${MVP_DOCUMENT_ROOT:?set MVP_DOCUMENT_ROOT outside the repository}
        target: /documents
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - ai-net

  hermes:
    image: ${HERMES_IMAGE:?set HERMES_IMAGE to a reviewed pinned Hermes Agent image}
    command: ["gateway", "run"]
    restart: unless-stopped
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?set HERMES_API_SERVER_KEY outside the repository}
      HERMES_DASHBOARD: ${HERMES_DASHBOARD:-0}
      PANTHEON_PAPERLESS_GATEWAY_URL: http://paperless-gateway:8082
      MVP_HERMES_API_KEY: ${MVP_HERMES_API_KEY:?set MVP_HERMES_API_KEY outside the repository}
    volumes:
      - type: bind
        source: ${HERMES_DATA_PATH:?set HERMES_DATA_PATH outside the repository}
        target: /opt/data
    networks:
      - ai-net

  document-runtime-observer:
    <<: *mvp-runtime
    command: ["python", "-m", "mvp_vertical.document_runtime_network_observer"]
    restart: unless-stopped
    depends_on:
      paperless-gateway:
        condition: service_started
      docling:
        condition: service_started
      hermes:
        condition: service_started
    environment:
      MVP_COCKPIT_API_KEY: ${MVP_COCKPIT_API_KEY:?set MVP_COCKPIT_API_KEY outside the repository}
      PANTHEON_PAPERLESS_GATEWAY_URL: http://paperless-gateway:8082
      PANTHEON_POLICY_API_URL: http://pantheon-policy-api:8000
      PANTHEON_POLICY_API_KEY: ${PANTHEON_POLICY_API_KEY:?set PANTHEON_POLICY_API_KEY outside the repository}
      DOCLING_SERVE_URL: http://docling:5001
      DOCLING_SERVE_API_KEY: ${DOCLING_SERVE_API_KEY:-}
      HERMES_API_URL: http://hermes:8642
      HERMES_API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?set HERMES_API_SERVER_KEY outside the repository}
      MVP_RUNTIME_OBSERVER_HOST: 0.0.0.0
      MVP_RUNTIME_OBSERVER_PORT: 8083
      MVP_RUNTIME_OBSERVER_TIMEOUT: ${MVP_RUNTIME_OBSERVER_TIMEOUT:-8}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - ai-net

networks:
  ai-net:
    external: true
    name: ai-net
