name: Pantheon Architecture Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Convergence regressions can be introduced by application code, tests, docs
  # or workflow changes. Run the permanent guard on every pull request.
  pull_request:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pantheon-mvp
        uses: actions/checkout@v4
        with:
          path: pantheon-mvp

      - name: Resolve consumed Pantheon-Next authority pin
        id: authority-pin
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          ref = Path("pantheon-mvp/mvp_vertical/vendor/pantheon/UPSTREAM_COMMIT").read_text(encoding="utf-8").strip()
          if re.fullmatch(r"[0-9a-f]{40}", ref) is None:
              raise SystemExit(f"invalid Pantheon-Next authority pin: {ref!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"pantheon_next_ref={ref}\n")
          PY

      - name: Checkout consumed Pantheon-Next authority
        uses: actions/checkout@v4
        with:
          repository: ifanjuang/Pantheon-Next
          ref: ${{ steps.authority-pin.outputs.pantheon_next_ref }}
          path: Pantheon-Next

      - name: Checkout current Pantheon-Next for report-only drift
        uses: actions/checkout@v4
        with:
          repository: ifanjuang/Pantheon-Next
          ref: main
          path: Pantheon-Next-current

      - name: Install distribution validation dependencies
        run: python -m pip install "PyYAML>=6" "jsonschema>=4"

      - name: Resolve distribution schema pin
        id: distribution-pin
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          manifest = yaml.safe_load(
              Path("pantheon-mvp/hermes/distribution/pantheon-standard.lock.yaml").read_text(encoding="utf-8")
          )
          ref = manifest["source_pins"]["pantheon_next"]["ref"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"pantheon_next_ref={ref}\n")
          PY

      - name: Checkout Pantheon-Next distribution schema pin
        uses: actions/checkout@v4
        with:
          repository: ifanjuang/Pantheon-Next
          ref: ${{ steps.distribution-pin.outputs.pantheon_next_ref }}
          path: Pantheon-Next-distribution

      - name: Generate pinned convergence reports
        run: |
          mkdir -p audit-output
          python pantheon-mvp/tools/audit_pantheon_architecture.py \
            --repository pantheon-mvp=implementation="$PWD/pantheon-mvp" \
            --repository Pantheon-Next=governance="$PWD/Pantheon-Next" \
            --authority-registry "$PWD/Pantheon-Next/docs/governance/authority/PANTHEON_SYSTEM_OWNERSHIP_REGISTRY.json" \
            --output audit-output/PANTHEON_ARCHITECTURE_INVENTORY.md
          python pantheon-mvp/tools/audit_pantheon_architecture.py \
            --repository pantheon-mvp=implementation="$PWD/pantheon-mvp" \
            --repository Pantheon-Next=governance="$PWD/Pantheon-Next" \
            --authority-registry "$PWD/Pantheon-Next/docs/governance/authority/PANTHEON_SYSTEM_OWNERSHIP_REGISTRY.json" \
            --format json \
            --output audit-output/PANTHEON_ARCHITECTURE_INVENTORY.json
          python pantheon-mvp/tools/audit_module_usage.py \
            --repository pantheon-mvp=implementation="$PWD/pantheon-mvp" \
            --repository Pantheon-Next=governance="$PWD/Pantheon-Next" \
            --json-output audit-output/PANTHEON_MODULE_USAGE.json \
            --markdown-output audit-output/PANTHEON_MODULE_USAGE.md

      - name: Validate Hermes distribution composition
        run: |
          python pantheon-mvp/tools/check_hermes_distribution_lock.py \
            --manifest pantheon-mvp/hermes/distribution/pantheon-standard.lock.yaml \
            --schema Pantheon-Next-distribution/templates/hermes/distribution/distribution-lock.schema.yaml \
            --repository pantheon-mvp="$PWD/pantheon-mvp" \
            --repository Pantheon-Next="$PWD/Pantheon-Next" \
            --output audit-output/PANTHEON_HERMES_DISTRIBUTION.json

      - name: Enforce permanent convergence closure against consumed authority
        run: |
          python pantheon-mvp/tools/check_architecture_convergence_closure.py \
            --architecture-inventory audit-output/PANTHEON_ARCHITECTURE_INVENTORY.json \
            --module-usage audit-output/PANTHEON_MODULE_USAGE.json \
            --expected-repository pantheon-mvp \
            --expected-repository Pantheon-Next

      - name: Report current Pantheon-Next drift without changing the merge gate
        id: current-drift
        shell: bash
        run: |
          set +e
          mkdir -p audit-output/current-authority

          python pantheon-mvp/tools/audit_pantheon_architecture.py \
            --repository pantheon-mvp=implementation="$PWD/pantheon-mvp" \
            --repository Pantheon-Next=governance="$PWD/Pantheon-Next-current" \
            --authority-registry "$PWD/Pantheon-Next-current/docs/governance/authority/PANTHEON_SYSTEM_OWNERSHIP_REGISTRY.json" \
            --output audit-output/current-authority/PANTHEON_ARCHITECTURE_INVENTORY.md
          INVENTORY_MD=$?

          python pantheon-mvp/tools/audit_pantheon_architecture.py \
            --repository pantheon-mvp=implementation="$PWD/pantheon-mvp" \
            --repository Pantheon-Next=governance="$PWD/Pantheon-Next-current" \
            --authority-registry "$PWD/Pantheon-Next-current/docs/governance/authority/PANTHEON_SYSTEM_OWNERSHIP_REGISTRY.json" \
            --format json \
            --output audit-output/current-authority/PANTHEON_ARCHITECTURE_INVENTORY.json
          INVENTORY_JSON=$?

          python pantheon-mvp/tools/audit_module_usage.py \
            --repository pantheon-mvp=implementation="$PWD/pantheon-mvp" \
            --repository Pantheon-Next=governance="$PWD/Pantheon-Next-current" \
            --json-output audit-output/current-authority/PANTHEON_MODULE_USAGE.json \
            --markdown-output audit-output/current-authority/PANTHEON_MODULE_USAGE.md
          MODULE_USAGE=$?

          CLOSURE=2
          if [ "$INVENTORY_JSON" -eq 0 ] && [ "$MODULE_USAGE" -eq 0 ]; then
            python pantheon-mvp/tools/check_architecture_convergence_closure.py \
              --architecture-inventory audit-output/current-authority/PANTHEON_ARCHITECTURE_INVENTORY.json \
              --module-usage audit-output/current-authority/PANTHEON_MODULE_USAGE.json \
              --expected-repository pantheon-mvp \
              --expected-repository Pantheon-Next
            CLOSURE=$?
          fi

          STATUS=clean
          if [ "$INVENTORY_MD" -ne 0 ] || [ "$INVENTORY_JSON" -ne 0 ] || [ "$MODULE_USAGE" -ne 0 ] || [ "$CLOSURE" -ne 0 ]; then
            STATUS=drift_or_error
          fi

          printf 'status=%s\n' "$STATUS" >> "$GITHUB_OUTPUT"
          printf 'consumed_pantheon_next_ref=%s\ncurrent_pantheon_next_ref=main\nstatus=%s\ninventory_markdown_exit=%s\ninventory_json_exit=%s\nmodule_usage_exit=%s\nclosure_exit=%s\n' \
            "${{ steps.authority-pin.outputs.pantheon_next_ref }}" "$STATUS" "$INVENTORY_MD" "$INVENTORY_JSON" "$MODULE_USAGE" "$CLOSURE" \
            > audit-output/current-authority/DRIFT_STATUS.txt
          exit 0

      - name: Publish job summary
        if: always()
        run: |
          if [ -f audit-output/PANTHEON_ARCHITECTURE_INVENTORY.md ]; then
            cat audit-output/PANTHEON_ARCHITECTURE_INVENTORY.md >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          if [ -f audit-output/PANTHEON_MODULE_USAGE.md ]; then
            cat audit-output/PANTHEON_MODULE_USAGE.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f audit-output/PANTHEON_HERMES_DISTRIBUTION.json ]; then
            printf '\n---\n\n## Hermes distribution composition\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat audit-output/PANTHEON_HERMES_DISTRIBUTION.json >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\n---\n\n## Current Pantheon-Next drift — report only\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Merge gate authority pin: `%s`  \n' "${{ steps.authority-pin.outputs.pantheon_next_ref }}" >> "$GITHUB_STEP_SUMMARY"
          printf 'Current-main comparison status: `%s`  \n\n' "${{ steps.current-drift.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          printf 'A current-main difference is a drift signal only. Correction remains a reviewed re-vendoring change.\n' >> "$GITHUB_STEP_SUMMARY"
          if [ -f audit-output/current-authority/DRIFT_STATUS.txt ]; then
            printf '\n```text\n' >> "$GITHUB_STEP_SUMMARY"
            cat audit-output/current-authority/DRIFT_STATUS.txt >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload architecture inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pantheon-architecture-inventory
          path: audit-output/
          if-no-files-found: error
          retention-days: 14
