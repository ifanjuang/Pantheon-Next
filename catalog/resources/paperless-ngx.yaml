api_version: pantheon.next/v0alpha1
kind: Resource
metadata:
  id: paperless_ngx
  title: Paperless-ngx
  status: candidate
spec:
  resource_type: runtime
  provides_roles:
    - source_capture
    - document_persistence
    - document_versioning
    - document_full_text_search
    - document_metadata_management
    - basic_ocr
    - email_document_ingestion
  lifecycle:
    installable: true
    connectable_existing_instance: true
  interfaces:
    - rest_api
    - internal_http
    - task_status
    - webhook
  boundaries:
    pantheon_governance_authority: false
    business_classification_authority: false
    knowledge_authority: false
    evidence_authority: false
    source_bytes_backing_store_candidate: true
    external_ai_without_separate_gate: false
