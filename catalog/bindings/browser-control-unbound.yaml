apiVersion: pantheon.ifja.fr/v1alpha1
kind: CapabilityBinding
metadata:
  name: browser-control-unbound
spec:
  capability: browser_control
  status: unbound
  selected_provider: null
  candidates:
    - provider: hermes_native_browser
      posture: native_baseline
    - provider: agentrhq/webcmd
      posture: candidate
      qualification_ref: docs/governance/WEBCMD_BROWSER_QUALIFICATION.md
      tracking_issue: 1051
  rationale: >-
    Hermes native browser capability is the baseline. Webcmd is only a replaceable
    candidate and must demonstrate a material advantage on repeated/authenticated
    browser workflows before selection. Browser availability, successful execution,
    or local navigation memory do not authorize consequential effects or create
    Pantheon Memory, Knowledge, Evidence, or source authority.
