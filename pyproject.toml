[project]
name = "pantheon-next"
version = "0.1.59"
description = "Governance layer for agentic systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "IFJ Architecture" }
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "PyYAML>=6.0",
  "jsonschema>=4.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
