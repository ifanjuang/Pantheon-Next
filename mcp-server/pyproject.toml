[project]
name = "pantheon-mcp-server"
version = "0.1.0"
description = "Pantheon Next policy plane: read-only MCP server for doctrine, capability passports and policy decisions as data."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2",
    "PyYAML>=6.0",
    "jsonschema>=4.22",
]

# jsonschema is now a runtime dependency: the server validates candidate APU
# dossiers against the governance schemas (passport validation stays stdlib).
# The test extra is retained for any test-only additions.
[project.optional-dependencies]
test = [
    "jsonschema>=4.22",
]

[project.scripts]
pantheon-mcp-server = "pantheon_mcp.server:main"
pantheon-apu-validate = "pantheon_mcp.cli:main"
pantheon-verify-install = "pantheon_mcp.install_cli:main"
pantheon-verify-observability = "pantheon_mcp.observability_cli:main"
pantheon-verify-backup = "pantheon_mcp.backup_cli:main"
pantheon-verify-exposure = "pantheon_mcp.exposure_cli:main"
pantheon-verify-update = "pantheon_mcp.update_cli:main"
pantheon-load-verification-preset = "pantheon_mcp.presets_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pantheon_mcp"]
