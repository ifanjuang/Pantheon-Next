<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantheon Control — Base & Mémoire</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shell"></div>
<script src="data.js"></script>
<script src="nav.js"></script>
<script>
const cards = BASE.map(b=>
  '<div class="card"><h3>'+b.name+'</h3><p>'+b.role+'</p>'+chip(b.status[0],b.status[1])+'</div>'
).join('');

const note =
  '<div class="panel"><h3>Topologie</h3><pre>'+
    'PostgreSQL enregistre le registre gouverné (canon).\n'+
    'pgvector récupère par similarité — ne définit pas la vérité.\n'+
    'mem0 projette une mémoire utilisable — n’est pas le canon.\n'+
    'Hermes peut consommer/proposer — ne canonise pas.\n'+
    'Pantheon gouverne statut, scope, preuve et approbation.'+
  '</pre></div>';

mountPage(
  'Base & Mémoire',
  'Couche registre et données : canon PostgreSQL vs projections (pgvector / mem0).',
  'Le registre canonique reste indépendant de tout backend mémoire. Une projection est explicite, réversible et auditable — jamais source de vérité.',
  '<div class="grid">'+cards+'</div>' + note
);
</script>
</body>
</html>
