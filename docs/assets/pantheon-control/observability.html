<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantheon Control — Observabilité</title>
<link rel="stylesheet" href="style.css?v=20260620-mobile-drawer-2">
</head>
<body>
<div id="shell"></div>
<script src="data.js?v=20260620-mobile-drawer-2"></script>
<script src="nav.js?v=20260620-mobile-drawer-2"></script>
<script>
const LANGFUSE = {
  enabled: true,
  uiUrl: 'http://localhost:3000',
  healthUrl: 'http://localhost:3000/api/public/health',
  mode: 'external_link',
  embeddedView: false,
  traceVisibility: 'synthetic_refs_only',
  retention: '7 jours',
  governanceStatus: ['Candidate','blue'],
  runtimeStatus: ['Non testé','muted']
};

function setHealth(status, tone, text){
  document.getElementById('lf-health-chip').outerHTML = chip(status, tone).replace('<span','<span id="lf-health-chip"');
  document.getElementById('lf-health-detail').textContent = text;
}

async function checkLangfuseHealth(){
  setHealth('Vérification…', 'yellow', 'Health check en cours depuis le navigateur. Si CORS bloque, tester depuis le host runtime.');
  try{
    const res = await fetch(LANGFUSE.healthUrl, {method:'GET', cache:'no-store', credentials:'omit'});
    if(res.ok){
      setHealth('Reachable', 'green', 'Langfuse répond au health check. Statut gouvernance inchangé : candidate.');
      return;
    }
    setHealth('Degraded', 'orange', 'Réponse HTTP '+res.status+'. Ne pas émettre de trace client.');
  }catch(e){
    setHealth('Unavailable', 'red', 'Langfuse indisponible depuis cette page. Vérifier host, réseau, CORS ou service non lancé.');
  }
}

const card =
  '<div class="panel">'+
    '<h3>Observabilité — Langfuse '+chip('link-only','blue')+' '+chip('health-only','blue')+'</h3>'+ 
    '<p>Trace runtime uniquement. Une trace réussie ne vaut ni preuve, ni approbation, ni mémoire canonique.</p>'+ 
    '<div class="grid two">'+
      '<div class="card"><h3>Accès</h3>'+ 
        '<div class="kv"><span>Mode</span><b>'+LANGFUSE.mode+'</b></div>'+ 
        '<div class="kv"><span>URL</span><b>'+LANGFUSE.uiUrl+'</b></div>'+ 
        '<div class="kv"><span>Iframe</span><b>disabled</b></div>'+ 
        '<p><a class="primary-link" href="'+LANGFUSE.uiUrl+'" target="_blank" rel="noopener noreferrer">Ouvrir Langfuse</a></p>'+ 
      '</div>'+ 
      '<div class="card"><h3>Santé</h3>'+ 
        '<div class="kv"><span>Statut</span><b><span id="lf-health-chip" class="chip muted">Unknown</span></b></div>'+ 
        '<div class="kv"><span>Endpoint</span><b>'+LANGFUSE.healthUrl+'</b></div>'+ 
        '<p><button class="primary" onclick="checkLangfuseHealth()">Vérifier santé</button></p>'+ 
        '<p id="lf-health-detail" class="hint">Aucun health check exécuté.</p>'+ 
      '</div>'+ 
    '</div>'+ 
  '</div>';

const boundaries =
  '<div class="grid two">'+
    '<div class="panel"><h3>Ce que la carte peut faire</h3>'+ 
      '<ul class="queue">'+ 
        '<li>Afficher si Langfuse est configuré et atteignable.</li>'+ 
        '<li>Ouvrir Langfuse dans un nouvel onglet interne.</li>'+ 
        '<li>Afficher uniquement des références de traces synthétiques.</li>'+ 
        '<li>Distinguer statut runtime et statut gouverné.</li>'+ 
      '</ul>'+ 
    '</div>'+ 
    '<div class="panel"><h3>Ce que la carte refuse</h3>'+ 
      '<ul class="queue">'+ 
        '<li>Iframe Langfuse pendant le premier test.</li>'+ 
        '<li>Clé API Langfuse dans le navigateur.</li>'+ 
        '<li>Traces de dossiers clients avant revue de redaction.</li>'+ 
        '<li>Trace = preuve, approval, mémoire ou autorisation.</li>'+ 
      '</ul>'+ 
    '</div>'+ 
  '</div>';

const synthetic =
  '<div class="panel"><h3>Première trace attendue</h3>'+ 
    '<div class="kv"><span>Dossier</span><b>synthetic-demo</b></div>'+ 
    '<div class="kv"><span>Case</span><b>synthetic-langfuse-health</b></div>'+ 
    '<div class="kv"><span>Effet demandé</span><b>read_only</b></div>'+ 
    '<div class="kv"><span>Approval ceiling</span><b>C0</b></div>'+ 
    '<div class="kv"><span>Memory behavior</span><b>none</b></div>'+ 
    '<div class="kv"><span>Trace visibility</span><b>'+LANGFUSE.traceVisibility+'</b></div>'+ 
    '<div class="kv"><span>Rétention test</span><b>'+LANGFUSE.retention+'</b></div>'+ 
    '<p class="hint">Données fictives uniquement. Aucun nom client, adresse, contrat, mail ou document réel.</p>'+ 
  '</div>';

mountPage(
  'Observabilité',
  'Carte Langfuse link-only : santé opérationnelle, accès externe et traces synthétiques. Aucun effet probatoire.',
  card + boundaries + synthetic
);
</script>
</body>
</html>
