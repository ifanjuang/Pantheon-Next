<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantheon Control — Surveillance</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shell"></div>
<script src="data.js"></script>
<script src="nav.js"></script>
<script>
// Les checks sont exécutés par le mcp-server (doctor checks read-only).
// Le dashboard AFFICHE les résultats ; il ne les exécute pas.
const checks = CHECKS.map(c=>
  '<div class="card"><h3>T'+c.id+' · '+c.label+'</h3>'+chip(c.result[0],c.result[1])+'</div>'
).join('');

function refresh(){
  document.getElementById('stamp').textContent =
    'Affichage rafraîchi depuis le mcp-server à '+new Date().toLocaleTimeString('fr-FR')+' (lecture seule).';
}

const audit = AUDIT.map(a=>
  '<li><span class="t">'+a.t+'</span><br>'+a.msg+'</li>').join('');

const body =
  '<div class="toolbar"><button onclick="refresh()">Rafraîchir l’affichage</button>'+
    '<span class="meta" id="stamp">Résultats fournis par les doctor checks read-only du mcp-server.</span></div>' +
  '<div class="grid">'+checks+'</div>' +
  '<div class="panel"><h3>Journal d’audit (append-only)</h3><ul class="queue">'+audit+'</ul></div>';

mountPage(
  'Surveillance',
  'Résultats des doctor checks read-only et journal d’audit.',
  'Le dashboard affiche les checks exécutés par le mcp-server ; il n’exécute aucun test lui-même. Le journal d’audit est append-only.',
  body
);
</script>
</body>
</html>
