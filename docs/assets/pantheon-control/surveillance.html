<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantheon Control — Journal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shell"></div>
<script src="data.js"></script>
<script src="nav.js"></script>
<script>
const controles = CONTROLES.map(c=>
  '<div class="card"><h3>'+c.label+'</h3>'+chip(c.resultat[0],c.resultat[1])+'</div>').join('');
const journal = JOURNAL.map(j=>
  '<li><span class="t">'+j.t+'</span><br>'+j.msg+'</li>').join('');

const body =
  '<h3 class="chapter">Contrôles automatiques</h3><div class="grid">'+controles+'</div>'+
  '<div class="panel"><h3>Journal d’activité</h3><ul class="queue">'+journal+'</ul></div>';

mountPage('Journal', 'Contrôles automatiques et historique des actions.', body);
</script>
</body>
</html>
