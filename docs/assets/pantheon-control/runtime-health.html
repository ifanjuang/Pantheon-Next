<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantheon Control — Santé / Runtime</title>
<link rel="stylesheet" href="style.css?v=20260703-runtime-health-2">
<style>
.rh-hero{position:relative;overflow:hidden;border:1px solid var(--line-2);border-radius:24px;background:radial-gradient(circle at 18% 12%,rgba(136,187,255,.18),transparent 34%),radial-gradient(circle at 88% 22%,rgba(117,225,170,.12),transparent 32%),linear-gradient(145deg,#10141c,#0b0d12 62%,#111827);padding:18px;margin-bottom:18px}
.rh-hero:after{content:"OBSERVATION";position:absolute;right:-14px;bottom:-18px;font-size:clamp(54px,12vw,132px);font-weight:1000;letter-spacing:-.09em;color:rgba(255,255,255,.035);pointer-events:none}.rh-hero h3{margin:0 0 8px;font-size:20px}.rh-hero p{max-width:820px;margin:0 0 12px;color:var(--muted)}
.rh-flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}.rh-flow span{border:1px solid var(--line-2);border-radius:14px;background:rgba(8,10,13,.58);padding:10px;color:var(--muted);font-size:12px;text-align:center}.rh-flow b{display:block;color:var(--fg);font-size:13px;margin-bottom:2px}
.rh-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 16px}.rh-toolbar .hint{margin-left:auto;max-width:420px;text-align:right;color:var(--muted);font-size:12px}
.rh-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:18px}.rh-card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#10141c,#0c0f15);padding:15px;min-height:238px;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}.rh-card:hover{transform:translateY(-2px);border-color:rgba(136,187,255,.46);box-shadow:0 18px 60px rgba(0,0,0,.28)}
.rh-card:after{content:attr(data-word);position:absolute;right:-4px;bottom:-10px;font-size:44px;font-weight:1000;letter-spacing:-.08em;color:rgba(255,255,255,.035);pointer-events:none}.rh-card>*{position:relative;z-index:2}.rh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}.rh-head h3{margin:0;font-size:17px}.rh-kind{font-size:11px;color:#5b626d;text-transform:uppercase;letter-spacing:.08em}
.rh-status{display:flex;align-items:center;gap:9px;margin:10px 0 12px}.rh-dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 5px rgba(255,255,255,.04)}.rh-dot.healthy{background:var(--green);box-shadow:0 0 0 5px rgba(117,225,170,.1),0 0 22px rgba(117,225,170,.28)}.rh-dot.degraded{background:var(--orange);box-shadow:0 0 0 5px rgba(246,161,95,.1),0 0 22px rgba(246,161,95,.22)}.rh-dot.blocked{background:#a78bfa;box-shadow:0 0 0 5px rgba(167,139,250,.1)}.rh-dot.unknown,.rh-dot.stale{background:#6b7280}.rh-status b{font-size:22px;letter-spacing:-.05em;line-height:1}.rh-status small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.rh-kv{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;margin:10px 0}.rh-kv span{color:var(--muted);font-size:12px}.rh-kv b{font-size:12px;font-weight:650;overflow-wrap:anywhere}.rh-impact{border:1px solid var(--line-2);border-radius:14px;background:rgba(0,0,0,.22);padding:10px;margin:10px 0 0}.rh-impact strong{display:block;font-size:12px;margin-bottom:4px}.rh-impact p{margin:0;color:var(--muted);font-size:12px}.rh-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.rh-actions button{font-size:12px;padding:7px 9px}.rh-card[data-filtered="true"]{display:none}.rh-card.is-focused{border-color:var(--blue);box-shadow:0 0 0 1px rgba(136,187,255,.24),0 22px 70px rgba(0,0,0,.34)}
.rh-lanes{display:grid;grid-template-columns:1fr 1fr;gap:13px}.rh-lane{border:1px solid var(--line-2);border-radius:18px;background:var(--panel);padding:14px}.rh-lane h3{margin:0 0 10px;font-size:15px}.rh-event{position:relative;border:1px solid var(--line);border-radius:14px;background:#0b0e14;padding:10px 10px 10px 34px;margin:8px 0}.rh-event:before{content:"";position:absolute;left:13px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--blue)}.rh-event.warn:before{background:var(--orange)}.rh-event.block:before{background:var(--red)}.rh-event.ok:before{background:var(--green)}.rh-event strong{display:block;font-size:13px}.rh-event span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.rh-detail{border:1px solid var(--line-2);border-radius:20px;background:linear-gradient(145deg,#0f131b,#0b0d12);padding:15px;margin-bottom:18px}.rh-detail h3{margin:0 0 8px}.rh-detail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.rh-metric{border:1px solid var(--line);border-radius:14px;background:#0b0e14;padding:10px}.rh-metric span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.rh-metric b{display:block;font-size:19px;line-height:1.1;margin-top:5px}@media(max-width:980px){.rh-grid,.rh-lanes,.rh-detail-grid{grid-template-columns:1fr}.rh-flow{grid-template-columns:1fr}.rh-toolbar .hint{margin-left:0;text-align:left}}@media(prefers-reduced-motion:reduce){.rh-card{transition:none}.rh-card:hover{transform:none}}
</style>
</head>
<body>
<div id="shell"></div>
<script src="data.js?v=20260703-runtime-health-2"></script>
<script src="nav.js?v=20260703-runtime-health-2"></script>
<script>
const RH_SERVICES=[
{id:'openwebui',name:'OpenWebUI',type:'exposure_surface',word:'EXPOSE',status:'healthy',statusLabel:'healthy',version:'0.10.x target',probe:'simulated /health · /api/models',latency:'82 ms',last:'il y a 38 s',confidence:'medium',impact:'Exposition disponible. Les modèles peuvent rester dégradés indépendamment du cockpit.',allowed:['Afficher','Capturer décision','Afficher Evidence Pack'],blocked:['Gouverner','Exécuter','Canoniser']},
{id:'hermes',name:'Hermes Agent',type:'execution_runtime',word:'EXECUTE',status:'degraded',statusLabel:'degraded',version:'0.18.x target',probe:'simulated health probe · runs/recent',latency:'211 ms',last:'il y a 2 min',confidence:'low',impact:'Runtime déclaré partiel. Handoff seulement en candidate-only, jamais en approval.',allowed:['Recevoir Task Contract','Retourner Candidate','Retourner Trace'],blocked:['Approval','Mémoire canonique','Envoi externe sans gate']},
{id:'mcp',name:'MCP Pantheon',type:'policy_read_only',word:'VERIFY',status:'blocked',statusLabel:'read-only partial',version:'partial / to verify',probe:'simulated policy/status',latency:'44 ms',last:'il y a 1 min',confidence:'medium',impact:'Peut vérifier statut / structure. Ne devient pas runtime, approval engine ou sender.',allowed:['Status read-only','Policy check','Refusal fixture'],blocked:['Exécuter','Scheduler','Provider routing']},
{id:'langflow',name:'Langflow',type:'deterministic_preparation',word:'FLOW',status:'healthy',statusLabel:'healthy',version:'candidate adapter',probe:'simulated health_check',latency:'96 ms',last:'il y a 4 min',confidence:'medium',impact:'Préparation déterministe possible si le flow est déclaré et borné par Task Contract.',allowed:['Préparer','Transformer','Extraire candidat'],blocked:['Valider','Envoyer','Écrire mémoire']},
{id:'langgraph',name:'LangGraph',type:'durable_execution_candidate',word:'GRAPH',status:'unknown',statusLabel:'unknown',version:'unbound',probe:'none',latency:'—',last:'aucun check',confidence:'none',impact:'Non lié à ce prototype. Toute exécution durable reste externe et candidate.',allowed:['Trace si disponible','Runtime externe'],blocked:['Central runtime Pantheon','Auto-scope','Auto-approval']},
{id:'langsmith',name:'LangSmith / Langfuse',type:'observability_layer',word:'TRACE',status:'stale',statusLabel:'stale',version:'candidate',probe:'simulated trace summary',latency:'—',last:'il y a 37 min',confidence:'low',impact:'Trace utile pour diagnostic. Trace ≠ preuve, Evidence Pack ou approval.',allowed:['Lien trace','Résumé coût','Erreur runtime'],blocked:['Preuve automatique','Décision','Mémoire']},
{id:'github',name:'GitHub',type:'connector_gateway',word:'REPO',status:'healthy',statusLabel:'healthy',version:'API connector',probe:'simulated repo / PR / issues',latency:'137 ms',last:'il y a 22 s',confidence:'high',impact:'Source de pilotage repo. GitHub reste canonique pour le dépôt ; Notion reste pilotage.',allowed:['Lire PR','Lire issues','Créer PR si demandé'],blocked:['Contourner review','Promouvoir sans index','Écrire protégé sans accord']},
{id:'notion',name:'Notion Kanban',type:'pilotage_external',word:'PILOT',status:'healthy',statusLabel:'healthy',version:'external',probe:'simulated Kanban suivi gouvernance',latency:'173 ms',last:'il y a 48 s',confidence:'medium',impact:'Pilotage vivant. Ne remplace jamais repo, AUTHORITY_INDEX ou ai_log.',allowed:['Créer carte suivi','Mettre statut','Résumé décision'],blocked:['Doctrine canonique','Preuve repo','Runtime']}
];
const RH_EVENTS=[['ok','OpenWebUI signal','simulation · exposition disponible · aucun statut gouverné modifié'],['warn','Hermes last run','simulation · Evidence Pack Candidate incomplet · gate requis'],['ok','MCP Pantheon status','simulation · read-only · vérification disponible'],['block','External action preflight','simulation · blocked_by_approval · envoi externe interdit sans C3'],['warn','Trace observability','simulation · trace ancienne, non utilisable pour validation'],['ok','GitHub repo','simulation · PR / issues accessibles · repo canonique disponible']];
function rhChip(label,tone){return '<span class="chip '+(tone||'muted')+'">'+label+'</span>'}
function rhTone(s){return s==='healthy'?'green':s==='degraded'?'orange':s==='blocked'?'blue':s==='stale'?'yellow':'muted'}
function rhActionChip(label,tone){return '<span class="chip '+(tone||'muted')+'">'+label+'</span>'}
function renderRhCard(s){return '<article class="rh-card" data-id="'+s.id+'" data-kind="'+s.type+'" data-status="'+s.status+'" data-word="'+s.word+'"><div class="rh-head"><div><div class="rh-kind">'+s.type+'</div><h3>'+s.name+'</h3></div>'+rhChip(s.statusLabel,rhTone(s.status))+'</div><div class="rh-status"><span class="rh-dot '+s.status+'"></span><div><b>'+s.statusLabel+'</b><small>Dernier signal simulé · '+s.last+'</small></div></div><div class="rh-kv"><span>version</span><b>'+s.version+'</b><span>probe</span><b>'+s.probe+'</b><span>latence</span><b>'+s.latency+'</b><span>confiance</span><b>'+s.confidence+'</b></div><div class="rh-impact"><strong>Impact gouvernance</strong><p>'+s.impact+'</p></div><div class="rh-actions"><button onclick="rhFocus(\''+s.id+'\')">Voir détails</button><button onclick="rhMockProbe(\''+s.id+'\')">Probe simulé</button><button onclick="rhGate(\''+s.id+'\')">Impact gate simulé</button></div></article>'}
function renderRhDetail(s){return '<section class="rh-detail" id="rh-detail"><h3>Détail · '+s.name+' '+rhChip(s.statusLabel,rhTone(s.status))+' '+rhChip('observation only','blue')+'</h3><p class="lede">Résumé de santé simulé. Ne lance aucune tâche, ne crée aucune preuve et ne valide aucun résultat.</p><div class="rh-detail-grid"><div class="rh-metric"><span>can_expose</span><b>'+(s.type==='exposure_surface'?'yes':'n/a')+'</b></div><div class="rh-metric"><span>can_execute</span><b>'+(s.type==='execution_runtime'?'candidate':'no')+'</b></div><div class="rh-metric"><span>evidence</span><b>candidate only</b></div><div class="rh-metric"><span>external action</span><b>blocked</b></div></div><div class="grid two" style="margin-top:12px"><div class="card"><h3>Actions visibles</h3><p>'+s.allowed.map(x=>rhActionChip(x,'muted')).join(' ')+'</p></div><div class="card"><h3>Actions interdites</h3><p>'+s.blocked.map(x=>rhActionChip(x,'red')).join(' ')+'</p></div></div></section>'}
function renderRhEvents(){return RH_EVENTS.map(e=>'<div class="rh-event '+e[0]+'"><strong>'+e[1]+'</strong><span>'+e[2]+'</span></div>').join('')}
function renderRhPrototype(){const hero='<section class="rh-hero"><h3>Santé / Runtime '+rhChip('prototype statique','yellow')+' '+rhChip('read-only posture','blue')+'</h3><p>Vue de pilotage pour voir quels outils sont déclarés disponibles, ce que leur état peut bloquer, et ce que Pantheon peut afficher sans devenir runtime, scheduler ou outil DevOps.</p><div class="rh-flow"><span><b>Signal</b>statut déclaré</span><span><b>Adapter</b>normalise</span><span><b>Health candidate</b>horodaté</span><span><b>Card</b>affiche</span><span><b>Gate impact</b>signale / bloque visuellement</span></div></section>';const toolbar='<div class="rh-toolbar"><button onclick="rhFilter(\'all\')">Tous</button><button onclick="rhFilterStatus(\'degraded\')">Dégradés</button><button onclick="rhFilterStatus(\'stale\')">Stale</button><button onclick="rhFilter(\'execution_runtime\')">Runtimes</button><button onclick="rhFilter(\'observability_layer\')">Observabilité</button><span class="hint">Tous les signaux sont fictifs. Aucun appel réseau, aucun contrôle service, aucune écriture de statut.</span></div>';const grid='<section class="rh-grid" id="rh-grid">'+RH_SERVICES.map(renderRhCard).join('')+'</section>';const detail='<div id="rh-detail-host">'+renderRhDetail(RH_SERVICES[0])+'</div>';const lanes='<section class="rh-lanes"><div class="rh-lane"><h3>Trace simulée</h3>'+renderRhEvents()+'</div><div class="rh-lane"><h3>Règles de lecture</h3><div class="rh-event ok"><strong>Affichage</strong><span>Pantheon Control affiche des signaux candidats.</span></div><div class="rh-event warn"><strong>Qualification</strong><span>Un signal ne devient preuve qu’après Evidence Pack et gate.</span></div><div class="rh-event block"><strong>Interdiction</strong><span>La page ne lance, n’arrête, ne planifie et n’approuve rien.</span></div></div></section>';return hero+toolbar+detail+grid+lanes}
function rhFocus(id){const s=RH_SERVICES.find(x=>x.id===id);document.querySelectorAll('.rh-card').forEach(el=>el.classList.toggle('is-focused',el.getAttribute('data-id')===id));document.getElementById('rh-detail-host').innerHTML=renderRhDetail(s||RH_SERVICES[0]);toast('Détail simulé : '+(s?s.name:id),'blue')}
function rhMockProbe(id){const s=RH_SERVICES.find(x=>x.id===id);toast('Probe simulé : '+(s?s.name:id)+' · aucun appel réseau','green')}
function rhGate(id){const s=RH_SERVICES.find(x=>x.id===id);toast('Impact gate simulé : '+(s?s.name:id)+' · aucune décision modifiée','orange')}
function rhFilter(kind){document.querySelectorAll('.rh-card').forEach(el=>{el.dataset.filtered=kind!=='all'&&el.getAttribute('data-kind')!==kind?'true':'false'});toast(kind==='all'?'Tous les services affichés':'Filtre : '+kind,'blue')}
function rhFilterStatus(status){document.querySelectorAll('.rh-card').forEach(el=>{el.dataset.filtered=el.getAttribute('data-status')!==status?'true':'false'});toast('Filtre statut : '+status,'blue')}
mountPage('Santé / Runtime','Prototype statique : cartes de santé, trace simulée, impact de gouvernance. Pantheon observe et qualifie ; il ne devient pas runtime.',renderRhPrototype());
</script>
</body>
</html>
