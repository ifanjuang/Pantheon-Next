<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantheon Control — IA & Agents</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shell"></div>
<script src="data.js"></script>
<script src="nav.js"></script>
<script>
const hermes =
  '<div class="panel"><h3>Hermes Agent</h3>'+
    '<p>Runtime d’exécution. Produit des candidats sous Task Contract.</p>'+
    chip('Online','green')+' '+chip('Candidate-only','yellow')+
    '<p class="meta">Ne peut pas approuver, canoniser, promouvoir la mémoire, contourner les approbations ni fusionner.</p>'+
  '</div>';

const models = MODELS.map(m=>
  '<div class="card"><h3>'+m.name+'</h3><p>'+m.kind+' · '+m.use+'</p>'+chip('disponible','blue')+'</div>'
).join('');

mountPage(
  'IA & Agents',
  'Modèles Ollama du LAN et runtime Hermes.',
  'Hermes exécute mais ne gouverne pas. Les modèles sont des hôtes ; ils ne définissent ni la vérité ni l’approbation.',
  hermes + '<h3 style="margin:0 0 10px">Modèles LAN</h3><div class="grid">'+models+'</div>'
);
</script>
</body>
</html>
