<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantheon Control — Infrastructure</title>
<link rel="stylesheet" href="style.css?v=20260620-mobile-drawer-2">
</head>
<body>
<div id="shell"></div>
<script src="data.js?v=20260620-mobile-drawer-2"></script>
<script src="connections-data.js?v=20260621-connections-1"></script>
<script src="nav.js?v=20260703-editorial-nav-1"></script>
<script src="ui.js?v=20260621-pages-split-1"></script>
<script>
const servicesOnline = SERVICES.filter(s => s.etat[0] === 'En ligne').length;
const machinesOn = MACHINES.filter(m => m.etat[0] === 'Allumé').length;
const instancesOn = LOCAL_INSTANCES.filter(i => i.etat[0] === 'En ligne').length;
const connections = EXTERNAL_CONNECTIONS.filter(c => c.etat[0] === 'Connecté').length;
const accesses = ACCESS_CONNECTIONS.filter(c => c.etat[0] === 'Connecté').length;
const categories = [...new Set(SERVICES.map(s => s.categorie))];

const REVIT_CONNECTOR = {
  status: ['Non connecté', 'yellow'],
  source: 'À lire depuis le plugin Revit local',
  profile: 'Sandbox libre / configurable dans Revit',
  document: 'Aucun document actif reçu',
  heartbeat: 'Signal temps réel non branché dans cette maquette'
};

const REVIT_ACTIONS = [
  ['Lire / inspecter', 'Autorisé si connecteur actif', 'green', 'Projet, vue active, sélection, éléments visibles, paramètres.'],
  ['Capturer contexte visuel', 'Autorisé si profil actif', 'green', 'Image de vue, sélection, éléments visibles, Context Pack candidat.'],
  ['Annoter / paramétrer', 'Configurable côté Revit', 'yellow', 'Annotations, detail lines, paramètres de revue ou données bornées.'],
  ['Créer / modifier modèle archi', 'Configurable côté Revit', 'orange', 'Murs, portes, fenêtres, familles, façades : transaction nommée et log requis.'],
  ['Supprimer / sauvegarder / synchroniser', 'Bloqué par défaut', 'red', 'À sortir du V0 libre sauf activation locale explicite et traces renforcées.']
];

function serviceSummary(){
  return categories.map(cat => {
    const list = SERVICES.filter(s => s.categorie === cat);
    const on = list.filter(s => s.etat[0] === 'En ligne').length;
    return '<div class="card"><h3>'+cat+'</h3><p>'+on+'/'+list.length+' service(s) déclarés en ligne.</p><p class="t">État indicatif. Aucun pilotage réel.</p></div>';
  }).join('');
}

function connectionSummary(){
  return EXTERNAL_CONNECTIONS.concat(ACCESS_CONNECTIONS).map(c =>
    '<div class="card"><h3>'+c.nom+'</h3><p>'+c.usage+'</p><p class="t">'+c.etat[0]+' · '+c.type+'</p></div>'
  ).join('');
}

function machineSummary(){
  return MACHINES.map(m =>
    '<div class="card"><h3>'+m.nom+'</h3><p>'+m.gpu+' · '+m.ram+'</p><p class="t">'+m.etat[0]+' · aucune action machine depuis Pantheon.</p></div>'
  ).join('');
}

function revitActionMatrix(){
  return REVIT_ACTIONS.map(a =>
    '<div class="card"><h3>'+a[0]+'</h3>'+chip(a[1],a[2])+'<p>'+a[3]+'</p></div>'
  ).join('');
}

const html = `
<div class="panel">
  <h3>Infrastructure utile, sans console technique</h3>
  <p>Cette page remplace les anciennes pages techniques dispersées. Elle lit l’état déclaré de la pile ; elle ne lance aucun service, ne réveille aucune machine, n’installe rien et ne valide aucun connecteur.</p>
  <p><a href="#services" class="chip blue">Services</a><a href="#machines" class="chip blue">Machines</a><a href="#revit" class="chip blue">Revit</a><a href="#installations" class="chip blue">Installations</a><a href="#observabilite" class="chip blue">Observabilité</a><a href="#sources" class="chip blue">Sources</a><a href="#journal" class="chip blue">Journal</a></p>
</div>

<div class="grid three">
  <div class="card"><h3>Services</h3><p>${servicesOnline}/${SERVICES.length} services déclarés en ligne.</p><p class="t">Disponibilité déclarée, pas autorisation d’usage.</p></div>
  <div class="card"><h3>Machines</h3><p>${machinesOn}/${MACHINES.length} machines allumées · ${instancesOn}/${LOCAL_INSTANCES.length} instances en ligne.</p><p class="t">Disponibilité technique, pas preuve de capacité.</p></div>
  <div class="card"><h3>Revit</h3><p>${REVIT_CONNECTOR.status[0]}</p><p class="t">Statut à lire en temps réel depuis le connecteur local.</p></div>
</div>

<div class="panel" id="services">
  <h3>Services & connexions</h3>
  <p>Le cockpit affiche ce qui est déclaré disponible. Il ne configure pas les comptes, ne route pas les appels et ne donne pas d’autorisation d’action.</p>
  <div class="grid three">${serviceSummary()}</div>
  <details>
    <summary>Voir les connexions déclarées</summary>
    <div class="grid three" style="margin-top:12px">${connectionSummary()}</div>
  </details>
</div>

<div class="panel" id="machines">
  <h3>Machines & instances</h3>
  <p>Les machines et modèles restent des capacités d’exécution ou de calcul. Pantheon ne réveille pas une machine, ne démarre pas un modèle et ne transforme pas une disponibilité technique en permission d’usage.</p>
  <details>
    <summary>Voir les machines déclarées</summary>
    <div class="grid three" style="margin-top:12px">${machineSummary()}</div>
  </details>
</div>

<div class="panel" id="revit">
  <h3>Connecteur Revit</h3>
  <p>Le dashboard doit afficher l’état temps réel du connecteur Revit local et la matrice des actions autorisées. La configuration de ces autorisations reste côté plugin Revit ; Pantheon Control lit, affiche, signale et demande qualification.</p>
  <div class="grid three">
    <div class="card"><h3>État connecteur</h3>${chip(REVIT_CONNECTOR.status[0],REVIT_CONNECTOR.status[1])}<p>${REVIT_CONNECTOR.heartbeat}</p><p class="t">Aucune connexion réelle dans cette maquette.</p></div>
    <div class="card"><h3>Profil actif</h3><p>${REVIT_CONNECTOR.profile}</p><p class="t">Profil choisi dans Revit, pas imposé par Pantheon.</p></div>
    <div class="card"><h3>Document actif</h3><p>${REVIT_CONNECTOR.document}</p><p class="t">À recevoir du plugin : nom RVT, vue active, sélection, worksharing.</p></div>
  </div>
  <details open>
    <summary>Actions autorisées / configurables</summary>
    <div class="grid three" style="margin-top:12px">${revitActionMatrix()}</div>
  </details>
  <p class="hint">Lecture cible : connecté, version Revit, document actif, vue active, sélection, profil local, actions autorisées, dernier log, dernière transaction, stop/disable visible.</p>
</div>

<div class="panel" id="installations">
  <h3>Installations & bootstrap</h3>
  <p>Les installations, mises à jour, rollback, profils machine, health checks réels, clés API, routages, files d’attente et automatisations restent hors Pantheon.</p>
  <div class="grid three">
    <div class="card"><h3>Avant</h3><p>Vérifier sauvegarde, accès admin, périmètre, version et rollback.</p><p class="t">Sans baseline, rien ne doit être présenté comme prêt.</p></div>
    <div class="card"><h3>Après</h3><p>Classer l’état : absent, inconnu, dégradé, disponible, à vérifier.</p><p class="t">Disponible techniquement ne veut pas dire admis.</p></div>
    <div class="card"><h3>Admission</h3><p>Une capacité utile reste candidate tant que ses effets et limites ne sont pas qualifiés.</p><p class="t">Plugin installé ≠ capacité approuvée.</p></div>
  </div>
</div>

<div class="panel" id="observabilite">
  <h3>Observabilité</h3>
  <p>L’observabilité relit l’exécution : modèle, coût, erreur, trace, durée, sortie. Elle ne remplace pas les sources, l’Evidence Pack, l’approbation ou la mémoire validée.</p>
  <div class="grid three">
    <div class="card"><h3>Trace</h3><p>Décrit ce qui s’est passé.</p><p class="t">Trace ≠ preuve.</p></div>
    <div class="card"><h3>Santé</h3><p>Signale un état technique ou un blocage.</p><p class="t">Health check ≠ validation métier.</p></div>
    <div class="card"><h3>Détail runtime</h3><p><a href="runtime-health.html" class="primary-link">Ouvrir Santé / Runtime</a></p><p class="t">Prototype détaillé, hors navigation principale.</p></div>
  </div>
</div>

<div class="panel" id="sources">
  <h3>Fichiers & sources</h3>
  <p>Un fichier reçu, lu ou retrouvé peut devenir une source proposée. Il ne devient pas automatiquement une preuve.</p>
  <div class="grid three">
    <div class="card"><h3>Reçu</h3><p>Document présent dans le périmètre.</p><p class="t">Présent ne veut pas dire fiable.</p></div>
    <div class="card"><h3>Lu</h3><p>Contenu extrait, résumé ou consulté.</p><p class="t">Lu ne veut pas dire vérifié.</p></div>
    <div class="card"><h3>Retenu</h3><p>Source candidate si elle est datée, sourcée et compatible avec le périmètre.</p><p class="t">Source proposée ≠ preuve validée.</p></div>
  </div>
</div>

<div class="panel" id="journal">
  <h3>Journal & contrôles</h3>
  <p>Le journal rend visibles les signaux, demandes et blocages. Il ne doit pas donner l’impression d’un contrôle automatique qui décide seul.</p>
  <div class="grid three">
    <div class="card"><h3>Signal</h3><p>Un état ou une anomalie est visible.</p><p class="t">À qualifier.</p></div>
    <div class="card"><h3>Blocage</h3><p>Un effet externe, une mémoire ou une preuve manque de validation.</p><p class="t">À arbitrer.</p></div>
    <div class="card"><h3>Décision</h3><p>Le système peut préparer une décision à revoir.</p><p class="t">L’humain décide.</p></div>
  </div>
</div>`;

mountPage('Infrastructure', 'Lecture compacte : services, machines, Revit, installations, observabilité, sources et journal.', html);
</script>
</body>
</html>
