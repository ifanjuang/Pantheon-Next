function sources(c){return c.src.map(s=>'<div class="src"><b>'+s[0]+' · '+esc(s[3])+'</b><span>'+esc(s[1])+' · Date '+s[2]+' · Indice '+esc(s[4])+'</span><span>Force '+esc(s[5])+' · Statut '+esc(s[6])+'</span><code>MD '+esc(s[7])+' · PDF '+esc(s[8])+'</code></div>').join('')}
function deps(c){return [['Amont',c.am,(c.rel.up||[])[0]],['Aval',c.av,(c.rel.down||[])[0]],['Même',c.peer,(c.rel.peer||[])[0]]].map(d=>'<button class="dep" data-goto="'+esc(d[2]||'')+'"><b>'+d[0]+'</b><span>'+esc(d[1])+'</span><code>'+esc(d[2]||'—')+'</code></button>').join('')}
function card(c,pi){let p=projects[pi];return'<article class="swiper-slide sSlide"><div class="card '+(c.risk==='Critique'?'crit':'')+'" data-p="'+pi+'" data-id="'+c.id+'"><div class="top"><div class="meta">'+esc(p.name.toUpperCase())+' · '+esc(c.id)+'<br><span class="phase">'+esc(p.phase)+'</span><br>Date 16/06/2026</div><div class="risk">'+esc(c.risk)+'<br><b>Butoir '+esc(c.due)+'</b></div></div><div class="title"><h3>'+esc(c.title)+'</h3>'+icon(c.ico)+'</div>'+chips(c)+'<div class="ops"><div class="op"><b>Statut</b>'+esc(c.status)+'</div><div class="op"><b>Décideur attendu</b>'+esc(c.decider)+'</div></div><div class="body"><section class="sec"><h4>Sources</h4>'+sources(c)+'</section><section class="sec"><h4>Constat</h4><p><b>Établi</b> · '+esc(c.est)+'</p><p><b>Incertain</b> · '+esc(c.inc)+'</p></section><section class="sec"><h4>Actions recommandées</h4><div class="line"><b>Action</b><span>'+esc(c.act)+'</span></div><div class="line"><b>Manque</b><span>'+esc(c.miss)+'</span></div><div class="line"><b>Décision</b><span>'+esc(c.dec)+'</span></div></section></div><div class="deps"><h4>Dépendances</h4>'+deps(c)+'</div><div class="actions"><button data-a="ok" data-id="'+c.id+'">Valider</button><button data-a="no" data-id="'+c.id+'">Refuser</button><button data-a="mod" data-id="'+c.id+'">Modifier</button><button data-a="more" data-id="'+c.id+'">Recherche+</button></div></div></article>'}
function renderProjects(){return projects.map((p,pi)=>'<section class="swiper-slide pSlide"><div class="swiper sSw"><div class="swiper-wrapper">'+p.cards.map(c=>card(c,pi)).join('')+'</div></div></section>').join('')}
function find(id){for(let pi=0;pi<projects.length;pi++){let ci=projects[pi].cards.findIndex(c=>c.id===id);if(ci>=0)return{pi,ci,c:projects[pi].cards[ci]}}}
function setHead(){let p=projects[selected.p];barProject.textContent=p.name;barPhase.textContent='Phase · '+p.phase+' · '+p.cards.length+' fiches'}
function goto(id){let f=find(id);if(!f){toast('Fiche liée absente : '+(id||'—'));return}selected={p:f.pi,id};pSw.slideTo(f.pi);setHead();setTimeout(()=>sSw[f.pi]?.slideTo(f.ci),40);closeOv()}
function relClass(c){if(c.id===selected.id)return'sel';let r=projects[selected.p].cards.find(x=>x.id===selected.id)?.rel||{};if((r.up||[]).includes(c.id))return'up';if((r.down||[]).includes(c.id))return'down';if((r.peer||[]).includes(c.id))return'peer';return''}
function openOv(pi,id){selected={p:+pi,id};setHead();renderOv();ov.classList.add('open')}
function closeOv(){ov.classList.remove('open')}
function renderOv(){let p=projects[selected.p];ovTitle.textContent=p.name+' · '+p.phase;ovSub.textContent='Mode dézoom · '+selected.id;ovGrid.innerHTML=p.cards.map(c=>'<button class="mini '+relClass(c)+'" data-mini="'+c.id+'"><h4>'+esc(c.title)+'</h4>'+chips(c)+'</button>').join('')}
function openAdd(){let p=projects[selected.p];panelTitle.textContent='Nouvelle fiche candidate';panelBody.innerHTML='<section class="sec"><h4>Projet / phase</h4><p>'+esc(p.name)+' · '+esc(p.phase)+'</p></section><section class="sec"><h4>Champs minimaux</h4><div class="line"><b>Titre</b><span>Nom court du point de contrôle</span></div><div class="line"><b>Source</b><span>Mail, PDF, MD, plan ou extraction à rattacher</span></div><div class="line"><b>Statut</b><span>À qualifier, à vérifier, contradictoire, bloquant</span></div><div class="line"><b>Décideur</b><span>Architecte, client, BET, mairie, entreprise, assureur</span></div></section><section class="sec"><h4>Limite</h4><p>Création candidate uniquement. Aucun registre n’est modifié.</p><button data-a="candidate">Préparer candidate</button></section>';panel.classList.add('open')}
function openPanel(a,id){let f=find(id),c=f?.c;panelTitle.textContent=a==='more'?'Recherche complémentaire':'Fiche de revue';panelBody.innerHTML=a==='more'?'<section class="sec"><h4>Manques ciblés</h4><div class="line"><b>Manque</b><span>'+esc(c.miss)+'</span></div><div class="line"><b>Décision</b><span>'+esc(c.dec)+'</span></div></section><section class="sec"><h4>Workflow</h4><p>Base projet → courriels → corpus technique → sources contrôlées → Evidence Candidate + Evidence Pack Candidate.</p></section>':'<section class="sec"><h4>Modification candidate</h4><p>Préparer une correction de fiche sans modifier le registre.</p></section>';panel.classList.add('open')}
function closePanel(){panel.classList.remove('open')}function info(){inf.classList.toggle('open')}function toast(s){to.textContent=s;to.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>to.classList.remove('show'),2200)}
function bind(){document.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};drag=false});document.addEventListener('pointermove',e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>12)drag=true});document.addEventListener('click',e=>{let c=e.target.closest('.card');if(c&&!drag&&!e.target.closest('button,input'))openOv(c.dataset.p,c.dataset.id);if(e.target.dataset.mini){if(e.target.dataset.mini===selected.id){let i=projects[selected.p].cards.findIndex(c=>c.id===selected.id);sSw[selected.p]?.slideTo(i);closeOv()}else{selected.id=e.target.dataset.mini;renderOv();let i=projects[selected.p].cards.findIndex(c=>c.id===selected.id);sSw[selected.p]?.slideTo(i)}}if(e.target.dataset.goto)goto(e.target.dataset.goto);if(e.target.dataset.close)closePanel(),closeOv();if(e.target.dataset.a){toast('Pantheon · intention candidate : '+e.target.dataset.a);if(['mod','more'].includes(e.target.dataset.a))openPanel(e.target.dataset.a,e.target.dataset.id)}})}
function init(){sSw=[...document.querySelectorAll('.sSw')].map(s=>new Swiper(s,{direction:'vertical',slidesPerView:1,spaceBetween:8,nested:true,threshold:8,touchAngle:35}));pSw=new Swiper('.pSw',{direction:'horizontal',slidesPerView:1,spaceBetween:8,threshold:8,touchAngle:35,on:{slideChange(){selected.p=this.activeIndex;selected.id=projects[selected.p].cards[0].id;setHead()}}});setHead()}
function render(){mountPage('Points de contrôle','',tpl.innerHTML.replace('__PROJECTS__',renderProjects()));bind();init()}
</script><template id="tpl"><div class="app"><header class="head"><div><b id="barProject">Points de contrôle</b><small id="barPhase">Phase · —</small></div><button onclick="openAdd()">+ Fiche</button><button onclick="info()">Infos</button></header><main class="stage"><div class="swiper pSw"><div class="swiper-wrapper">__PROJECTS__</div></div></main><aside id="inf" class="info"><p>Le header indique le projet, la phase et le nombre de fiches. Les exemples actifs incluent une clinique ABF et une rénovation chantier avec entreprise en procédure collective.</p></aside><aside id="panel" class="panel"><div class="ph"><div><h3 id="panelTitle">Fiche</h3><p>Transmission candidate Pantheon</p></div><button data-close="1">×</button></div><div id="panelBody" class="pb"></div><div class="pb"><button data-close="1">Fermer</button></div></aside><aside id="ov" class="ov"><div class="oh"><div><h3 id="ovTitle">Projet</h3><p id="ovSub">Mode dézoom</p></div><button data-close="1">×</button></div><div class="ob"><div id="ovGrid" class="grid"></div></div></aside><div id="to" class="toast"></div></div></template><script>render()</script></body></html>
