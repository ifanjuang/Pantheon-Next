<!doctype html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pantheon Control — Evidence</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<style>
body.ev-mode,body.ev-mode html{overflow:hidden;-webkit-text-size-adjust:100%}body.ev-mode .topbar,body.ev-mode .bc,body.ev-mode h2,body.ev-mode .lede{display:none}body.ev-mode .layout,body.ev-mode .content,body.ev-mode #page{height:100dvh;max-width:none;overflow:hidden}body.ev-mode .content{padding:6px}.ev{height:100%;display:grid;grid-template-rows:38px 1fr;gap:6px}.bar{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border:1px solid var(--line-2);border-radius:14px;background:#0b0d12;padding:5px 8px}.bar b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar span{font-size:11px;color:var(--muted)}.bar button{margin:0;border-radius:999px;padding:6px 9px;font-size:12px}.stage,.pSwiper,.pSwiper>.swiper-wrapper,.pSlide,.sSwiper,.sSwiper>.swiper-wrapper,.sSlide{height:100%}.pSwiper{touch-action:pan-x}.sSwiper,.sSlide,.card{touch-action:pan-y}.stage{border:0;border-radius:18px;background:#080a0d;overflow:hidden}.pSlide{padding:6px}.sSlide{display:flex}.card{height:100%;width:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto auto;gap:5px;border:1px solid var(--line);border-top:4px solid var(--orange);border-radius:17px;background:var(--card);padding:8px;overflow:hidden}.card.critical{border-top-color:var(--red)}.top{display:grid;grid-template-columns:1fr auto;gap:8px}.meta,.risk{font-size:10.5px;color:var(--muted);line-height:1.25}.risk{text-align:right}.risk b{color:var(--orange)}.critical .risk b{color:var(--red)}.title{display:grid;grid-template-columns:1fr 26px;gap:8px;align-items:start}.ico{width:24px;height:24px;display:grid;place-items:center;background:transparent;color:#fff}.ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.card h3{margin:0;font-size:clamp(16px,4.9vw,22px);line-height:1.05}.chips{display:flex;gap:4px;flex-wrap:wrap}.chip{border:1px solid var(--line-2);border-radius:999px;padding:2px 7px;font-size:10px;color:var(--muted)}.body{min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#0a0d12;padding:0 8px}.sec{padding:5px 0;border-top:1px solid var(--line)}.sec:first-child{border-top:0}.sec h4,.depsBox h4{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#6f7783;margin:0 0 3px}.sec p,.sec li{font-size:10.8px;line-height:1.23;color:#cdd3dc;margin:0}.sources{display:grid;gap:4px}.src{border:1px solid var(--line);border-radius:10px;background:#11151d;padding:5px 6px;display:grid;gap:2px}.src b{font-size:10.5px;color:#fff;font-weight:600}.src span{font-size:10px;color:var(--muted);line-height:1.2}.src code{font-size:9.5px;color:var(--blue);background:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.depsBox{border:1px solid var(--line);border-radius:13px;background:#0a0d12;padding:6px 8px}.flow{display:grid;gap:4px}.dep{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;background:#11151d;padding:4px 6px;text-align:left;font-size:10.4px;color:#cdd3dc}.dep b{color:var(--muted);font-weight:600}.dep span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dep code{font-size:10px;color:var(--blue);background:transparent}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:3px}.actions button{margin:0;border-radius:11px;padding:6px 2px;font-size:9px;white-space:nowrap}.actions [data-act=valider]{color:var(--green);border-color:#2c4d3c}.actions [data-act=refuser]{color:var(--red);border-color:#4d2c2c}.actions [data-act=modifier]{color:var(--orange);border-color:#4d3a2a}.actions [data-act=recherche]{color:var(--blue);border-color:#2c3a4d}.panel,.info,.overview{position:fixed;z-index:90;border:1px solid var(--line-2);border-radius:16px;background:rgba(13,16,22,.98);box-shadow:0 22px 80px rgba(0,0,0,.48)}.panel{left:50%;top:46px;transform:translateX(-50%);width:min(720px,calc(100vw - 14px));display:none}.panel.open,.info.open,.overview.open{display:block}.panelHead,.ovHead{display:flex;justify-content:space-between;gap:8px;padding:10px;border-bottom:1px solid var(--line)}.panelHead h3,.ovHead h3{font-size:15px;margin:0}.panelHead p,.ovHead p{font-size:11px;color:var(--muted);margin:2px 0 0}.panelHead button,.ovHead button{width:32px;height:32px;border-radius:50%;margin:0}.panelBody{padding:10px}.info{right:7px;top:46px;width:min(350px,calc(100vw - 14px));display:none;padding:11px}.info p{font-size:11.5px;color:var(--muted)}.overview{left:7px;right:7px;top:46px;bottom:7px;display:none;overflow:hidden}.ovBody{height:calc(100% - 58px);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:10px}.miniGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mini{min-height:108px;border:1px solid var(--line);border-radius:14px;background:#0a0d12;padding:8px;text-align:left;display:grid;grid-template-rows:1fr auto;gap:6px}.mini h4{margin:0;font-size:11px;line-height:1.15;color:var(--fg)}.miniTitle{display:grid;grid-template-columns:1fr 22px;gap:5px;align-items:start}.mini .ico{width:20px;height:20px}.mini .ico svg{width:19px;height:19px}.mini .chips{gap:3px}.mini .chip{font-size:9px;padding:1px 5px}.mini.up{border-top:4px solid var(--orange)}.mini.down{border-bottom:4px solid var(--green)}.mini.peer{border-top:4px solid var(--yellow);border-bottom:4px solid var(--yellow)}.mini.selected{border-color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}.toast{position:fixed;left:50%;bottom:10px;transform:translateX(-50%) translateY(70px);z-index:100;background:#11141a;border:1px solid var(--line-2);border-radius:14px;padding:8px 10px;font-size:12px;transition:.2s}.toast.show{transform:translateX(-50%) translateY(0)}@media(max-height:720px){.card{gap:4px;padding:7px}.sec{padding:4px 0}.sec p,.sec li{font-size:10px}.src{padding:4px 5px}.actions button{font-size:8.7px;padding:5px 1px}.mini{min-height:96px}}
</style>
</head>
<body>
<div id="shell"></div>
<script src="nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
document.body.classList.add('ev-mode');
const projects=[{name:'Extension limite',cards:[{id:'EL-301',icon:'geo',title:'Absence de bornage avant implantation',labels:['Géomètre','À examiner','Risque élevé'],risk:'Élevée',due:'20/06/2026',sources:[{type:'Email',from:'Client',date:'14/06/2026',file:'email-client-bornage.eml',index:'SRC-01',md:'sources/EL-301_email_client.md',pdf:'—'},{type:'PDF',from:'Géomètre à confirmer',date:'15/06/2026',file:'plan-limite-extrait.pdf',index:'A',md:'sources/EL-301_plan_limite.md',pdf:'pdf/plan-limite-extrait_A_2026-06-15.pdf'},{type:'MD',from:'Agence',date:'16/06/2026',file:'note-revue-bornage.md',index:'REV-00',md:'sources/EL-301_note_revue.md',pdf:'—'}],constat:'La limite réelle de propriété n’est pas suffisamment établie.',rec:'Mettre le sujet en décision, contrôler la source et préparer une demande de pièce.',amont:'Rendez-vous ESQ',aval:'Décision implantation avant APS',pair:'Étude de sol',rel:{up:['EL-300'],down:['EL-302','EL-303'],peer:['EL-304']}},{id:'EL-302',icon:'structure',title:'Reconnaissance des fondations existantes',labels:['Technique','À produire','Risque élevé'],risk:'Élevée',due:'22/06/2026',sources:[{type:'Email',from:'BET structure',date:'16/06/2026',file:'mail-bet-reco-fondations.eml',index:'SRC-01',md:'sources/EL-302_mail_bet.md',pdf:'—'},{type:'PDF',from:'Agence',date:'16/06/2026',file:'photos-fondations-existant.pdf',index:'P01',md:'sources/EL-302_photos.md',pdf:'pdf/photos-fondations-existant_P01_2026-06-16.pdf'}],constat:'La stratégie structurelle dépend des fondations existantes.',rec:'Demander reconnaissance ciblée et retour structure.',amont:'EL-301',aval:'Choix structure',pair:'Étude de sol',rel:{up:['EL-301'],down:['EL-303'],peer:['EL-304']}},{id:'EL-303',icon:'urban',title:'Décalage du volume projet',labels:['Conception','Hypothèse','Risque moyen'],risk:'À traiter',due:'—',sources:[{type:'MD',from:'Agence',date:'16/06/2026',file:'option-decalage-volume.md',index:'ESQ-02',md:'sources/EL-303_option_decalage.md',pdf:'—'}],constat:'Le décalage réduit le risque sans le supprimer.',rec:'Présenter comme réduction de risque uniquement.',amont:'EL-301',aval:'Plan APS',pair:'Bornage',rel:{up:['EL-301','EL-302'],down:[],peer:['EL-304']}},{id:'EL-304',icon:'mail',title:'Courrier client avant APS',labels:['Mail','À préparer','Risque moyen'],risk:'À traiter',due:'21/06/2026',sources:[{type:'Email',from:'Client',date:'15/06/2026',file:'fil-client-limite-aps.eml',index:'SRC-02',md:'sources/EL-304_fil_client.md',pdf:'—'}],constat:'Le client doit comprendre le risque résiduel.',rec:'Préparer un courrier clair avec réserve sur limite.',amont:'EL-301',aval:'Accord poursuite APS',pair:'EL-303',rel:{up:['EL-301'],down:[],peer:['EL-303']}}]},{name:'Maison Lierre',cards:[{id:'ML-201',icon:'structure',title:'Fondations profondes imposées par étude de sol',labels:['Technique','À examiner','Risque élevé'],risk:'Critique',due:'20/06/2026',sources:[{type:'PDF',from:'Bureau géotechnique',date:'13/06/2026',file:'G2AVP_Maison-Lierre.pdf',index:'G2-AVP-B',md:'sources/ML-201_g2avp.md',pdf:'pdf/G2AVP_Maison-Lierre_B_2026-06-13.pdf'},{type:'Email',from:'BET structure',date:'14/06/2026',file:'mail-bet-fondations-profondes.eml',index:'SRC-01',md:'sources/ML-201_mail_bet.md',pdf:'—'}],constat:'Les fondations profondes modifient le principe constructif et le budget.',rec:'Ouvrir arbitrage, vérifier les sources et demander un avis complémentaire.',amont:'Étude de sol',aval:'Budget et choix structure',pair:'Adaptation plans',rel:{up:['ML-200'],down:['ML-202','ML-203'],peer:['ML-204']}},{id:'ML-202',icon:'budget',title:'Impact budget structure',labels:['Budget','À décider','Risque élevé'],risk:'Élevée',due:'23/06/2026',sources:[{type:'PDF',from:'BET structure',date:'15/06/2026',file:'estimation-impact-structure.pdf',index:'EST-01',md:'sources/ML-202_estimation.md',pdf:'pdf/estimation-impact-structure_EST-01_2026-06-15.pdf'}],constat:'Le budget doit être révisé avant engagement.',rec:'Mettre le sujet en décision client.',amont:'ML-201',aval:'Devis entreprises',pair:'ML-204',rel:{up:['ML-201'],down:['ML-203'],peer:['ML-204']}},{id:'ML-203',icon:'rules',title:'Vérification DTU / règles structure',labels:['DTU','Recherche','Risque moyen'],risk:'À traiter',due:'—',sources:[{type:'MD',from:'Corpus technique',date:'16/06/2026',file:'extraction-dtu-structure.md',index:'DTU-REF-00',md:'sources/ML-203_dtu_structure.md',pdf:'—'}],constat:'Une vérification technique doit compléter la preuve.',rec:'Lancer Recherche+ sur corpus DTU et règles métier.',amont:'ML-201',aval:'Evidence Pack',pair:'ML-204',rel:{up:['ML-201'],down:[],peer:['ML-204']}},{id:'ML-204',icon:'plans',title:'Adaptation plans APS',labels:['Plans','À modifier','Risque moyen'],risk:'À traiter',due:'25/06/2026',sources:[{type:'PDF',from:'Agence',date:'16/06/2026',file:'APS_Maison-Lierre_plans.pdf',index:'APS-03',md:'sources/ML-204_plans_aps.md',pdf:'pdf/APS_Maison-Lierre_plans_APS-03_2026-06-16.pdf'}],constat:'Les plans doivent intégrer le nouveau principe constructif.',rec:'Préparer une modification candidate.',amont:'ML-201',aval:'Version APS',pair:'ML-202',rel:{up:['ML-201'],down:[],peer:['ML-202','ML-203']}}]}];
let pSwiper,sSwipers=[],selected={p:0,id:'EL-301'},timer,down=null,drag=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function svg(k){const d={geo:'<circle cx="12" cy="12" r="7"/><path d="M12 3v18M3 12h18"/>',structure:'<path d="M4 20h16M6 20V9l6-5 6 5v11M9 20v-7h6v7"/>',urban:'<path d="M4 20h16V6h6v14M14 20V10h4v10M8 9h2M8 13h2M16 13h1"/>',mail:'<rect x="4" y="6" width="16" height="12" rx="2"/><path d="M4 8l8 6 8-6"/>',budget:'<path d="M15 6c-5-2-9 1-9 6s4 8 9 6M4 10h10M4 14h10"/>',rules:'<path d="M7 4h10v16H7zM9 8h6M9 12h6M9 16h3"/>',plans:'<path d="M4 5h16v14H4zM8 5v14M4 10h16M12 10v9"/>'}[k]||'<circle cx="12" cy="12" r="7"/>';return'<span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24">'+d+'</svg></span>'}
function sourceRows(xs){return'<div class="sources">'+xs.map(s=>'<div class="src"><b>'+esc(s.type)+' · '+esc(s.file)+'</b><span>'+esc(s.from)+' · Date '+esc(s.date)+' · Indice '+esc(s.index)+'</span><code>MD '+esc(s.md)+' · PDF '+esc(s.pdf)+'</code></div>').join('')+'</div>'}
function depRow(label,text,id){return'<button class="dep" data-goto="'+esc(id||'')+'"><b>'+label+'</b><span>'+esc(text)+'</span><code>'+esc(id||'—')+'</code></button>'}
function deps(c){return'<div class="flow">'+depRow('Amont',c.amont,(c.rel.up||[])[0])+depRow('Aval',c.aval,(c.rel.down||[])[0])+depRow('Même',c.pair,(c.rel.peer||[])[0])+'</div>'}
function chips(c){return'<div class="chips">'+c.labels.map(l=>'<span class="chip">'+esc(l)+'</span>').join('')+'</div>'}
function depsBox(c){return'<div class="depsBox"><h4>Dépendances</h4>'+deps(c)+'</div>'}
function card(c,pi){return'<article class="swiper-slide sSlide"><div class="card '+(c.risk==='Critique'?'critical':'')+'" data-p="'+pi+'" data-id="'+c.id+'"><div class="top"><div class="meta">'+esc(projects[pi].name.toUpperCase())+' · '+esc(c.id)+'<br>Date 16/06/2026</div><div class="risk">'+esc(c.risk)+'<br><b>Butoir '+esc(c.due)+'</b></div></div><div class="title"><h3>'+esc(c.title)+'</h3>'+svg(c.icon)+'</div>'+chips(c)+'<div class="body"><section class="sec"><h4>Sources</h4>'+sourceRows(c.sources)+'</section><section class="sec"><h4>Constat</h4><p>'+esc(c.constat)+'</p></section><section class="sec"><h4>Actions recommandées</h4><p>'+esc(c.rec)+'</p></section></div>'+depsBox(c)+'<div class="actions"><button data-act="valider">Valider</button><button data-act="refuser">Refuser</button><button data-act="modifier">Modifier</button><button data-act="recherche">Recherche+</button></div></div></article>'}
function renderProjects(){return projects.map((p,pi)=>'<section class="swiper-slide pSlide"><div class="swiper sSwiper"><div class="swiper-wrapper">'+p.cards.map(c=>card(c,pi)).join('')+'</div></div></section>').join('')}
function findCard(id){for(let pi=0;pi<projects.length;pi++){let ci=projects[pi].cards.findIndex(c=>c.id===id);if(ci>=0)return{pi,ci,c:projects[pi].cards[ci]}}return null}
function gotoCard(id){let f=findCard(id);if(!f){toast('Fiche liée absente de cette maquette : '+(id||'—'));return}selected={p:f.pi,id};pSwiper.slideTo(f.pi);setTimeout(()=>sSwipers[f.pi]?.slideTo(f.ci),40);closeOverview();}
function openOverview(pi,id){selected={p:+pi,id};renderOverview();document.getElementById('overview').classList.add('open')}
function closeOverview(){document.getElementById('overview').classList.remove('open')}
function relClass(c,sel){if(c.id===sel.id)return'selected';let r=projects[sel.p].cards.find(x=>x.id===sel.id)?.rel||{};if((r.up||[]).includes(c.id))return'up';if((r.down||[]).includes(c.id))return'down';if((r.peer||[]).includes(c.id))return'peer';return''}
function renderOverview(){let p=projects[selected.p];document.getElementById('ovTitle').textContent=p.name;document.getElementById('ovSub').textContent='Mode dézoom · '+selected.id+' sélectionné';document.getElementById('ovGrid').innerHTML=p.cards.map(c=>'<button class="mini '+relClass(c,selected)+'" data-mini="'+c.id+'"><h4 class="miniTitle"><span>'+esc(c.title)+'</span>'+svg(c.icon)+'</h4>'+chips(c)+'</button>').join('')}
function panel(kind){let search=kind==='recherche';document.getElementById('panelTitle').textContent=search?'Recherche complémentaire':'Fiche de revue';document.getElementById('panelBody').innerHTML=search?'<section class="sec"><h4>Workflow</h4><div class="flow"><div><b>1 · Base projet</b> · vérifier surfaces, dates, décisions, pièces et statuts connus.</div><div><b>2 · Courriels</b> · rechercher échanges client, mairie, BET, entreprises et assurance.</div><div><b>3 · Corpus DTU / règles</b> · vérifier normes, DTU, règles métier et notes techniques.</div><div><b>4 · Résultat</b> · produire un Evidence Candidate + Evidence Pack Candidate.</div><div><b>5 · Retour Pantheon</b> · soumettre à validation humaine, sans effet automatique.</div></div></section>':'<section class="sec"><h4>Modification candidate</h4><p>Préparer une correction ou une demande de précision sur cette fiche, sans modifier le registre.</p></section>';document.getElementById('panel').classList.add('open')}
function closePanel(){document.getElementById('panel').classList.remove('open')}
function info(){document.getElementById('info').classList.toggle('open')}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),2200)}
function bind(){document.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};drag=false});document.addEventListener('pointermove',e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>12)drag=true});document.addEventListener('click',e=>{let card=e.target.closest('.card');if(card&&!drag&&!e.target.closest('button,input'))openOverview(card.dataset.p,card.dataset.id);if(e.target.dataset.mini){if(e.target.dataset.mini===selected.id){let idx=projects[selected.p].cards.findIndex(c=>c.id===selected.id);sSwipers[selected.p]?.slideTo(idx);closeOverview()}else{selected.id=e.target.dataset.mini;renderOverview();let idx=projects[selected.p].cards.findIndex(c=>c.id===selected.id);sSwipers[selected.p]?.slideTo(idx)}}if(e.target.dataset.goto)gotoCard(e.target.dataset.goto);if(e.target.dataset.close)closePanel(),closeOverview();if(e.target.dataset.act){toast('Pantheon · intention candidate : '+e.target.dataset.act);if(['modifier','recherche'].includes(e.target.dataset.act))panel(e.target.dataset.act)}down=null;drag=false})}
function init(){if(!window.Swiper)return;sSwipers=[...document.querySelectorAll('.sSwiper')].map(s=>new Swiper(s,{direction:'vertical',slidesPerView:1,spaceBetween:8,nested:true,threshold:8,touchAngle:35}));pSwiper=new Swiper('.pSwiper',{direction:'horizontal',slidesPerView:1,spaceBetween:8,threshold:8,touchAngle:35,on:{slideChange(){selected.p=this.activeIndex}}})}
function render(){mountPage('Preuves & sources','',document.getElementById('tpl').innerHTML.replace('__PROJECTS__',renderProjects()));bind();init()}
</script>
<template id="tpl"><div class="ev"><header class="bar"><b>Preuves & sources</b><span>clic fiche = dézoom</span><button onclick="info()">Infos</button></header><main class="stage"><div class="swiper pSwiper"><div class="swiper-wrapper">__PROJECTS__</div></div></main><aside id="info" class="info"><p>Swipe vertical : sujet. Swipe horizontal : projet. Les sources affichent type, date, indice, fichier, lien MD et lien PDF. Les dépendances sont calées en bas de fiche.</p></aside><aside id="panel" class="panel"><div class="panelHead"><div><h3 id="panelTitle">Fiche</h3><p>Transmission candidate Pantheon</p></div><button data-close="1">×</button></div><div id="panelBody" class="panelBody"></div><div class="panelBody"><button data-close="1">Fermer</button></div></aside><aside id="overview" class="overview"><div class="ovHead"><div><h3 id="ovTitle">Projet</h3><p id="ovSub">Mode dézoom</p></div><button data-close="1">×</button></div><div class="ovBody"><div id="ovGrid" class="miniGrid"></div></div></aside><div id="toast" class="toast"></div></div></template><script>render()</script>
</body></html>
