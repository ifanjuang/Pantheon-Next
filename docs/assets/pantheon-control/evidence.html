<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pantheon Control — Evidence</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<style>
body.evidence-mode,body.evidence-mode html{overflow:hidden}body.evidence-mode .topbar,body.evidence-mode .bc,body.evidence-mode h2,body.evidence-mode .lede{display:none}body.evidence-mode .layout,body.evidence-mode .content,body.evidence-mode #page{height:100dvh;max-width:none;overflow:hidden}body.evidence-mode .content{padding:6px}.ev{height:100%;display:grid;grid-template-rows:38px 1fr;gap:6px}.evbar{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border:1px solid var(--line-2);border-radius:14px;background:#0b0d12;padding:5px 8px}.evbar b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.evbar span{font-size:11px;color:var(--muted)}.evbar button{margin:0;border-radius:999px;padding:6px 9px;font-size:12px}.evstage,.projectSwiper,.projectSwiper>.swiper-wrapper,.projectSlide,.subjectSwiper,.subjectSwiper>.swiper-wrapper,.subjectSlide{height:100%}.evstage{border:1px solid var(--line-2);border-radius:18px;background:#080a0d;overflow:hidden}.projectSlide{padding:6px}.subjectSlide{display:flex}.ecard{height:100%;width:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto auto;gap:5px;border:1px solid var(--line);border-top:4px solid var(--orange);border-radius:17px;background:var(--card);padding:8px;overflow:hidden}.ecard.critical{border-top-color:var(--red)}.etop{display:grid;grid-template-columns:1fr auto;gap:8px}.emeta,.erisk{font-size:10.5px;color:var(--muted);line-height:1.25}.erisk{text-align:right}.erisk b{color:var(--orange)}.ecard.critical .erisk b{color:var(--red)}.titleRow{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}.topicIcon{width:30px;height:30px;border:1px solid var(--line-2);border-radius:10px;display:grid;place-items:center;background:#10141c;font-size:16px;line-height:1;flex:0 0 auto}.ecard h3{margin:0;font-size:clamp(16px,4.9vw,22px);line-height:1.05}.chips{display:flex;gap:4px;flex-wrap:wrap}.chip{border:1px solid var(--line-2);border-radius:999px;padding:2px 7px;font-size:10px;color:var(--muted)}.body{min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#0a0d12;padding:0 8px}.sec{padding:5px 0;border-top:1px solid var(--line)}.sec:first-child{border-top:0}.sec h4{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#6f7783;margin:0 0 3px}.sec p,.sec li{font-size:10.8px;line-height:1.23;color:#cdd3dc;margin:0}.sec ul{margin:0;padding-left:15px}.flow{display:grid;gap:3px}.flow div{border:1px solid var(--line);border-radius:10px;background:#11151d;padding:4px 6px;font-size:10.4px;color:#cdd3dc}.note{display:grid;grid-template-columns:1fr auto;gap:5px}.note input{height:31px;border-radius:11px;border:1px solid var(--line);background:#07090d;color:var(--fg);padding:0 9px;font-size:11px}.note button,.actions button{margin:0;border-radius:11px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.actions button{padding:6px 2px;font-size:9px;white-space:nowrap}.panel,.info{position:fixed;z-index:90;border:1px solid var(--line-2);border-radius:16px;background:rgba(13,16,22,.98);box-shadow:0 22px 80px rgba(0,0,0,.48)}.panel{left:50%;top:46px;transform:translateX(-50%);width:min(720px,calc(100vw - 14px));display:none}.panel.open,.info.open{display:block}.panelHead{display:flex;justify-content:space-between;gap:8px;padding:10px;border-bottom:1px solid var(--line)}.panelHead h3{font-size:15px;margin:0}.panelHead p{font-size:11px;color:var(--muted);margin:2px 0 0}.panelHead button{width:32px;height:32px;border-radius:50%;margin:0}.panelBody{padding:10px}.info{right:7px;top:46px;width:min(350px,calc(100vw - 14px));display:none;padding:11px}.info p{font-size:11.5px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:10px;transform:translateX(-50%) translateY(70px);z-index:100;background:#11141a;border:1px solid var(--line-2);border-radius:14px;padding:8px 10px;font-size:12px;transition:.2s}.toast.show{transform:translateX(-50%) translateY(0)}@media(max-height:720px){.ecard{gap:4px;padding:7px}.sec{padding:4px 0}.sec p,.sec li{font-size:10px}.note input{height:28px}.actions button{font-size:8.7px;padding:5px 1px}.topicIcon{width:27px;height:27px;font-size:14px}}
</style>
</head>
<body>
<div id="shell"></div>
<script src="nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
document.body.classList.add('evidence-mode');
function panel(kind){
 const isSearch=kind==='search';
 document.getElementById('panelTitle').textContent=isSearch?'Recherche complémentaire':'Fiche de revue';
 document.getElementById('panelBody').innerHTML=isSearch?'<section class="sec"><h4>Workflow</h4><div class="flow"><div><b>1 · Base projet</b> · vérifier surfaces, dates, décisions, pièces et statuts connus.</div><div><b>2 · Courriels</b> · rechercher échanges client, mairie, BET, entreprises et assurance.</div><div><b>3 · Corpus DTU / règles</b> · vérifier normes, DTU, règles métier et notes techniques.</div><div><b>4 · Résultat</b> · produire un Evidence Candidate + Evidence Pack Candidate.</div><div><b>5 · Retour Pantheon</b> · soumettre à validation humaine, sans effet automatique.</div></div></section>':'<section class="sec"><h4>Modification candidate</h4><p>Préparer une correction ou une demande de précision sur cette fiche, sans modifier le registre.</p></section>';
 document.getElementById('panel').classList.add('open');
}
function closePanel(){document.getElementById('panel').classList.remove('open')}
function info(){document.getElementById('info').classList.toggle('open')}
function note(btn){const input=btn.previousElementSibling; toast(input.value?'Note locale ajoutée : '+input.value:'Note vide'); input.value=''}
let timer;function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),2200)}
function bind(){document.addEventListener('click',e=>{if(e.target.dataset.close)closePanel();if(e.target.dataset.act){toast('Pantheon · intention candidate : '+e.target.dataset.act);if(e.target.dataset.act==='modifier')panel('edit');if(e.target.dataset.act==='recherche')panel('search')}})}
function init(){if(!window.Swiper)return;new Swiper('.projectSwiper',{direction:'horizontal',slidesPerView:1,spaceBetween:8});document.querySelectorAll('.subjectSwiper').forEach(s=>new Swiper(s,{direction:'vertical',slidesPerView:1,spaceBetween:8,nested:true}))}
function render(){mountPage('Preuves & sources','',document.getElementById('template').innerHTML);bind();init()}
</script>
<template id="template">
<div class="ev">
<header class="evbar"><b>Extension limite</b><span>Projet 1/2 · sujet 1/1</span><button onclick="info()">Infos</button></header>
<main class="evstage"><div class="swiper projectSwiper"><div class="swiper-wrapper">
<section class="swiper-slide projectSlide"><div class="swiper subjectSwiper"><div class="swiper-wrapper"><article class="swiper-slide subjectSlide"><div class="ecard"><div class="etop"><div class="emeta">EXTENSION LIMITE · EL-301<br>Date 16/06/2026</div><div class="erisk">Élevée<br><b>Butoir 20/06/2026</b></div></div><div class="titleRow"><span class="topicIcon" aria-hidden="true">📐</span><h3>Absence de bornage avant implantation</h3></div><div class="chips"><span class="chip">Géomètre</span><span class="chip">À examiner</span><span class="chip">Risque élevé</span></div><div class="body"><section class="sec"><h4>Sources</h4><ul><li>Note rendez-vous client / phase ESQ</li><li>Plan de limite non contradictoire</li><li>Trace de décision à compléter</li></ul></section><section class="sec"><h4>Constat</h4><p>La limite réelle de propriété n’est pas suffisamment établie.</p></section><section class="sec"><h4>Actions recommandées</h4><p>Mettre le sujet en décision, contrôler la source et préparer une demande de pièce.</p></section><section class="sec"><h4>Amont · aval · même niveau</h4><div class="flow"><div><b>Amont</b> · rendez-vous ESQ</div><div><b>Aval</b> · décision d’implantation avant APS</div><div><b>Même niveau</b> · étude de sol</div></div></section></div><div class="note"><input placeholder="Laisser une note sur ce point"><button onclick="note(this)">Noter</button></div><div class="actions"><button data-act="valider">Valider</button><button data-act="refuser">Refuser</button><button data-act="modifier">Modifier</button><button data-act="recherche">Recherche+</button></div></div></article></div></div></section>
<section class="swiper-slide projectSlide"><div class="swiper subjectSwiper"><div class="swiper-wrapper"><article class="swiper-slide subjectSlide"><div class="ecard critical"><div class="etop"><div class="emeta">MAISON LIERRE · P-201<br>Date 16/06/2026</div><div class="erisk">Critique<br><b>Butoir 20/06/2026</b></div></div><div class="titleRow"><span class="topicIcon" aria-hidden="true">🏗️</span><h3>Fondations profondes imposées par l’étude de sol</h3></div><div class="chips"><span class="chip">Technique</span><span class="chip">À examiner</span><span class="chip">Risque élevé</span></div><div class="body"><section class="sec"><h4>Sources</h4><ul><li>Étude de sol</li><li>Note structure</li><li>Compte rendu projet</li></ul></section><section class="sec"><h4>Constat</h4><p>Les fondations profondes modifient le principe constructif et le budget.</p></section><section class="sec"><h4>Actions recommandées</h4><p>Ouvrir arbitrage, vérifier les sources et demander une pièce ou un avis complémentaire.</p></section><section class="sec"><h4>Amont · aval · même niveau</h4><div class="flow"><div><b>Amont</b> · étude de sol</div><div><b>Aval</b> · budget et choix structure</div><div><b>Même niveau</b> · adaptation plans</div></div></section></div><div class="note"><input placeholder="Laisser une note sur ce point"><button onclick="note(this)">Noter</button></div><div class="actions"><button data-act="valider">Valider</button><button data-act="refuser">Refuser</button><button data-act="modifier">Modifier</button><button data-act="recherche">Recherche+</button></div></div></article></div></div></section>
</div></div></main>
<aside id="info" class="info"><p>Gauche / droite : projet. Haut / bas : sujet. Recherche+ ouvre un workflow de recherche complémentaire. Les notes sont locales dans cette maquette.</p></aside>
<aside id="panel" class="panel"><div class="panelHead"><div><h3 id="panelTitle">Fiche</h3><p>Transmission candidate Pantheon</p></div><button data-close="1">×</button></div><div id="panelBody" class="panelBody"></div><div class="panelBody"><button data-close="1">Fermer</button></div></aside>
<div id="toast" class="toast"></div>
</div>
</template>
<script>render()</script>
</body></html>
