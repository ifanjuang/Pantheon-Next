body.evpage,body.evpage html{overflow:hidden}body.evpage .topbar{display:none}body.evpage .layout{height:100dvh;min-height:0}body.evpage .drawer{top:0}body.evpage .content{height:100dvh;max-width:none;padding:6px;overflow:hidden}body.evpage .bc,body.evpage h2,body.evpage .lede{display:none}body.evpage #page{height:100%}.ev{height:100%;display:grid;grid-template-rows:36px 1fr;gap:6px}.bar{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:14px;background:#0b0d12;padding:5px 7px;overflow:hidden}.bar b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar span{font-size:10.5px;color:var(--muted);white-space:nowrap}.bar button{margin:0;border-radius:999px;padding:6px 9px;font-size:12px}.stage{height:100%;border:1px solid var(--line-2);border-radius:18px;background:#080a0d;overflow:hidden}.pws,.pws>.swiper-wrapper,.project,.sws,.sws>.swiper-wrapper,.subject{height:100%}.project{padding:6px}.subject{display:flex}.card{--u:var(--blue);height:100%;width:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:5px;border:1px solid var(--line);border-top:4px solid var(--u);border-radius:17px;background:var(--card);padding:8px;overflow:hidden}.card[data-u=critical]{--u:var(--red)}.card[data-u=high]{--u:var(--orange)}.card[data-u=medium]{--u:var(--yellow)}.card[data-u=low]{--u:var(--green)}.top{display:grid;grid-template-columns:1fr auto;gap:6px}.id,.date,.risk,.due{font-size:10px;color:var(--muted);line-height:1.25}.id{text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.risk{text-align:right}.due{display:block;color:var(--orange);white-space:nowrap}.pill{display:inline-block;border:1px solid var(--line-2);border-radius:999px;padding:2px 7px;color:var(--fg)}.card h3{margin:0;font-size:clamp(16px,4.8vw,22px);line-height:1.04;letter-spacing:-.03em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;ov 10px;text-transform:uppercase;color:#6f7783}.psec p,.psec li{margin:0;font-size:12px;line-height:1.3;color:#cdd3dc}.psec ul{margin:0;padding-left:16px}.info{right:7px;top:44px;width:min(350px,calc(100vw - 14px));display:none;padding:11px}.info.open{display:block}.info p,.info li{font-size:11.5px;color:var(--muted);line-height:1.3}.toast{position:fixed;left:50%;bottom:10px;transform:translateX(-50%) translateY(70px);z-index:100;width:min(520px,calc(100vw - 20px));border:1px solid var(--line-2);border-radius:14px;background:#11141a;padding:8px 10px;font-size:12px;transition:.2s}.toast.show{transform:translateX(-50%) translateY(0)}@media(max-height:720px){.card{gap:4px;padding:7px}.sec{padding:4px 0}.sec p,.sec li{font-size:10px}.flow div{padding:3px 5px}.act button{font-size:8.7px;padding:5px 1px}}
</style></head><body><div id="shell"></div><script src="data.js"></script><script src="nav.js"></script><script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script><script>
document.body.classList.add('evpage');
const U={critical:['Critique','red'],high:['Élevée','orange'],medium:['À traiter','yellow'],low:['Stabilisée','green'],info:['Info','blue']};let ps,ss=[],tm;
function h(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function u(x){if((x.links||[]).some(l=>l.impact_level==='critical'))return'critical';if(x.risque?.[0]==='Élevé')return'high';if(x.risque?.[0]==='Moyen')return'medium';if(x.statut?.[0]==='Référence')return'low';return'info'}function r(x){let q=x.urgency||u(x);return q==='critical'?'Action recommandée : ouvrir un arbitrage, vérifier les sources et demander une pièce ou un avis complémentaire.':q==='high'?'Action recommandée : mettre le sujet en décision, contrôler la source et préparer une demande de pièce.':q==='medium'?'Action recommandée : garder pour revue simple et décider si un complément est nécessaire.':'Action recommandée : conserver comme information sans changement probatoire.'}function prep(x,i){let src=x.sources||[x.source,'Note interne de revue','Trace de décision à compléter'];return{...x,sources:src,links:x.links||[],urgency:x.urgency||u(x),date:x.date||'16/06/2026',due:x.due||(x.risque?.[0]==='Élevé'?'20/06/2026':'—'),recommendation:x.recommendation||r(x),amont:x.amont||'Source ou pièce à l’origine du sujet.',aval:x.aval||'Décision ou action qui dépend de cette fiche.',pair:x.pair||'Sujet parallèle à vérifier dans le même dossier.',idx:i}}
const A=EVIDENCE.map((x,i)=>prep({...x,affaire:'Maison Lierre'},i));const B=[prep({id:'EL-301',affaire:'Extension limite',sujet:'Absence de bornage avant implantation',nature:['Géomètre','blue'],source:'Note rendez-vous client / phase ESQ',statut:['À examiner','yellow'],risque:['Élevé','red'],urgency:'high',detail:'La limite réelle de propriété n’est pas suffisamment établie. Le projet ne doit pas être présenté comme sécurisé sans pièce de limite.',amont:'Rendez-vous ESQ + plan de limite non contradictoire.',aval:'Décision d’implantation et courrier client avant APS.',pair:'Étude de sol et reconnaissance des fondations.'},0)];const C=[prep({id:'CT-401',affaire:'Chantier terrasse',sujet:'Réserve sur évacuation EP',nature:['Réserve','orange'],source:'Compte rendu chantier + photo',statut:['À revoir','orange'],risque:['Élevé','red'],urgency:'critical',detail:'L’écoulement constaté peut affecter la levée de réserve et la responsabilité de reprise.',amont:'Photo chantier + CR de réception.',aval:'Levée ou maintien de réserve.',pair:'Devis complémentaire garde-corps.',links:[{relation:'impacte',to_id:'Levée de réserve',note:'arbitrage avant clôture',impact_level:'critical'}]},0)];const M=[{title:'Maison Lierre',items:A},{title:'Extension limite',items:B},{title:'Chantier terrasse',items:C}];
function chip(a,t){return'<span class="chip '+h(t||'')+'">'+h(a)+'</span>'}function find(id){return M.flatMap(m=>m.items).find(x=>x.id===id)}function srcs(x){return'<ul>'+x.sources.map(s=>'<li>'+h(s)+'</li>').join('')+'</ul>'}function deps(x){return'<div class="flow"><div><b>Amont</b> · '+h(x.amont)+'</div><div><b>Aval</b> · '+h(x.aval)+'</div><div><b>Même niveau</b> · '+h(x.pair)+'</div></div>'}
function body(x){return'<section class="sec"><h4>Sources</h4>'+srcs(x)+'</section><section class="sec"><h4>Constat / description</h4><p>'+h(x.detail)+'</p></section><section class="sec"><h4>Actions recommandées</h4><p>'+h(x.recommendation)+'</p></section><section class="sec"><h4>Sujet amont · décision aval · même niveau</h4>'+deps(x)+'</section>'}
function card(x,i,n){let z=U[x.urgency]||U.info;return'<article class="card" data-id="'+h(x.id)+'" data-u="'+h(x.urgency)+'"><div class="top"><div><div class="id">'+h(x.affaire)+' · '+h(x.id)+' · '+i+'/'+n+'</div><div class="date">Date '+h(x.date)+'</div></div><div class="risk"><span class="pill">'+h(z[0])+'</span><span class="due">Butoir '+h(x.due)+'</span></div></div><h3>'+h(x.sujet)+'</h3><div class="chips">'+chip(x.nature[0],x.nature[1])+chip(x.statut[0],x.statut[1])+chip('Risque '+x.risque[0],x.risque[1])+'</div><div class="body">'+body(x)+'</div><div class="act"><button class="green" data-act="valider" data-id="'+h(x.id)+'">Valider</button><button class="red" data-act="refuser" data-id="'+h(x.id)+'">Refuser</button><button class="orange" data-act="modifier" data-id="'+h(x.id)+'">Modifier</button><button class="blue" data-act="detail" data-id="'+h(x.id)+'">Détail+</button></div></article>'}
function slide(m){return'<section class="swiper-slide project"><div class="swiper sws"><div class="swiper-wrapper">'+m.items.map((x,i)=>'<div class="swiper-slide subject">'+card(x,i+1,m.items.length)+'</div>').join('')+'</div></div></section>'}function bar(){let m=M[ps?.activeIndex||0],i=ss[ps?.activeIndex||0]?.activeIndex||0;bt.textContent=m.title;bcnt.textContent='Projet '+((ps?.activeIndex||0)+1)+'/'+M.length+' · sujet '+(i+1)+'/'+m.items.length}function panel(x,t){pnl.innerHTML='<div class="ph"><div><h3>'+h(t)+'</h3><p>'+h(x.affaire)+' · '+h(x.sujet)+'</p></div><button onclick="closeP()">×</button></div><div class="pb"><section class="psec"><h4>Sources</h4>'+srcs(x)+'</section><section class="psec"><h4>Constat</h4><p>'+h(x.detail)+'</p></section><section class="psec"><h4>Actions recommandées</h4><p>'+h(x.recommendation)+'</p></section><section class="psec"><h4>Dépendances</h4>'+deps(x)+'</section><section class="psec"><h4>Limite</h4><p>Transmission candidate uniquement.</p></section></div>';pnl.classList.add('open')}function closeP(){pnl.classList.remove('open')}function info(){inf.classList.toggle('open')}function toast(s){evt.textContent=s;evt.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>evt.classList.remove('show'),2300)}
function bind(){document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{let x=find(b.dataset.id);toast('Pantheon · intention candidate : '+b.dataset.act+' · '+x.id);if(b.dataset.act==='modifier'||b.dataset.act==='detail')panel(x,'Fiche de revue')})}
function init(){if(!window.Swiper)return;ss=[...document.querySelectorAll('.sws')].map(el=>new Swiper(el,{direction:'vertical',slidesPerView:1,spaceBetween:8,nested:true,on:{slideChange:bar}}));ps=new Swiper('.pws',{direction:'horizontal',slidesPerView:1,spaceBetween:8,keyboard:{enabled:true},mousewheel:false,on:{slideChange:bar}})}function render(){mountPage('Preuves & sources','', '<div class="ev"><header class="bar"><b id="bt">Preuves</b><span id="bcnt">—</span><button onclick="info()">Infos</button></header><main class="stage"><div class="swiper pws"><div class="swiper-wrapper">'+M.map(slide).join('')+'</div></div></main><aside id="inf" class="info"><h3>Infos</h3><p>Gauche / droite : projet. Haut / bas : sujet. La fiche se lit comme un compte rendu : sources, constat, actions recommandées, dépendances.</p></aside><aside id="pnl" class="panel"></aside><div id="evt" class="toast"></div></div>');init();bind();bar()}render();
</script></body></html>
