<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantheon Control — Preuves</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shell"></div>
<script src="data.js"></script>
<script src="nav.js"></script>
<script>
// Source unique = le tableau EVIDENCE. Une action écrit une PROPOSITION dans le
// tableau (colonne proposition) ; seule une validation change le statut.
const ACTIONS = [
  ['Proposer la validation','Validé'],
  ['Signaler un doute','En doute'],
  ['Proposer le retrait','Retiré'],
  ['Archiver','Archivé'],
];
const TON = {Validé:'green', 'En doute':'orange', Retiré:'red', Archivé:'muted'};
function maintenant(){ return new Date().toISOString().slice(0,16).replace('T',' '); }

function proposer(id,cible){ const e=EVIDENCE.find(x=>x.id===id); e.proposition=cible; render(); }
function valider(id){ const e=EVIDENCE.find(x=>x.id===id); const av=e.statut[0];
  e.statut=[e.proposition, TON[e.proposition]||'yellow'];
  JOURNAL.unshift({t:maintenant(), msg:e.id+' : '+av+' → '+e.proposition+' (validé par l’humain).'});
  e.proposition=null; render(); }
function rejeter(id){ const e=EVIDENCE.find(x=>x.id===id);
  JOURNAL.unshift({t:maintenant(), msg:'Proposition sur '+e.id+' refusée ; statut inchangé ('+e.statut[0]+').'});
  e.proposition=null; render(); }

function render(){
  const cartes = EVIDENCE.map(e=>
    '<div class="card"><h3>'+e.id+' · '+e.sujet+'</h3>'+
      '<p>'+e.pourquoi+'</p>'+
      chip(e.statut[0],e.statut[1])+' '+chip('Risque '+e.risque[0],e.risque[1])+
      (e.proposition?' '+chip('proposé → '+e.proposition,'blue'):'')+
      '<p>'+ACTIONS.map(a=>'<button onclick="proposer(\''+e.id+'\',\''+a[1]+'\')">'+a[0]+'</button>').join('')+'</p>'+
    '</div>').join('');

  const enAttente = EVIDENCE.filter(e=>e.proposition);
  const validation = enAttente.length ? enAttente.map(e=>
    '<li><b>'+e.id+'</b> : '+e.statut[0]+' → '+e.proposition+
    '<p><button class="primary" onclick="valider(\''+e.id+'\')">Valider</button>'+
    '<button onclick="rejeter(\''+e.id+'\')">Refuser</button></p></li>').join('')
    : '<li class="t">Aucune proposition en attente.</li>';

  const impacts = IMPACTS.map(i=>
    '<li><b>'+i.declencheur+'</b> '+chip(i.gravite[0],i.gravite[1])+
    '<br><span class="t">touche : '+i.touche+'</span></li>').join('');

  mountPage(
    'Preuves',
    'Sources et décisions du dossier.',
    '<div class="grid">'+cartes+'</div>'+
    '<div class="panel"><h3>À valider</h3><ul class="queue">'+validation+'</ul></div>'+
    '<div class="panel"><h3>Conséquences à examiner</h3><ul class="queue">'+impacts+'</ul></div>'
  );
}
render();
</script>
</body>
</html>
