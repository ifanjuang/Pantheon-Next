<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantheon Control — Preuves</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shell"></div>
<script src="data.js"></script>
<script src="nav.js"></script>
<script>
const ACTIONS = [
  ['Proposer la validation','Validé'],
  ['Signaler un doute','En doute'],
  ['Proposer le retrait','Retiré'],
];
const TON = {Validé:'green','En doute':'orange',Retiré:'red','À revoir':'orange','Arbitrage requis':'red','À valider':'yellow',Supposition:'muted'};
const byId = id => EVIDENCE.find(e=>e.id===id);
function maintenant(){ return new Date().toISOString().slice(0,16).replace('T',' '); }
function noter(msg){ JOURNAL.unshift({t:maintenant(), msg}); }
let reviewSeq = 0;

function proposer(id,cible){ byId(id).proposition=cible; render(); }
function rejeter(id){ const e=byId(id); noter('Proposition sur '+e.id+' refusée ; statut inchangé ('+e.statut[0]+').'); e.proposition=null; render(); }

// Valider construit un impact_review (schéma) et applique la règle de cascade :
// critique → arbitrage requis (jamais de déclassement silencieux) ; sinon à revoir.
function valider(id){
  const e=byId(id); const av=e.statut[0];
  e.statut=[e.proposition, TON[e.proposition]||'green'];
  noter(e.id+' : '+av+' → '+e.proposition+' (validé).');
  if(e.proposition==='Validé' && (e.links||[]).length){
    const review_id='ir.'+e.id.toLowerCase()+'.'+(++reviewSeq);
    const impacted=e.links.map(l=>{
      const critical = l.impact_level==='critical';
      const impact_status = critical ? 'critical_arbitration'
        : (l.relation==='impacts' ? 'revalidate' : 'impact_detected');
      return {target_id:l.to_id, relation:l.relation, severity:l.impact_level||'none', impact_status, decision:'pending'};
    });
    noter('impact_review '+review_id+' ouvert (déclencheur '+e.id+', '+impacted.length+' cible(s)).');
    impacted.forEach(it=>{
      const t=byId(it.target_id);
      const critical = it.severity==='critical';
      if(t){
        t.statut = critical ? ['Arbitrage requis','red'] : ['À revoir','orange'];
        t.declasse = (critical?'Arbitrage requis':'À revoir')+' — '+it.impact_status+' (cascade de '+e.id+')';
      }
      noter(it.target_id+' : '+it.impact_status+(critical?' (arbitrage — jamais déclassé en silence)':'')+'.');
    });
  }
  e.proposition=null; render();
}

function kanban(id){ const e=byId(id); noter('Carte Kanban Hermes créée : recherche complémentaire sur '+e.id+' (« '+e.sujet+' »).'); demandes(); }
function email(id){ const e=byId(id); noter('E-mail préparé : demande de validation client pour '+e.id+' (« '+e.sujet+' »).'); demandes(); }
function demandes(){ render(); }

function cascadeZone(e){
  if(!e.links || !e.links.length) return '';
  const items = e.links.map(l=>{
    const t = byId(l.to_id);
    const cible = t ? '<b>'+l.to_id+'</b> ('+t.sujet+')' : l.to_id;
    const niv = l.impact_level==='critical' ? ' '+chip('critique → arbitrage','red') : '';
    return '<li>'+l.relation+' → '+cible+' — '+l.note+niv+'</li>';
  }).join('');
  return '<div class="cascade"><span class="lbl">⚠ Conséquences en cascade si validé</span><ul>'+items+'</ul></div>';
}

function carte(e){
  const declasse = e.declasse ? '<p class="warn">'+e.declasse+'</p>' : '';
  const alerte = e.alerte ? '<p class="warn">⚠ '+e.alerte+'</p>' : '';
  return '<div class="card">'+
    '<h3>'+e.id+' · '+e.sujet+'</h3>'+
    chip(e.nature[0],e.nature[1])+' '+chip(e.statut[0],e.statut[1])+' '+chip('Risque '+e.risque[0],e.risque[1])+
    (e.proposition?' '+chip('proposé → '+e.proposition,'blue'):'')+
    '<div class="kv"><span>Source</span><b>'+e.source+'</b></div>'+
    '<p>'+e.detail+'</p>'+
    alerte + declasse + cascadeZone(e)+
    '<p style="margin-top:10px">'+ACTIONS.map(a=>'<button onclick="proposer(\''+e.id+'\',\''+a[1]+'\')">'+a[0]+'</button>').join('')+'</p>'+
    '<p><button onclick="kanban(\''+e.id+'\')">Recherche complémentaire (Kanban Hermes)</button>'+
      '<button onclick="email(\''+e.id+'\')">Demande de validation (e-mail)</button></p>'+
  '</div>';
}

function render(){
  const cartes = EVIDENCE.map(carte).join('');
  const enAttente = EVIDENCE.filter(e=>e.proposition);
  const validation = enAttente.length ? enAttente.map(e=>
    '<li><b>'+e.id+'</b> : '+e.statut[0]+' → '+e.proposition+
    (e.proposition==='Validé' && (e.links||[]).length ? ' '+chip('cascade : '+e.links.length+' lien(s)','orange') : '')+
    '<p><button class="primary" onclick="valider(\''+e.id+'\')">Valider</button>'+
    '<button onclick="rejeter(\''+e.id+'\')">Refuser</button></p></li>').join('')
    : '<li class="t">Aucune proposition en attente.</li>';

  mountPage(
    'Preuves',
    'Éléments du dossier, leur statut et leurs conséquences en cascade (modèle register_link / impact_review).',
    '<div class="grid two">'+cartes+'</div>'+
    '<div class="panel"><h3>À valider</h3><ul class="queue">'+validation+'</ul></div>'+
    '<div class="panel"><h3>Demandes & journal</h3><ul class="queue">'+
      JOURNAL.slice(0,6).map(j=>'<li><span class="t">'+j.t+'</span><br>'+j.msg+'</li>').join('')+
    '</ul></div>'
  );
}
render();
</script>
</body>
</html>
