<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pantheon Control — Evidence</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<style>
body.ev-mode,body.ev-mode html{overflow:hidden}body.ev-mode .topbar,body.ev-mode .bc,body.ev-mode h2,body.ev-mode .lede{display:none}body.ev-mode .layout,body.ev-mode .content,body.ev-mode #page{height:100dvh;max-width:none;overflow:hidden}body.ev-mode .content{padding:6px}.ev{height:100%;display:grid;grid-template-rows:38px 1fr;gap:6px}.bar{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border:1px solid var(--line-2);border-radius:14px;background:#0b0d12;padding:5px 8px}.bar b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar span{font-size:11px;color:var(--muted)}.bar button{margin:0;border-radius:999px;padding:6px 9px;font-size:12px}.stage,.pSwiper,.pSwiper>.swiper-wrapper,.pSlide,.sSwiper,.sSwiper>.swiper-wrapper,.sSlide{height:100%}.stage{border:1px solid var(--line-2);border-radius:18px;background:#080a0d;overflow:hidden}.pSlide{padding:6px}.sSlide{display:flex}.card{height:100%;width:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto auto;gap:5px;border:1px solid var(--line);border-top:4px solid var(--orange);border-radius:17px;background:var(--card);padding:8px;overflow:hidden}.card.critical{border-top-color:var(--red)}.top{display:grid;grid-template-columns:1fr auto;gap:8px}.meta,.risk{font-size:10.5px;color:var(--muted);line-height:1.25}.risk{text-align:right}.risk b{color:var(--orange)}.critical .risk b{color:var(--red)}.title{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start}.ico{width:30px;height:30px;border:1px solid var(--line-2);border-radius:10px;display:grid;place-items:center;background:#10141c}.card h3{margin:0;font-size:clamp(16px,4.9vw,22px);line-height:1.05}.chips{display:flex;gap:4px;flex-wrap:wrap}.chip{border:1px solid var(--line-2);border-radius:999px;padding:2px 7px;font-size:10px;color:var(--muted)}.body{min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#0a0d12;padding:0 8px}.sec{padding:5px 0;border-top:1px solid var(--line)}.sec:first-child{border-top:0}.sec h4{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#6f7783;margin:0 0 3px}.sec p,.sec li{font-size:10.8px;line-height:1.23;color:#cdd3dc;margin:0}.sec ul{margin:0;padding-left:15px}.flow{display:grid;gap:3px}.flow div{border:1px solid var(--line);border-radius:10px;background:#11151d;padding:4px 6px;font-size:10.4px;color:#cdd3dc}.note{display:grid;grid-template-columns:1fr auto;gap:5px}.note input{height:31px;border-radius:11px;border:1px solid var(--line);background:#07090d;color:var(--fg);padding:0 9px;font-size:11px}.note button,.actions button{margin:0;border-radius:11px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.actions button{padding:6px 2px;font-size:9px;white-space:nowrap}.panel,.info,.overview{position:fixed;z-index:90;border:1px solid var(--line-2);border-radius:16px;background:rgba(13,16,22,.98);box-shadow:0 22px 80px rgba(0,0,0,.48)}.panel{left:50%;top:46px;transform:translateX(-50%);width:min(720px,calc(100vw - 14px));display:none}.panel.open,.info.open,.overview.open{display:block}.panelHead,.ovHead{display:flex;justify-content:space-between;gap:8px;padding:10px;border-bottom:1px solid var(--line)}.panelHead h3,.ovHead h3{font-size:15px;margin:0}.panelHead p,.ovHead p{font-size:11px;color:var(--muted);margin:2px 0 0}.panelHead button,.ovHead button{width:32px;height:32px;border-radius:50%;margin:0}.panelBody{padding:10px}.info{right:7px;top:46px;width:min(350px,calc(100vw - 14px));display:none;padding:11px}.info p{font-size:11.5px;color:var(--muted)}.overview{left:7px;right:7px;top:46px;bottom:7px;display:none;overflow:hidden}.ovBody{height:calc(100% - 58px);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:10px}.miniGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mini{min-height:108px;border:1px solid var(--line);border-radius:14px;background:#0a0d12;padding:8px;text-align:left;display:grid;grid-template-rows:1fr auto;gap:6px}.mini h4{margin:0;font-size:11px;line-height:1.15;color:var(--fg)}.mini .chips{gap:3px}.mini .chip{font-size:9px;padding:1px 5px}.mini.up{border-top:4px solid var(--orange)}.mini.down{border-bottom:4px solid var(--green)}.mini.peer{border-top:4px solid var(--yellow);border-bottom:4px solid var(--yellow)}.mini.selected{border-color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}.toast{position:fixed;left:50%;bottom:10px;transform:translateX(-50%) translateY(70px);z-index:100;background:#11141a;border:1px solid var(--line-2);border-radius:14px;padding:8px 10px;font-size:12px;transition:.2s}.toast.show{transform:translateX(-50%) translateY(0)}@media(max-height:720px){.card{gap:4px;padding:7px}.sec{padding:4px 0}.sec p,.sec li{font-size:10px}.note input{height:28px}.actions button{font-size:8.7px;padding:5px 1px}.mini{min-height:96px}.ico{width:27px;height:27px}}
</style>
</head>
<body>
<div id="shell"></div>
<script src="nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
document.body.classList.add('ev-mode');
const projects=[{name:'Extension limite',cards:[{id:'EL-301',icon:'📐',title:'Absence de bornage avant implantation',labels:['Géomètre','À examiner','Risque élevé'],risk:'Élevée',due:'20/06/2026',sources:['Note rendez-vous client / phase ESQ','Plan de limite non contradictoire','Trace de décision à compléter'],constat:'La limite réelle de propriété n’est pas suffisamment établie.',rec:'Mettre le sujet en décision, contrôler la source et préparer une demande de pièce.',amont:'Rendez-vous ESQ',aval:'Décision implantation avant APS',pair:'Étude de sol',rel:{up:['EL-300'],down:['EL-302','EL-303'],peer:['EL-304']}},{id:'EL-302',icon:'🏗️',title:'Reconnaissance des fondations existantes',labels:['Technique','À produire','Risque élevé'],risk:'Élevée',due:'22/06/2026',sources:['Préparation APS','Retour BET à demander'],constat:'La stratégie structurelle dépend des fondations existantes.',rec:'Demander reconnaissance ciblée et retour structure.',amont:'EL-301',aval:'Choix structure',pair:'Étude de sol',rel:{up:['EL-301'],down:['EL-303'],peer:['EL-304']}},{id:'EL-303',icon:'▦',title:'Décalage du volume projet',labels:['Conception','Hypothèse','Risque moyen'],risk:'À traiter',due:'—',sources:['Option ESQ'],constat:'Le décalage réduit le risque sans le supprimer.',rec:'Présenter comme réduction de risque uniquement.',amont:'EL-301',aval:'Plan APS',pair:'Bornage',rel:{up:['EL-301','EL-302'],down:[],peer:['EL-304']}},{id:'EL-304',icon:'@',title:'Courrier client avant APS',labels:['Mail','À préparer','Risque moyen'],risk:'À traiter',due:'21/06/2026',sources:['Échange client','Note agence'],constat:'Le client doit comprendre le risque résiduel.',rec:'Préparer un courrier clair avec réserve sur limite.',amont:'EL-301',aval:'Accord poursuite APS',pair:'EL-303',rel:{up:['EL-301'],down:[],peer:['EL-303']}}]},{name:'Maison Lierre',cards:[{id:'ML-201',icon:'🏗️',title:'Fondations profondes imposées par étude de sol',labels:['Technique','À examiner','Risque élevé'],risk:'Critique',due:'20/06/2026',sources:['Étude de sol','Note structure','Compte rendu projet'],constat:'Les fondations profondes modifient le principe constructif et le budget.',rec:'Ouvrir arbitrage, vérifier les sources et demander un avis complémentaire.',amont:'Étude de sol',aval:'Budget et choix structure',pair:'Adaptation plans',rel:{up:['ML-200'],down:['ML-202','ML-203'],peer:['ML-204']}},{id:'ML-202',icon:'€',title:'Impact budget structure',labels:['Budget','À décider','Risque élevé'],risk:'Élevée',due:'23/06/2026',sources:['Estimation BET','Note interne'],constat:'Le budget doit être révisé avant engagement.',rec:'Mettre le sujet en décision client.',amont:'ML-201',aval:'Devis entreprises',pair:'ML-204',rel:{up:['ML-201'],down:['ML-203'],peer:['ML-204']}},{id:'ML-203',icon:'§',title:'Vérification DTU / règles structure',labels:['DTU','Recherche','Risque moyen'],risk:'À traiter',due:'—',sources:['Corpus DTU','Note technique'],constat:'Une vérification technique doit compléter la preuve.',rec:'Lancer Recherche+ sur corpus DTU et règles métier.',amont:'ML-201',aval:'Evidence Pack',pair:'ML-204',rel:{up:['ML-201'],down:[],peer:['ML-204']}},{id:'ML-204',icon:'▦',title:'Adaptation plans APS',labels:['Plans','À modifier','Risque moyen'],risk:'À traiter',due:'25/06/2026',sources:['Plans APS','Retour structure'],constat:'Les plans doivent intégrer le nouveau principe constructif.',rec:'Préparer une modification candidate.',amont:'ML-201',aval:'Version APS',pair:'ML-202',rel:{up:['ML-201'],down:[],peer:['ML-202','ML-203']}}]}];
let pSwiper,sSwipers=[],selected={p:0,id:'EL-301'},timer;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function list(xs){return'<ul>'+xs.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'}
function deps(c){return'<div class="flow"><div><b>Amont</b> · '+esc(c.amont)+'</div><div><b>Aval</b> · '+esc(c.aval)+'</div><div><b>Même niveau</b> · '+esc(c.pair)+'</div></div>'}
function chips(c){return'<div class="chips">'+c.labels.map(l=>'<span class="chip">'+esc(l)+'</span>').join('')+'</div>'}
function card(c,pi){return'<article class="swiper-slide sSlide"><div class="card '+(c.risk==='Critique'?'critical':'')+'" data-p="'+pi+'" data-id="'+c.id+'"><div class="top"><div class="meta">'+esc(projects[pi].name.toUpperCase())+' · '+esc(c.id)+'<br>Date 16/06/2026</div><div class="risk">'+esc(c.risk)+'<br><b>Butoir '+esc(c.due)+'</b></div></div><div class="title"><span class="ico">'+c.icon+'</span><h3>'+esc(c.title)+'</h3></div>'+chips(c)+'<div class="body"><section class="sec"><h4>Sources</h4>'+list(c.sources)+'</section><section class="sec"><h4>Constat</h4><p>'+esc(c.constat)+'</p></section><section class="sec"><h4>Actions recommandées</h4><p>'+esc(c.rec)+'</p></section><section class="sec"><h4>Amont · aval · même niveau</h4>'+deps(c)+'</section></div><div class="note"><input placeholder="Laisser une note sur ce point"><button data-note="1">Noter</button></div><div class="actions"><button data-act="valider">Valider</button><button data-act="refuser">Refuser</button><button data-act="modifier">Modifier</button><button data-act="recherche">Recherche+</button></div></div></article>'}
function renderProjects(){return projects.map((p,pi)=>'<section class="swiper-slide pSlide"><div class="swiper sSwiper"><div class="swiper-wrapper">'+p.cards.map(c=>card(c,pi)).join('')+'</div></div></section>').join('')}
function openOverview(pi,id){selected={p:+pi,id};renderOverview();document.getElementById('overview').classList.add('open')}
function closeOverview(){document.getElementById('overview').classList.remove('open')}
function relClass(c,sel){if(c.id===sel.id)return'selected';let r=projects[sel.p].cards.find(x=>x.id===sel.id)?.rel||{};if((r.up||[]).includes(c.id))return'up';if((r.down||[]).includes(c.id))return'down';if((r.peer||[]).includes(c.id))return'peer';return''}
function renderOverview(){let p=projects[selected.p];document.getElementById('ovTitle').textContent=p.name;document.getElementById('ovSub').textContent='Mode dézoom · '+selected.id+' sélectionné';document.getElementById('ovGrid').innerHTML=p.cards.map(c=>'<button class="mini '+relClass(c,selected)+'" data-mini="'+c.id+'"><h4>'+c.icon+' '+esc(c.title)+'</h4>'+chips(c)+'</button>').join('')}
function panel(kind){let search=kind==='recherche';document.getElementById('panelTitle').textContent=search?'Recherche complémentaire':'Fiche de revue';document.getElementById('panelBody').innerHTML=search?'<section class="sec"><h4>Workflow</h4><div class="flow"><div><b>1 · Base projet</b> · vérifier surfaces, dates, décisions, pièces et statuts connus.</div><div><b>2 · Courriels</b> · rechercher échanges client, mairie, BET, entreprises et assurance.</div><div><b>3 · Corpus DTU / règles</b> · vérifier normes, DTU, règles métier et notes techniques.</div><div><b>4 · Résultat</b> · produire un Evidence Candidate + Evidence Pack Candidate.</div><div><b>5 · Retour Pantheon</b> · soumettre à validation humaine, sans effet automatique.</div></div></section>':'<section class="sec"><h4>Modification candidate</h4><p>Préparer une correction ou une demande de précision sur cette fiche, sans modifier le registre.</p></section>';document.getElementById('panel').classList.add('open')}
function closePanel(){document.getElementById('panel').classList.remove('open')}
function info(){document.getElementById('info').classList.toggle('open')}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),2200)}
function bind(){document.addEventListener('click',e=>{let card=e.target.closest('.card');if(card&&!e.target.closest('button,input'))openOverview(card.dataset.p,card.dataset.id);if(e.target.dataset.mini){selected.id=e.target.dataset.mini;renderOverview();let idx=projects[selected.p].cards.findIndex(c=>c.id===selected.id);sSwipers[selected.p]?.slideTo(idx)}if(e.target.dataset.close)closePanel(),closeOverview();if(e.target.dataset.note){let input=e.target.previousElementSibling;toast(input.value?'Note locale ajoutée : '+input.value:'Note vide');input.value=''}if(e.target.dataset.act){toast('Pantheon · intention candidate : '+e.target.dataset.act);if(['modifier','recherche'].includes(e.target.dataset.act))panel(e.target.dataset.act)}})}
function init(){if(!window.Swiper)return;sSwipers=[...document.querySelectorAll('.sSwiper')].map(s=>new Swiper(s,{direction:'vertical',slidesPerView:1,spaceBetween:8,nested:true}));pSwiper=new Swiper('.pSwiper',{direction:'horizontal',slidesPerView:1,spaceBetween:8,on:{slideChange(){selected.p=this.activeIndex}}})}
function render(){mountPage('Preuves & sources','',document.getElementById('tpl').innerHTML.replace('__PROJECTS__',renderProjects()));bind();init()}
</script>
<template id="tpl"><div class="ev"><header class="bar"><b>Preuves & sources</b><span>clic fiche = dézoom</span><button onclick="info()">Infos</button></header><main class="stage"><div class="swiper pSwiper"><div class="swiper-wrapper">__PROJECTS__</div></div></main><aside id="info" class="info"><p>Clic sur fiche : mode dézoom du projet. Grille 3 colonnes, scroll vertical libre. Contours : haut = ascendant, bas = descendant, haut+bas = même niveau, contour complet = sélectionné.</p></aside><aside id="panel" class="panel"><div class="panelHead"><div><h3 id="panelTitle">Fiche</h3><p>Transmission candidate Pantheon</p></div><button data-close="1">×</button></div><div id="panelBody" class="panelBody"></div><div class="panelBody"><button data-close="1">Fermer</button></div></aside><aside id="overview" class="overview"><div class="ovHead"><div><h3 id="ovTitle">Projet</h3><p id="ovSub">Mode dézoom</p></div><button data-close="1">×</button></div><div class="ovBody"><div id="ovGrid" class="miniGrid"></div></div></aside><div id="toast" class="toast"></div></div></template><script>render()</script>
</body></html>
