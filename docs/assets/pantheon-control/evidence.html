<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pantheon Control — Preuves</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"><style>
body.evpage,body.evpage html{overflow:hidden}body.evpage .topbar{display:none}body.evpage .layout{height:100dvh;min-height:0}body.evpage .drawer{top:0}body.evpage .content{height:100dvh;max-width:none;padding:6px;overflow:hidden}body.evpage .bc,body.evpage h2,body.evpage .lede{display:none}body.evpage #page{height:100%}.ev{height:100%;display:grid;grid-template-rows:36px 1fr;gap:6px}.bar{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:14px;background:#0b0d12;padding:5px 7px;overflow:hidden}.bar b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar span{font-size:10.5px;color:var(--muted);white-space:nowrap}.bar button{margin:0;border-radius:999px;padding:6px 9px;font-size:12px}.stage{height:100%;border:1px solid var(--line-2);border-radius:18px;background:#080a0d;overflow:hidden}.mws,.mws>.swiper-wrapper,.matter,.sws,.sws>.swiper-wrapper,.subject{height:100%}.matter{padding:6px}.subject{display:flex}.card{--u:var(--blue);height:100%;width:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto auto;gap:5px;border:1px solid var(--line);border-top:4px solid var(--u);border-radius:17px;background:var(--card);padding:8px;overflow:hidden}.card[data-u=critical]{--u:var(--red)}.card[data-u=high]{--u:var(--orange)}.card[data-u=medium]{--u:var(--yellow)}.card[data-u=low]{--u:var(--green)}.top{display:grid;grid-template-columns:1fr auto;gap:6px}.id,.date,.risk,.due{font-size:10px;color:var(--muted);line-height:1.25}.id{text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.risk{text-align:right}.due{display:block;color:var(--orange);white-space:nowrap}.pill{display:inline-block;border:1px solid var(--line-2);border-radius:999px;padding:2px 7px;color:var(--fg)}.card h3{margin:0;font-size:clamp(16px,4.8vw,22px);line-height:1.04;letter-spacing:-.03em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.chips{display:flex;gap:4px;flex-wrap:wrap;min-height:20px;overflow:hidden}.chip{border:1px solid var(--line-2);border-radius:999px;padding:2px 7px;font-size:10px;color:var(--muted)}.red{color:var(--red);border-color:#4d2c2c}.orange{color:var(--orange);border-color:#4d3a2a}.yellow{color:var(--yellow);border-color:#4d452a}.green{color:var(--green);border-color:#2c4d3c}.blue{color:var(--blue);border-color:#2c3a4d}.body{min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#0a0d12;padding:0 8px}.sec{padding:6px 0;border-top:1px solid var(--line)}.sec:first-child{border-top:0}.sec h4{margin:0 0 3px;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#6f7783}.sec p{margin:0;color:#cdd3dc;font-size:11.2px;line-height:1.24}.choices{display:grid;gap:4px}.choices button{margin:0;text-align:left;padding:5px;border-radius:10px;font-size:10px}.rel{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.rel button{margin:0;padding:5px;border-radius:10px;text-align:left;font-size:9.5px;line-height:1.08}.rel b,.rel span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rel span{color:var(--muted)}.act{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.act button{margin:0;padding:6px 2px;border-radius:11px;font-size:9px;white-space:nowrap}.panel,.info{position:fixed;z-index:80;border:1px solid var(--line-2);border-radius:16px;background:rgba(13,16,22,.98);box-shadow:0 22px 80px rgba(0,0,0,.48)}.panel{left:50%;top:44px;transform:translateX(-50%);width:min(720px,calc(100vw - 14px));display:none;max-height:calc(100dvh - 52px);overflow:hidden}.panel.open{display:block}.ph{display:flex;justify-content:space-between;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line)}.ph h3{margin:0;font-size:14px}.ph p{margin:2px 0 0;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ph button{width:30px;height:30px;border-radius:50%;padding:0;margin:0}.pb{padding:0 11px 9px}.psec{padding:8px 0;border-top:1px solid var(--line)}.psec:first-child{border-top:0}.psec h4{margin:0 0 3px;font-size:10px;text-transform:uppercase;color:#6f7783}.psec p{margin:0;font-size:12px;line-height:1.3;color:#cdd3dc}.info{right:7px;top:44px;width:min(350px,calc(100vw - 14px));display:none;padding:11px}.info.open{display:block}.info p,.info li{font-size:11.5px;color:var(--muted);line-height:1.3}.toast{position:fixed;left:50%;bottom:10px;transform:translateX(-50%) translateY(70px);z-index:100;width:min(520px,calc(100vw - 20px));border:1px solid var(--line-2);border-radius:14px;background:#11141a;padding:8px 10px;font-size:12px;transition:.2s}.toast.show{transform:translateX(-50%) translateY(0)}@media(max-height:720px){.card{gap:4px;padding:7px}.sec{padding:4px 0}.sec p{font-size:10.5px}.choices button,.rel button{padding:4px}.act button{font-size:8.8px;padding:5px 1px}}
</style></head><body><div id="shell"></div><script src="data.js"></script><script src="nav.js"></script><script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script><script>
document.body.classList.add('evpage');
const U={critical:['Critique','red'],high:['Élevée','orange'],medium:['À traiter','yellow'],low:['Stabilisée','green'],info:['Info','blue']};let ms,ss=[],tm;
function h(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function u(x){if((x.links||[]).some(l=>l.impact_level==='critical'))return'critical';if(x.risque?.[0]==='Élevé')return'high';if(x.risque?.[0]==='Moyen')return'medium';if(x.statut?.[0]==='Référence')return'low';return'info'}function r(x){let q=x.urgency||u(x);return q==='critical'?'Arbitrage avant toute clôture. Lire source et conséquences.':q==='high'?'À décider après contrôle source et périmètre.':q==='medium'?'Garder pour revue simple.':'Conserver comme information, sans changement probatoire.'}function prep(x,i){return{...x,links:x.links||[],urgency:x.urgency||u(x),date:x.date||'16/06/2026',due:x.due||(x.risque?.[0]==='Élevé'?'20/06/2026':'—'),recommendation:x.recommendation||r(x),choices:x.choices||['Valider comme candidate','Demander complément','Écarter provisoirement'],assoc:x.assoc||['↑ Source amont','↓ Décision aval','↔ Sujet lié'],idx:i}}
const A=EVIDENCE.map((x,i)=>prep({...x,affaire:'Maison Lierre'},i));const B=[prep({id:'EL-301',affaire:'Extension limite',sujet:'Absence de bornage avant implantation',nature:['Géomètre','blue'],source:'Note rendez-vous client / phase ESQ',statut:['À examiner','yellow'],risque:['Élevé','red'],urgency:'high',detail:'La limite réelle de propriété n’est pas suffisamment établie.',links:[]},0)];const C=[prep({id:'CT-401',affaire:'Chantier terrasse',sujet:'Réserve sur évacuation EP',nature:['Réserve','orange'],source:'Compte rendu chantier + photo',statut:['À revoir','orange'],risque:['Élevé','red'],urgency:'critical',detail:'L’écoulement constaté peut affecter la levée de réserve.',links:[{relation:'impacte',to_id:'Levée de réserve',note:'arbitrage avant clôture',impact_level:'critical'}]},0)];const M=[{title:'Maison Lierre',items:A},{title:'Extension limite',items:B},{title:'Chantier terrasse',items:C}];
function chip(a,t){return'<span class="chip '+h(t||'')+'">'+h(a)+'</span>'}function find(id){return M.flatMap(m=>m.items).find(x=>x.id===id)}function cons(x){return x.links.length?x.links.map(l=>h(l.relation)+' → '+h(l.to_id)+' : '+h(l.note||'à qualifier')).join('<br>'):'Aucune dépendance déclarée.'}
function body(x){return'<section class="sec"><h4>Source</h4><p>'+h(x.source)+'</p></section><section class="sec"><h4>Description</h4><p>'+h(x.detail)+'</p></section><section class="sec"><h4>Recommandation Pantheon</h4><p>'+h(x.recommendation)+'</p></section><section class="sec"><h4>Choix</h4><div class="choices">'+x.choices.map((c,i)=>'<button data-choice="'+i+'" data-id="'+h(x.id)+'">'+h(c)+'</button>').join('')+'</div></section>'}function choice(x,i){return'<section class="sec"><h4>Choix · '+h(x.choices[i])+'</h4><p>Variante affichée dans le corps de fiche. Pantheon peut recevoir cette intention candidate, sans validation automatique.</p></section><section class="sec"><h4>Proposition Pantheon</h4><p>Créer une demande de revue liée à '+h(x.id)+'.</p></section><section class="sec"><h4>Conséquences</h4><p>'+cons(x)+'</p></section><section class="sec"><button data-back="1" data-id="'+h(x.id)+'">Retour sections</button></section>'}
function card(x,i,n){let z=U[x.urgency]||U.info;return'<article class="card" data-id="'+h(x.id)+'" data-u="'+h(x.urgency)+'"><div class="top"><div><div class="id">'+h(x.affaire)+' · '+h(x.id)+' · '+i+'/'+n+'</div><div class="date">Date '+h(x.date)+'</div></div><div class="risk"><span class="pill">'+h(z[0])+'</span><span class="due">Butoir '+h(x.due)+'</span></div></div><h3>'+h(x.sujet)+'</h3><div class="chips">'+chip(x.nature[0],x.nature[1])+chip(x.statut[0],x.statut[1])+chip('Risque '+x.risque[0],x.risque[1])+'</div><div class="body" id="b-'+h(x.id)+'">'+body(x)+'</div><div class="rel">'+x.assoc.map((a,i)=>'<button data-rel="'+i+'" data-id="'+h(x.id)+'"><b>'+h(a.split(' ')[0])+'</b><span>'+h(a.replace(a.split(' ')[0]+' ',''))+'</span></button>').join('')+'</div><div class="act"><button class="green" data-act="valider" data-id="'+h(x.id)+'">Valider</button><button class="red" data-act="refuser" data-id="'+h(x.id)+'">Refuser</button><button class="orange" data-act="modifier" data-id="'+h(x.id)+'">Modifier</button><button class="blue" data-act="detail" data-id="'+h(x.id)+'">Détail+</button></div></article>'}
function slide(m){return'<section class="swiper-slide matter"><div class="swiper sws"><div class="swiper-wrapper">'+m.items.map((x,i)=>'<div class="swiper-slide subject">'+card(x,i+1,m.items.length)+'</div>').join('')+'</div></div></section>'}function bar(){let m=M[ms?.activeIndex||0],i=ss[ms?.activeIndex||0]?.activeIndex||0;bt.textContent=m.title;bcnt.textContent=((ms?.activeIndex||0)+1)+'/'+M.length+' · '+(i+1)+'/'+m.items.length}function panel(x,t){pnl.innerHTML='<div class="ph"><div><h3>'+h(t)+'</h3><p>'+h(x.affaire)+' · '+h(x.sujet)+'</p></div><button onclick="closeP()">×</button></div><div class="pb"><section class="psec"><h4>Source</h4><p>'+h(x.source)+'</p></section><section class="psec"><h4>Description</h4><p>'+h(x.detail)+'</p></section><section class="psec"><h4>Recommandation</h4><p>'+h(x.recommendation)+'</p></section><section class="psec"><h4>Dépendances</h4><p>'+cons(x)+'</p></section><section class="psec"><h4>Limite</h4><p>Transmission candidate uniquement.</p></section></div>';pnl.classList.add('open')}function closeP(){pnl.classList.remove('open')}function info(){inf.classList.toggle('open')}function toast(s){evt.textContent=s;evt.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>evt.classList.remove('show'),2300)}
function bind(){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let x=find(b.dataset.id);document.getElementById('b-'+x.id).innerHTML=choice(x,+b.dataset.choice);bind()});document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{let x=find(b.dataset.id);document.getElementById('b-'+x.id).innerHTML=body(x);bind()});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{let x=find(b.dataset.id);toast('Pantheon · intention candidate : '+b.dataset.act+' · '+x.id);if(b.dataset.act==='modifier'||b.dataset.act==='detail')panel(x,'Proposition Pantheon')});document.querySelectorAll('[data-rel]').forEach(b=>b.onclick=()=>panel(find(b.dataset.id),'Fiche liée · '+b.textContent.trim()))}
function init(){if(!window.Swiper)return;ss=[...document.querySelectorAll('.sws')].map(el=>new Swiper(el,{direction:'horizontal',slidesPerView:1,spaceBetween:8,nested:true,on:{slideChange:bar}}));ms=new Swiper('.mws',{direction:'vertical',slidesPerView:1,spaceBetween:8,keyboard:{enabled:true},mousewheel:true,on:{slideChange:bar}})}function render(){mountPage('Preuves & sources','', '<div class="ev"><header class="bar"><b id="bt">Preuves</b><span id="bcnt">—</span><button onclick="info()">Infos</button></header><main class="stage"><div class="swiper mws"><div class="swiper-wrapper">'+M.map(slide).join('')+'</div></div></main><aside id="inf" class="info"><h3>Infos</h3><p>Source, Description, Recommandation et Choix sont dans le corps de fiche. Les actions transmettent une intention candidate à Pantheon.</p><ul><li>← / → sujet.</li><li>↑ / ↓ affaire.</li><li>Cartes liées : amont, aval, même niveau.</li></ul></aside><aside id="pnl" class="panel"></aside><div id="evt" class="toast"></div></div>');init();bind();bar()}render();
</script></body></html>
