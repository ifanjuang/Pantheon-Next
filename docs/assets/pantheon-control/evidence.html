<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pantheon Control — Preuves compactes</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<style>
body.ev-page,body.ev-page html{overflow:hidden}body.ev-page .topbar{display:none}body.ev-page .layout{height:100dvh;min-height:0}body.ev-page .drawer{top:0}body.ev-page .content{height:100dvh;max-width:none;padding:6px;overflow:hidden}body.ev-page .bc,body.ev-page .content h2,body.ev-page .lede{display:none}body.ev-page #page{height:100%}
.ev{height:100%;display:grid;grid-template-rows:36px 1fr;gap:6px;min-height:0}.evbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:14px;background:#0b0d12;padding:5px 7px;overflow:hidden}.evbar b{display:block;font-size:13px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.evcount{font-size:10.5px;color:var(--muted);white-space:nowrap}.evbar button{margin:0;border-radius:999px;padding:6px 9px;font-size:12px;line-height:1}.stage{height:100%;min-height:0;border:1px solid var(--line-2);border-radius:18px;background:#080a0d;overflow:hidden}.mws,.mws>.swiper-wrapper,.matter,.sws,.sws>.swiper-wrapper,.subject{height:100%}.matter{padding:6px}.subject{display:flex;min-height:0}.card{--u:var(--blue);height:100%;width:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto auto;gap:6px;border:1px solid var(--line);border-top:4px solid var(--u);border-radius:17px;background:var(--card);padding:9px;overflow:hidden}.card[data-u=critical]{--u:var(--red)}.card[data-u=high]{--u:var(--orange)}.card[data-u=medium]{--u:var(--yellow)}.card[data-u=low]{--u:var(--green)}.top{display:flex;justify-content:space-between;gap:6px;align-items:center}.eid{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.urg{font-size:10.5px;border:1px solid var(--line-2);border-radius:999px;padding:2px 7px;color:var(--fg);white-space:nowrap}.card h3{margin:0;font-size:clamp(17px,5.2vw,23px);line-height:1.03;letter-spacing:-.035em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.chips{display:flex;gap:4px;flex-wrap:wrap;min-height:24px;overflow:hidden}.ec{border:1px solid var(--line-2);border-radius:999px;padding:2px 7px;font-size:10.5px;color:var(--muted);line-height:1.4}.ec.red{color:var(--red);border-color:#4d2c2c}.ec.orange{color:var(--orange);border-color:#4d3a2a}.ec.yellow{color:var(--yellow);border-color:#4d452a}.ec.green{color:var(--green);border-color:#2c4d3c}.ec.blue{color:var(--blue);border-color:#2c3a4d}.desc{margin:0;color:#cdd3dc;font-size:12px;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;align-self:start}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.tabs button{margin:0;text-align:left;padding:6px 5px;border-radius:11px;font-size:10.5px;line-height:1.05;min-width:0}.tabs b{display:block;color:var(--fg)}.tabs span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.intent{min-height:20px}.ib{display:inline-flex;border:1px solid rgba(136,187,255,.3);background:rgba(136,187,255,.1);border-radius:999px;padding:3px 7px;font-size:10.5px;color:var(--blue)}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.actions button{margin:0;padding:7px 3px;border-radius:12px;font-size:10px;line-height:1.05;white-space:nowrap}.actions .main{color:var(--green);border-color:#2c4d3c}.card[data-u=critical] .actions .main{color:var(--red);border-color:#4d2c2c}.card[data-u=high] .actions .main{color:var(--orange);border-color:#4d3a2a}.foot{font-size:10px;color:#5b626d;display:flex;justify-content:space-between;line-height:1}.panel,.info{position:fixed;z-index:80;border:1px solid var(--line-2);border-radius:16px;background:rgba(13,16,22,.98);box-shadow:0 22px 80px rgba(0,0,0,.48)}.panel{left:50%;top:44px;transform:translateX(-50%);width:min(720px,calc(100vw - 14px));display:none;max-height:calc(100dvh - 52px);overflow:hidden}.panel.open{display:block}.ph{display:flex;justify-content:space-between;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line)}.ph h3{margin:0;font-size:14px}.ph p{margin:2px 0 0;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ph button{width:30px;height:30px;border-radius:50%;padding:0;margin:0}.pb{padding:0 11px 9px}.sec{padding:8px 0;border-top:1px solid var(--line)}.sec:first-child{border-top:0}.sec h4{margin:0 0 3px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#6f7783}.sec p{margin:0;font-size:12px;line-height:1.3;color:#cdd3dc}.info{right:7px;top:44px;width:min(350px,calc(100vw - 14px));display:none;padding:11px}.info.open{display:block}.info h3{margin:0 0 7px;font-size:14px}.info li,.info p{font-size:11.5px;color:var(--muted);line-height:1.3}.info ul{margin:7px 0 0;padding-left:16px}.tut{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.36);display:none}.tut.show{display:block}.bubble{position:absolute;max-width:min(300px,calc(100vw - 24px));border:1px solid var(--line-2);border-radius:15px;background:#11141a;padding:11px;box-shadow:0 20px 70px rgba(0,0,0,.45)}.bubble h3{margin:0 0 4px;font-size:14px}.bubble p{margin:0;color:var(--muted);font-size:12px;line-height:1.3}.b1{left:10px;top:44px}.b2{right:10px;top:36%}.b3{left:10px;bottom:10px}.b3 button{float:right;margin-top:8px}.evtoast{position:fixed;left:50%;bottom:10px;transform:translateX(-50%) translateY(70px);z-index:100;width:min(520px,calc(100vw - 20px));border:1px solid var(--line-2);border-radius:14px;background:#11141a;padding:8px 10px;font-size:12px;transition:.2s}.evtoast.show{transform:translateX(-50%) translateY(0)}@media(max-height:700px){.card{gap:5px;padding:8px}.card h3{font-size:17px}.desc{-webkit-line-clamp:2}.tabs span{display:none}.chips{min-height:20px}.ec{font-size:10px;padding:1px 6px}.actions button{padding:6px 2px;font-size:9.5px}.foot{display:none}.sec{padding:7px 0}}
</style></head><body><div id="shell"></div><script src="data.js"></script><script src="nav.js"></script><script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script><script>
document.body.classList.add('ev-page');
const U={critical:['Critique','red'],high:['Élevée','orange'],medium:['À traiter','yellow'],low:['Stabilisée','green'],info:['Information','blue']};let ms,ss=[],state=new Map(),tm;
function e(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function urg(x){if((x.links||[]).some(l=>l.impact_level==='critical'))return'critical';if(x.risque?.[0]==='Élevé')return'high';if(x.risque?.[0]==='Moyen')return'medium';if(x.statut?.[0]==='Référence')return'low';return'info'}function rec(x){const u=x.urgency||urg(x);if(u==='critical')return'Ouvrir en arbitrage avant toute clôture. Lire la source complète et les conséquences.';if(u==='high')return'À décider après vérification de la source et du périmètre.';if(u==='medium')return'Garder pour revue simple et vérifier la pièce utile.';return'Conserver comme information, sans changement de statut probatoire.'}function it(x){return{...x,links:x.links||[],urgency:x.urgency||urg(x),recommendation:x.recommendation||rec(x)}}
const A=EVIDENCE.map(x=>it({...x,affaire:'Maison Lierre'}));
const B=[it({id:'EL-301',affaire:'Extension limite séparative',sujet:'Absence de bornage avant implantation',nature:['Géomètre','blue'],source:'Note rendez-vous client / phase ESQ',statut:['À examiner','yellow'],risque:['Élevé','red'],urgency:'high',detail:'La limite réelle de propriété n’est pas suffisamment établie. Toute confirmation d’implantation doit rester candidate.',alerte:'Risque voisin ou implantation contestée.',links:[{relation:'impacts',to_id:'Implantation',impact_level:'high',note:'limite à sécuriser'}]}),it({id:'EL-302',affaire:'Extension limite séparative',sujet:'Reconnaissance des fondations existantes',nature:['Technique','blue'],source:'Préparation APS',statut:['Production nécessaire','orange'],risque:['Élevé','red'],urgency:'high',detail:'La reconnaissance conditionne la faisabilité structurelle et la stratégie constructive.',alerte:'Ne pas traiter comme formalité.',links:[]})];
const C=[it({id:'CT-401',affaire:'Chantier terrasse',sujet:'Réserve sur évacuation EP',nature:['Réserve','orange'],source:'Compte rendu chantier + photo',statut:['À revoir','orange'],risque:['Élevé','red'],urgency:'critical',detail:'L’écoulement constaté peut affecter la levée de réserve et la responsabilité de reprise.',alerte:'Clôture rapide à proscrire.',links:[{relation:'impacts',to_id:'Levée de réserve',impact_level:'critical',note:'arbitrage avant clôture'}]}),it({id:'CT-402',affaire:'Chantier terrasse',sujet:'Devis complémentaire garde-corps',nature:['Devis','blue'],source:'Entreprise lot serrurerie',statut:['À confirmer client','yellow'],risque:['Moyen','yellow'],urgency:'medium',detail:'Le devis doit être comparé au périmètre initial avant réponse au client.',alerte:'Ne pas envoyer comme validation de prix.',links:[]})];
const M=[{title:'Maison Lierre',sub:'Structure, ERP, DTU',items:A},{title:'Extension limite séparative',sub:'Bornage, sol, structure',items:B},{title:'Chantier terrasse',sub:'Réserves, devis, photos',items:C}];
function chip(a,t){return'<span class="ec '+e(t||'')+'">'+e(a)+'</span>'}function mini(s,n=24){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s}function curM(){return M[ms?.activeIndex||0]}function mainLabel(x){if(x.urgency==='critical')return'Arbitrage';if(x.urgency==='high')return'À décider';return'Garder'}function lab(x,a){if(a==='main')return x.urgency==='critical'?'arbitrage requis':x.urgency==='high'?'à décider':'gardé';if(a==='side')return'mis de côté';if(a==='fix')return'correction demandée';return'détail ouvert'}function ib(id){const s=state.get(id);return s?'<span class="ib">'+e(s)+' · local</span>':''}
function card(x,i,n){const u=U[x.urgency]||U.info;return'<article class="card" data-id="'+e(x.id)+'" data-u="'+e(x.urgency)+'"><div class="top"><span class="eid">'+e(x.affaire)+' · '+e(x.id)+' · '+i+'/'+n+'</span><span class="urg">'+e(u[0])+'</span></div><h3>'+e(x.sujet)+'</h3><div class="chips">'+chip(x.nature[0],x.nature[1])+chip(x.statut[0],x.statut[1])+chip('Risque '+x.risque[0],x.risque[1])+'</div><p class="desc">'+e(x.detail)+'</p><div class="tabs"><button data-sec="source" data-id="'+e(x.id)+'"><b>Source</b><span>'+e(mini(x.source))+'</span></button><button data-sec="description" data-id="'+e(x.id)+'"><b>Description</b><span>'+e(mini(x.detail))+'</span></button><button data-sec="recommendation" data-id="'+e(x.id)+'"><b>Reco.</b><span>'+e(mini(x.recommendation))+'</span></button></div><div class="intent">'+ib(x.id)+'</div><div class="actions"><button class="main" data-act="main" data-id="'+e(x.id)+'">↑ '+mainLabel(x)+'</button><button data-act="side" data-id="'+e(x.id)+'">↓ Côté</button><button data-act="fix" data-id="'+e(x.id)+'">✎ Corriger</button><button data-act="detail" data-id="'+e(x.id)+'">i Détail</button></div><div class="foot"><span>←/→ sujet · ↑/↓ affaire</span><span>•••</span></div></article>'}
function slide(m){return'<section class="swiper-slide matter"><div class="swiper sws"><div class="swiper-wrapper">'+m.items.map((x,i)=>'<div class="swiper-slide subject">'+card(x,i+1,m.items.length)+'</div>').join('')+'</div></div></section>'}function find(id){return M.flatMap(m=>m.items).find(x=>x.id===id)}function bar(){const m=curM(),i=ss[ms?.activeIndex||0]?.activeIndex||0,x=m.items[i];document.getElementById('bt').textContent=m.title;document.getElementById('bcnt').textContent=((ms?.activeIndex||0)+1)+'/'+M.length+' · '+(i+1)+'/'+m.items.length}
function sections(x,focus){document.getElementById('panel').innerHTML='<div class="ph"><div><h3>'+e(x.id)+' · '+e(focus||'Détail')+'</h3><p>'+e(x.affaire)+' · '+e(x.sujet)+'</p></div><button onclick="closeP()">×</button></div><div class="pb"><section class="sec"><h4>Source</h4><p>'+e(x.source)+'</p></section><section class="sec"><h4>Description</h4><p>'+e(x.detail)+'</p></section><section class="sec"><h4>Recommandation</h4><p>'+e(x.recommendation)+'</p></section><section class="sec"><h4>Conséquences</h4><p>'+(x.links.length?x.links.map(l=>e(l.relation)+' → '+e(l.to_id)+' : '+e(l.note||'impact à qualifier')).join('<br>'):'Aucune conséquence liée déclarée.')+'</p></section><section class="sec"><h4>Limite</h4><p>Consultation et intention seulement. Aucun statut probatoire n’est modifié par cette fiche.</p></section></div>';document.getElementById('panel').classList.add('open')}function closeP(){document.getElementById('panel').classList.remove('open')}function info(){document.getElementById('info').classList.toggle('open')}function tutOff(){document.getElementById('tut').classList.remove('show')}
function intent(x,a){const l=lab(x,a);state.set(x.id,l);document.querySelectorAll('.card[data-id="'+x.id+'"]').forEach(c=>c.querySelector('.intent').innerHTML=ib(x.id));if(a==='detail'||a==='fix'||(a==='main'&&x.urgency==='critical'))sections(x,'Détail');toast(x.id+' · '+l+'. Aucun statut probatoire modifié.')}function toast(s){const n=document.getElementById('evt');n.textContent=s;n.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>n.classList.remove('show'),2300)}function bind(){document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>sections(find(b.dataset.id),b.textContent.trim()));document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>intent(find(b.dataset.id),b.dataset.act));document.addEventListener('keydown',x=>{if(x.key==='Escape')closeP()})}
function init(){if(!window.Swiper)return;ss=[...document.querySelectorAll('.sws')].map(el=>new Swiper(el,{direction:'horizontal',slidesPerView:1,spaceBetween:8,nested:true,on:{slideChange:bar}}));ms=new Swiper('.mws',{direction:'vertical',slidesPerView:1,spaceBetween:8,keyboard:{enabled:true},mousewheel:true,on:{slideChange:bar}})}
function render(){mountPage('Preuves & sources','', '<div class="ev"><header class="evbar"><div><b id="bt">Preuves</b></div><div id="bcnt" class="evcount">—</div><button onclick="info()">Infos</button></header><main class="stage"><div class="swiper mws"><div class="swiper-wrapper">'+M.map(slide).join('')+'</div></div></main><aside id="info" class="info"><h3>Infos</h3><p>La page ne scrolle pas. Les détails sont accessibles par sections.</p><ul><li>← / → : changer de sujet.</li><li>↑ / ↓ : changer d’affaire.</li><li>Source, Description, Reco. ouvrent le panneau détaillé.</li><li>Les actions notent une intention locale.</li></ul></aside><aside id="panel" class="panel"></aside><div id="tut" class="tut show"><div class="bubble b1"><h3>Sujets</h3><p>Glisse à gauche ou à droite.</p></div><div class="bubble b2"><h3>Affaires</h3><p>Glisse en haut ou en bas. Aucun scroll.</p></div><div class="bubble b3"><h3>Détail</h3><p>Touche Source, Description ou Reco. Les sections sont séparées par une ligne.</p><button onclick="tutOff()">Compris</button></div></div><div id="evt" class="evtoast"></div></div>');init();bind();bar()}render();
</script></body></html>
