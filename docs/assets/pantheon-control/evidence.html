<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Pantheon Control — Points de contrôle</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"><style>
body.ev,body.ev html{overflow:hidden}body.ev .topbar,body.ev .bc,body.ev h2,body.ev .lede{display:none}body.ev .layout,body.ev .content,body.ev #page{height:100dvh;max-width:none;overflow:hidden}body.ev .content{padding:6px}.app{height:100%;display:grid;grid-template-rows:44px 1fr;gap:6px}.head{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:14px;background:#0b0d12;padding:5px 8px}.head b,.head small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.head b{font-size:13px}.head small{font-size:10.5px;color:var(--muted);margin-top:2px}.head button{margin:0;border-radius:999px;padding:6px 9px;font-size:12px}.stage,.pSw,.pSw>.swiper-wrapper,.pSlide,.sSw,.sSw>.swiper-wrapper,.sSlide{height:100%}.stage{background:#080a0d;border-radius:18px;overflow:hidden}.pSlide{padding:6px}.sSlide{display:flex}.card{height:100%;width:100%;display:grid;grid-template-rows:auto auto auto auto minmax(0,1fr) auto auto;gap:5px;border:1px solid var(--line);border-top:4px solid var(--orange);border-radius:17px;background:var(--card);padding:8px;overflow:hidden}.card.crit{border-top-color:var(--red)}.top{display:grid;grid-template-columns:1fr auto;gap:8px}.meta,.risk{font-size:10.5px;color:var(--muted);line-height:1.25}.risk{text-align:right}.risk b{color:var(--orange)}.phase{display:inline-block;margin-top:2px;border:1px solid var(--line-2);border-radius:999px;padding:1px 6px;font-size:9.5px;color:var(--blue)}.title{display:grid;grid-template-columns:1fr 26px;gap:8px;align-items:start}.ico{width:24px;height:24px;color:#fff}.ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.card h3{margin:0;font-size:clamp(15px,4.7vw,21px);line-height:1.05}.chips{display:flex;gap:4px;flex-wrap:wrap}.chip{border:1px solid var(--line-2);border-radius:999px;padding:2px 7px;font-size:10px;color:var(--muted)}.ops{display:grid;grid-template-columns:1fr 1fr;gap:4px}.op{border:1px solid var(--line);border-radius:10px;background:#0a0d12;padding:4px 6px;font-size:10.2px;color:#cdd3dc;line-height:1.18}.op b,.sec h4,.deps h4{display:block;color:#6f7783;text-transform:uppercase;font-size:8.8px;letter-spacing:.06em;margin:0 0 3px}.body,.deps{border:1px solid var(--line);border-radius:13px;background:#0a0d12;padding:0 8px;overflow:hidden}.sec{padding:4px 0;border-top:1px solid var(--line)}.sec:first-child{border-top:0}.sec p{font-size:10.5px;line-height:1.2;color:#cdd3dc;margin:0}.src{border:1px solid var(--line);border-radius:10px;background:#11151d;padding:4px 6px;margin-bottom:4px}.src b{font-size:10.2px;color:#fff}.src span,.src code{display:block;font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.src code{color:var(--blue)}.line{display:grid;grid-template-columns:auto 1fr;gap:5px;border:1px solid var(--line);border-radius:9px;background:#11151d;padding:3px 5px;font-size:10px;color:#cdd3dc;margin-bottom:3px}.line b{color:#6f7783}.dep{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;background:#11151d;padding:4px 6px;margin-bottom:4px;font-size:10.4px;color:#cdd3dc}.dep b{color:var(--muted)}.dep span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dep code{color:var(--blue);background:transparent}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:3px}.actions button{margin:0;border-radius:11px;padding:6px 2px;font-size:9px;white-space:nowrap}.actions [data-a=ok]{color:var(--green);border-color:#2c4d3c}.actions [data-a=no]{color:var(--red);border-color:#4d2c2c}.actions [data-a=mod]{color:var(--orange);border-color:#4d3a2a}.actions [data-a=more]{color:var(--blue);border-color:#2c3a4d}.panel,.info,.ov{position:fixed;z-index:90;border:1px solid var(--line-2);border-radius:16px;background:rgba(13,16,22,.98);box-shadow:0 22px 80px rgba(0,0,0,.48)}.panel{left:50%;top:50px;transform:translateX(-50%);width:min(720px,calc(100vw - 14px));display:none}.panel.open,.info.open,.ov.open{display:block}.ph,.oh{display:flex;justify-content:space-between;gap:8px;padding:10px;border-bottom:1px solid var(--line)}.ph h3,.oh h3{font-size:15px;margin:0}.ph p,.oh p{font-size:11px;color:var(--muted);margin:2px 0 0}.ph button,.oh button{width:32px;height:32px;border-radius:50%;margin:0}.pb{padding:10px}.info{right:7px;top:50px;width:min(350px,calc(100vw - 14px));display:none;padding:11px}.info p{font-size:11.5px;color:var(--muted)}.ov{left:7px;right:7px;top:50px;bottom:7px;display:none;overflow:hidden}.ob{height:calc(100% - 58px);overflow-y:auto;touch-action:pan-y;padding:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mini{min-height:108px;border:1px solid var(--line);border-radius:14px;background:#0a0d12;padding:8px;text-align:left}.mini h4{margin:0 0 6px;font-size:11px;line-height:1.15;color:var(--fg)}.mini.up{border-top:4px solid var(--orange)}.mini.down{border-bottom:4px solid var(--green)}.mini.peer{border-top:4px solid var(--yellow);border-bottom:4px solid var(--yellow)}.mini.sel{border-color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}.toast{position:fixed;left:50%;bottom:10px;transform:translateX(-50%) translateY(70px);z-index:100;background:#11141a;border:1px solid var(--line-2);border-radius:14px;padding:8px 10px;font-size:12px;transition:.2s}.toast.show{transform:translateX(-50%) translateY(0)}@media(max-height:720px){.card{gap:4px;padding:7px}.sec{padding:3px 0}.sec p{font-size:9.8px}.op{padding:3px 5px}.actions button{font-size:8.7px;padding:5px 1px}}
</style></head><body><div id="shell"></div><script src="nav.js"></script><script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script><script>
document.body.classList.add('ev');
const projects=[{name:'Extension limite',phase:'Conception · APS',cards:[{id:'EL-301',ico:'geo',title:'Absence de bornage avant implantation',labels:['Géomètre','Contradictoire','Risque élevé'],risk:'Élevée',status:'Contradictoire',decider:'Client + géomètre',due:'20/06/2026',src:[['Email','Client','14/06/2026','email-client-bornage.eml','SRC-01','Reçue','Brute','sources/EL-301_email_client.md','—'],['PDF','Géomètre à confirmer','15/06/2026','plan-limite-extrait.pdf','A','Indicée','À vérifier','sources/EL-301_plan_limite.md','pdf/plan-limite-extrait_A_2026-06-15.pdf']],est:'Le projet dépend d’une limite séparative non confirmée contradictoirement.',inc:'La limite réelle et opposable reste à établir avant validation APS.',act:'Demander confirmation géomètre et informer le client de la réserve.',miss:'Plan contradictoire ou document de bornage.',dec:'Valider, déplacer ou suspendre l’implantation APS.',am:'Rendez-vous ESQ',av:'Décision implantation avant APS',peer:'Étude de sol',rel:{up:['EL-300'],down:['EL-302','EL-303'],peer:['EL-304']}},{id:'EL-302',ico:'structure',title:'Reconnaissance des fondations existantes',labels:['Technique','À produire','Risque élevé'],risk:'Élevée',status:'Décision attendue',decider:'BET structure',due:'22/06/2026',src:[['Email','BET structure','16/06/2026','mail-bet-reco-fondations.eml','SRC-01','Technique','Reçue','sources/EL-302_mail_bet.md','—']],est:'La stratégie structurelle dépend des fondations existantes.',inc:'La nature et profondeur des fondations restent inconnues.',act:'Demander reconnaissance ciblée et avis structure.',miss:'Ouverture ou sondage localisé + retour BET.',dec:'Choisir principe structure compatible avec l’existant.',am:'EL-301',av:'Choix structure',peer:'Étude de sol',rel:{up:['EL-301'],down:['EL-303'],peer:['EL-304']}}]},{name:'Maison Lierre',phase:'Conception · Structure / APS',cards:[{id:'ML-201',ico:'structure',title:'Fondations profondes imposées par étude de sol',labels:['Technique','Bloquant','Risque élevé'],risk:'Critique',status:'Bloquant',decider:'BET structure + client',due:'20/06/2026',src:[['PDF','Bureau géotechnique','13/06/2026','G2AVP_Maison-Lierre.pdf','G2-AVP-B','Technique','Vérifiée','sources/ML-201_g2avp.md','pdf/G2AVP_Maison-Lierre_B_2026-06-13.pdf']],est:'Les fondations profondes modifient le principe constructif et le budget.',inc:'Le chiffrage et l’impact planning restent à stabiliser.',act:'Ouvrir arbitrage structure / budget avec le client.',miss:'Devis ou estimation structure complémentaire.',dec:'Valider principe structure et enveloppe budgétaire.',am:'Étude de sol',av:'Budget et choix structure',peer:'Adaptation plans',rel:{up:['ML-200'],down:['ML-202'],peer:['ML-204']}},{id:'ML-202',ico:'budget',title:'Impact budget structure',labels:['Budget','Décision attendue','Risque élevé'],risk:'Élevée',status:'Décision attendue',decider:'Client',due:'23/06/2026',src:[['PDF','BET structure','15/06/2026','estimation-impact-structure.pdf','EST-01','Indicée','À vérifier','sources/ML-202_estimation.md','pdf/estimation-impact-structure_EST-01_2026-06-15.pdf']],est:'Le budget doit être révisé avant engagement.',inc:'Le montant dépend des choix d’exécution.',act:'Présenter écart budgétaire et variantes au client.',miss:'Estimation entreprise ou BET consolidée.',dec:'Maintenir, réduire ou phaser le projet.',am:'ML-201',av:'Devis entreprises',peer:'ML-204',rel:{up:['ML-201'],down:[],peer:['ML-204']}}]}];
let pSw,sSw=[],selected={p:0,id:'EL-301'},timer,down,drag=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function icon(k){const d={geo:'<circle cx="12" cy="12" r="7"/><path d="M12 3v18M3 12h18"/>',structure:'<path d="M4 20h16M6 20V9l6-5 6 5v11M9 20v-7h6v7"/>',budget:'<path d="M15 6c-5-2-9 1-9 6s4 8 9 6M4 10h10M4 14h10"/>'}[k]||'<circle cx="12" cy="12" r="7"/>';return'<span class="ico"><svg viewBox="0 0 24 24">'+d+'</svg></span>'}
function chips(c){return'<div class="chips">'+c.labels.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>'}
function sources(c){return c.src.map(s=>'<div class="src"><b>'+s[0]+' · '+esc(s[3])+'</b><span>'+esc(s[1])+' · Date '+s[2]+' · Indice '+esc(s[4])+'</span><span>Force '+esc(s[5])+' · Statut '+esc(s[6])+'</span><code>MD '+esc(s[7])+' · PDF '+esc(s[8])+'</code></div>').join('')}
function deps(c){return [['Amont',c.am,(c.rel.up||[])[0]],['Aval',c.av,(c.rel.down||[])[0]],['Même',c.peer,(c.rel.peer||[])[0]]].map(d=>'<button class="dep" data-goto="'+esc(d[2]||'')+'"><b>'+d[0]+'</b><span>'+esc(d[1])+'</span><code>'+esc(d[2]||'—')+'</code></button>').join('')}
function card(c,pi){let p=projects[pi];return'<article class="swiper-slide sSlide"><div class="card '+(c.risk==='Critique'?'crit':'')+'" data-p="'+pi+'" data-id="'+c.id+'"><div class="top"><div class="meta">'+esc(p.name.toUpperCase())+' · '+esc(c.id)+'<br><span class="phase">'+esc(p.phase)+'</span><br>Date 16/06/2026</div><div class="risk">'+esc(c.risk)+'<br><b>Butoir '+esc(c.due)+'</b></div></div><div class="title"><h3>'+esc(c.title)+'</h3>'+icon(c.ico)+'</div>'+chips(c)+'<div class="ops"><div class="op"><b>Statut</b>'+esc(c.status)+'</div><div class="op"><b>Décideur attendu</b>'+esc(c.decider)+'</div></div><div class="body"><section class="sec"><h4>Sources</h4>'+sources(c)+'</section><section class="sec"><h4>Constat</h4><p><b>Établi</b> · '+esc(c.est)+'</p><p><b>Incertain</b> · '+esc(c.inc)+'</p></section><section class="sec"><h4>Actions recommandées</h4><div class="line"><b>Action</b><span>'+esc(c.act)+'</span></div><div class="line"><b>Manque</b><span>'+esc(c.miss)+'</span></div><div class="line"><b>Décision</b><span>'+esc(c.dec)+'</span></div></section></div><div class="deps"><h4>Dépendances</h4>'+deps(c)+'</div><div class="actions"><button data-a="ok" data-id="'+c.id+'">Valider</button><button data-a="no" data-id="'+c.id+'">Refuser</button><button data-a="mod" data-id="'+c.id+'">Modifier</button><button data-a="more" data-id="'+c.id+'">Recherche+</button></div></div></article>'}
function renderProjects(){return projects.map((p,pi)=>'<section class="swiper-slide pSlide"><div class="swiper sSw"><div class="swiper-wrapper">'+p.cards.map(c=>card(c,pi)).join('')+'</div></div></section>').join('')}
function find(id){for(let pi=0;pi<projects.length;pi++){let ci=projects[pi].cards.findIndex(c=>c.id===id);if(ci>=0)return{pi,ci,c:projects[pi].cards[ci]}}}
function setHead(){let p=projects[selected.p];barProject.textContent=p.name;barPhase.textContent='Phase · '+p.phase}
function goto(id){let f=find(id);if(!f){toast('Fiche liée absente : '+(id||'—'));return}selected={p:f.pi,id};pSw.slideTo(f.pi);setHead();setTimeout(()=>sSw[f.pi]?.slideTo(f.ci),40);closeOv()}
function relClass(c){if(c.id===selected.id)return'sel';let r=projects[selected.p].cards.find(x=>x.id===selected.id)?.rel||{};if((r.up||[]).includes(c.id))return'up';if((r.down||[]).includes(c.id))return'down';if((r.peer||[]).includes(c.id))return'peer';return''}
function openOv(pi,id){selected={p:+pi,id};setHead();renderOv();ov.classList.add('open')}
function closeOv(){ov.classList.remove('open')}
function renderOv(){let p=projects[selected.p];ovTitle.textContent=p.name+' · '+p.phase;ovSub.textContent='Mode dézoom · '+selected.id;ovGrid.innerHTML=p.cards.map(c=>'<button class="mini '+relClass(c)+'" data-mini="'+c.id+'"><h4>'+esc(c.title)+'</h4>'+chips(c)+'</button>').join('')}
function openAdd(){let p=projects[selected.p];panelTitle.textContent='Nouvelle fiche candidate';panelBody.innerHTML='<section class="sec"><h4>Projet / phase</h4><p>'+esc(p.name)+' · '+esc(p.phase)+'</p></section><section class="sec"><h4>Champs minimaux</h4><div class="line"><b>Titre</b><span>Nom court du point de contrôle</span></div><div class="line"><b>Source</b><span>Mail, PDF, MD, plan ou extraction à rattacher</span></div><div class="line"><b>Statut</b><span>À qualifier, à vérifier, contradictoire, bloquant</span></div><div class="line"><b>Décideur</b><span>Architecte, client, BET, mairie, entreprise, assureur</span></div></section><section class="sec"><h4>Limite</h4><p>Création candidate uniquement. Aucun registre n’est modifié.</p><button data-a="candidate">Préparer candidate</button></section>';panel.classList.add('open')}
function openPanel(a,id){let f=find(id),c=f?.c;panelTitle.textContent=a==='more'?'Recherche complémentaire':'Fiche de revue';panelBody.innerHTML=a==='more'?'<section class="sec"><h4>Manques ciblés</h4><div class="line"><b>Manque</b><span>'+esc(c.miss)+'</span></div><div class="line"><b>Décision</b><span>'+esc(c.dec)+'</span></div></section><section class="sec"><h4>Workflow</h4><p>Base projet → courriels → corpus DTU / règles → sources contrôlées → Evidence Candidate + Evidence Pack Candidate.</p></section>':'<section class="sec"><h4>Modification candidate</h4><p>Préparer une correction de fiche sans modifier le registre.</p></section>';panel.classList.add('open')}
function closePanel(){panel.classList.remove('open')}function info(){inf.classList.toggle('open')}function toast(s){to.textContent=s;to.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>to.classList.remove('show'),2200)}
function bind(){document.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};drag=false});document.addEventListener('pointermove',e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>12)drag=true});document.addEventListener('click',e=>{let c=e.target.closest('.card');if(c&&!drag&&!e.target.closest('button,input'))openOv(c.dataset.p,c.dataset.id);if(e.target.dataset.mini){if(e.target.dataset.mini===selected.id){let i=projects[selected.p].cards.findIndex(c=>c.id===selected.id);sSw[selected.p]?.slideTo(i);closeOv()}else{selected.id=e.target.dataset.mini;renderOv();let i=projects[selected.p].cards.findIndex(c=>c.id===selected.id);sSw[selected.p]?.slideTo(i)}}if(e.target.dataset.goto)goto(e.target.dataset.goto);if(e.target.dataset.close)closePanel(),closeOv();if(e.target.dataset.a){toast('Pantheon · intention candidate : '+e.target.dataset.a);if(['mod','more'].includes(e.target.dataset.a))openPanel(e.target.dataset.a,e.target.dataset.id)}})}
function init(){sSw=[...document.querySelectorAll('.sSw')].map(s=>new Swiper(s,{direction:'vertical',slidesPerView:1,spaceBetween:8,nested:true,threshold:8,touchAngle:35}));pSw=new Swiper('.pSw',{direction:'horizontal',slidesPerView:1,spaceBetween:8,threshold:8,touchAngle:35,on:{slideChange(){selected.p=this.activeIndex;selected.id=projects[selected.p].cards[0].id;setHead()}}});setHead()}
function render(){mountPage('Points de contrôle','',tpl.innerHTML.replace('__PROJECTS__',renderProjects()));bind();init()}
</script><template id="tpl"><div class="app"><header class="head"><div><b id="barProject">Points de contrôle</b><small id="barPhase">Phase · —</small></div><button onclick="openAdd()">+ Fiche</button><button onclick="info()">Infos</button></header><main class="stage"><div class="swiper pSw"><div class="swiper-wrapper">__PROJECTS__</div></div></main><aside id="inf" class="info"><p>Le header indique toujours le projet et la phase. Le bouton + Fiche prépare une nouvelle fiche candidate, sans effet direct.</p></aside><aside id="panel" class="panel"><div class="ph"><div><h3 id="panelTitle">Fiche</h3><p>Transmission candidate Pantheon</p></div><button data-close="1">×</button></div><div id="panelBody" class="pb"></div><div class="pb"><button data-close="1">Fermer</button></div></aside><aside id="ov" class="ov"><div class="oh"><div><h3 id="ovTitle">Projet</h3><p id="ovSub">Mode dézoom</p></div><button data-close="1">×</button></div><div class="ob"><div id="ovGrid" class="grid"></div></div></aside><div id="to" class="toast"></div></div></template><script>render()</script></body></html>
