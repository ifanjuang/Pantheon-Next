<style>
body.ev,body.ev html{overflow:hidden}body.ev .topbar,body.ev .bc,body.ev h2,body.ev .lede{display:none}body.ev .layout,body.ev .content,body.ev #page{height:100dvh;max-width:none;overflow:hidden}body.ev .content{padding:6px}.app{height:100%;display:grid;grid-template-rows:44px 1fr;gap:6px}.head{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:14px;background:#0b0d12;padding:5px 8px}.head b,.head small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.head b{font-size:13px}.head small{font-size:10.5px;color:var(--muted);margin-top:2px}.head button{margin:0;border-radius:999px;padding:6px 9px;font-size:12px}.stage,.pSw,.pSw>.swiper-wrapper,.pSlide,.sSw,.sSw>.swiper-wrapper,.sSlide{height:100%}.stage{background:#080a0d;border-radius:18px;overflow:hidden}.pSlide,.sSlide{padding:0}.sSlide{display:flex}.card{height:100%;width:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:6px;border:1px solid var(--line);border-top:4px solid var(--orange);border-radius:17px;background:var(--card);padding:8px;overflow:hidden}.card.crit{border-top-color:var(--red)}.top{display:grid;grid-template-columns:1fr auto;gap:8px}.meta,.risk{font-size:10.5px;color:var(--muted);line-height:1.25}.risk{text-align:right}.risk b{color:var(--orange)}.crit .risk b{color:var(--red)}.phase{display:inline-block;margin-top:2px;border:1px solid var(--line-2);border-radius:999px;padding:1px 6px;font-size:9.5px;color:var(--blue)}.title{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}.card h3{margin:0;font-size:clamp(16px,4.8vw,22px);line-height:1.05}.ico{width:24px;height:24px;color:#fff}.ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.chips{display:flex;gap:4px;flex-wrap:wrap}.chip{border:1px solid var(--line-2);border-radius:999px;padding:2px 7px;font-size:10px;color:var(--muted)}.body{border:1px solid var(--line);border-radius:14px;background:#0a0d12;overflow:hidden;padding:9px;cursor:pointer}.simple,.detail{height:100%;display:grid;align-content:start;gap:8px}.detail{display:none}.card.detail-on .simple{display:none}.card.detail-on .detail{display:grid}.sec{padding:7px 0;border-top:1px solid var(--line)}.sec:first-child{border-top:0;padding-top:0}.sec h4,.rels h4{display:block;color:#6f7783;text-transform:uppercase;font-size:8.8px;letter-spacing:.06em;margin:0 0 5px}.sec p{font-size:12.5px;line-height:1.3;color:#cdd3dc;margin:0}.q{border:1px solid #26364d;border-radius:12px;background:#0c1420;padding:8px}.q p{font-size:14.5px;color:#f2f0eb}.src{border:1px solid var(--line);border-radius:10px;background:#11151d;padding:5px 7px;margin-bottom:5px}.src b{font-size:10.5px;color:#fff}.src span,.src code{display:block;font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.src code{color:var(--blue)}.rels{border:1px solid var(--line);border-radius:13px;background:#0a0d12;padding:6px 8px;overflow:hidden}.rel-row{display:grid;grid-template-columns:72px 1fr;gap:7px;align-items:center;margin:4px 0}.rel-label{font-size:9.4px;color:#6f7783;text-transform:uppercase;letter-spacing:.06em}.rel-pills{display:flex;gap:5px;overflow:hidden}.pill{min-width:34px;text-align:center;border:1px solid var(--line-2);border-radius:999px;background:#11151d;padding:3px 7px;font-size:10.5px;color:var(--muted)}.dep{border-color:#2c3a4d;color:var(--blue)}.impact{border-color:#4d3a2a;color:var(--orange)}.coh{border-color:#4d2c2c;color:var(--red)}.warn{border-color:#4d452a;color:var(--yellow)}.res{border-color:#2c4d3c;color:var(--green)}.rel-lines{display:none}.card.detail-on .rel-pills{display:none}.card.detail-on .rel-lines{display:block}.rel-line{display:grid;grid-template-columns:42px 1fr;gap:7px;align-items:center;border:1px solid var(--line);border-radius:10px;background:#11151d;padding:5px 7px;margin:4px 0;font-size:10.8px;color:#d7dce4;text-align:left;width:100%}.rel-line code{color:inherit;background:transparent}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.actions button{margin:0;border-radius:11px;padding:6px 2px;font-size:9px;white-space:nowrap}.actions [data-a=ok]{color:var(--green);border-color:#2c4d3c}.actions [data-a=no]{color:var(--red);border-color:#4d2c2c}.actions [data-a=mod]{color:var(--orange);border-color:#4d3a2a}.actions [data-a=more]{color:var(--blue);border-color:#2c3a4d}.panel,.info,.ov{position:fixed;z-index:90;border:1px solid var(--line-2);border-radius:16px;background:rgba(13,16,22,.98);box-shadow:0 22px 80px rgba(0,0,0,.48)}.info{right:7px;top:50px;width:min(360px,calc(100vw - 14px));display:none;padding:11px}.info.open,.ov.open{display:block}.info p{font-size:11.5px;color:var(--muted);margin:7px 0}.ov{left:7px;right:7px;top:50px;bottom:7px;display:none;overflow:hidden}.oh{display:flex;justify-content:space-between;gap:8px;padding:10px;border-bottom:1px solid var(--line)}.oh h3{font-size:15px;margin:0}.oh p{font-size:11px;color:var(--muted);margin:2px 0 0}.oh button{width:32px;height:32px;border-radius:50%;margin:0}.ob{height:calc(100% - 58px);overflow-y:auto;touch-action:pan-y;padding:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mini{min-height:108px;border:1px solid var(--line);border-radius:14px;background:#0a0d12;padding:8px;text-align:left}.mini h4{margin:0 0 6px;font-size:11px;line-height:1.15;color:var(--fg)}.mini.sel{border-color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}.mini.depM{border-top:4px solid var(--blue)}.mini.impM{border-bottom:4px solid var(--orange)}.mini.cohM{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}.mini.warnM{border-top:4px solid var(--yellow)}.mini.resM{border-top:4px solid var(--green)}.toast{position:fixed;left:50%;bottom:10px;transform:translateX(-50%) translateY(70px);z-index:100;background:#11141a;border:1px solid var(--line-2);border-radius:14px;padding:8px 10px;font-size:12px;transition:.2s}.toast.show{transform:translateX(-50%) translateY(0)}@media(max-height:720px){.card{gap:4px;padding:7px}.sec{padding:4px 0}.sec p{font-size:11.5px}.q p{font-size:12.5px}.actions button{font-size:8.5px;padding:5px 1px}.rel-row{margin:2px 0}}
</style>

<body><div id="shell"></div><script src="nav.js"></script><script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script><script>
document.body.classList.add('ev');
const projects=[{name:'Sélection sols',phase:'Conception · Choix matériaux',cards:[
{id:'SOL-001',kind:'warn',title:'Dossier de sélection sols',labels:['Dossier','Avertissement','À vérifier'],risk:'Simple',status:'Candidate',due:'Avant commande',desc:'Le client souhaite retenir un parquet acheté hors circuit entreprise, avec une option grande dalle minérale dans la même liste de choix.',question:'Le poseur accepte-t-il la garantie de pose si le produit est fourni par le client, et l’option grande dalle est-elle compatible avec support OSB / plancher bois ?',decision:'Faut-il demander une confirmation écrite du poseur et déclencher une vérification support / estimatif avant validation client ?',sources:[['PDF','Client','19/06/2026','selection-sols-client.pdf','SEL-03','Reçue','Brute'],['PDF','Fournisseur','19/06/2026','option-a-grande-dalle-minerale.pdf','MAT-A','Indicée','Candidate']],analysis:'L’analyse ne prescrit pas une solution. Elle signale que le choix client peut affecter garantie poseur, support structurel, estimatif et commande.',notes:'Note architecte : produit fourni client. Demander réserve écrite si l’entreprise accepte la pose sans fournir le matériau.',log:'17/06/2026 · fiche candidate créée. 17/06/2026 · avertissement manuel ajouté. Aucun effet externe.',rels:{dep:[['A12','Structure plancher / support OSB'],['B04','Validation entreprise poseur']],impact:[['C07','Estimatif sols à réviser si seuil atteint'],['D03','Commande matériaux bloquée avant validation support']],coh:[['S03','Tension grande dalle / support bois']],warn:[['W01','Parquet vente privée : garantie poseur à confirmer']],res:[['RES-001','Arbitrage sol / structure / coût']]}},
{id:'A12',kind:'crit',title:'Structure plancher / support OSB',labels:['Structure','À réanalyser','Risque critique'],risk:'Critique',status:'À vérifier',due:'Avant devis',desc:'Le support bois / OSB était acceptable pour une hypothèse courante, mais la grande dalle crée une nouvelle hypothèse.',question:'La validation structure précédente couvre-t-elle explicitement le format, la rigidité et la pose de la grande dalle ?',decision:'Faut-il demander un avis structure ciblé avant de laisser cette option dans la sélection client ?',sources:[['MD','Agence','20/06/2026','analyse-incompatibilite-sol-osb.md','AN-01','Interne','Candidate']],analysis:'La fiche ne redevient pas candidate par propagation. Elle reste validée dans son périmètre précédent et reçoit une demande de réanalyse.',notes:'Hypothèse H1 : revêtement courant. Hypothèse H2 : grande dalle sur OSB.',log:'20/06/2026 · impact candidat reçu depuis SOL-001.',rels:{dep:[['SOL-001','Hypothèse de revêtement']],impact:[['C07','Estimatif dépend du résultat structure']],coh:[['S03','Compatibilité support / grande dalle']],warn:[],res:[['RES-001','Arbitrage sol / structure / coût']]}}]},
{name:'Chantier dépendances',phase:'Chantier · Phasage',cards:[
{id:'RES-041',kind:'crit',title:'Cycle maçon / couvreur / plaquiste',labels:['Résolution','Cycle','À arbitrer'],risk:'Critique',status:'À arbitrer',due:'Avant prochain CR',desc:'Le maçon attend le plaquiste, le plaquiste dépend du hors d’eau, et le couvreur attend un support maçonnerie terminé.',question:'Faut-il créer un phasage provisoire, une protection temporaire ou une réunion d’arbitrage entreprises ?',decision:'Quelle séquence doit être retenue pour casser le cycle sans créer de responsabilité implicite ?',sources:[['CR','Architecte','17/06/2026','cr-chantier-012.md','CR-12','Interne','Candidate']],analysis:'Le problème n’appartient pas à une fiche isolée. C’est un nœud relationnel global.',notes:'Fiche de résolution proposée après revue globale du graphe projet.',log:'17/06/2026 · cycle détecté par revue globale.',rels:{dep:[['MAC-001','Maçonnerie'],['COUV-001','Couverture'],['PLA-001','Plaquiste']],impact:[['PLN-001','Planning à réviser']],coh:[['SEQ-001','Séquence impossible sans arbitrage']],warn:[],res:[]}}
]}];
let pSw,sSw=[],selected={p:0,id:'SOL-001'},timer,down,drag=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function icon(k){const d={warn:'<path d="M12 4l9 16H3zM12 9v5M12 17h.01"/>',crit:'<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/>',ok:'<path d="M20 6L9 17l-5-5"/>'}[k]||'<circle cx="12" cy="12" r="7"/>';return'<span class="ico"><svg viewBox="0 0 24 24">'+d+'</svg></span>'}
function chips(c){return'<div class="chips">'+c.labels.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>'}
function srcs(c){return c.sources.map(s=>'<div class="src"><b>'+esc(s[0])+' · '+esc(s[3])+'</b><span>'+esc(s[1])+' · Date '+esc(s[2])+' · Indice '+esc(s[4])+'</span><span>Force '+esc(s[5])+' · Statut '+esc(s[6])+'</span><code>source candidate</code></div>').join('')}
function pills(c,t,cls){let a=c.rels[t]||[];return'<div class="rel-pills">'+a.map(x=>'<button class="pill '+cls+'" data-goto="'+esc(x[0])+'">'+esc(x[0])+'</button>').join('')+'</div><div class="rel-lines">'+a.map(x=>'<button class="rel-line '+cls+'" data-goto="'+esc(x[0])+'"><code>'+esc(x[0])+'</code><span>'+esc(x[1])+'</span></button>').join('')+'</div>'}
function rels(c){return'<div class="rels"><div class="rel-row"><div class="rel-label">Dépend</div>'+pills(c,'dep','dep')+'</div><div class="rel-row"><div class="rel-label">Impact</div>'+pills(c,'impact','impact')+'</div><div class="rel-row"><div class="rel-label">Cohérence</div>'+pills(c,'coh','coh')+'</div><div class="rel-row"><div class="rel-label">Avert.</div>'+pills(c,'warn','warn')+'</div><div class="rel-row"><div class="rel-label">Résolution</div>'+pills(c,'res','res')+'</div></div>'}
function card(c,pi){let p=projects[pi];return'<article class="swiper-slide sSlide"><div class="card '+(c.risk==='Critique'?'crit':'')+'" data-p="'+pi+'" data-id="'+c.id+'"><div class="top"><div class="meta">'+esc(p.name.toUpperCase())+' · '+esc(c.id)+'<br><span class="phase">'+esc(p.phase)+'</span><br>Date 17/06/2026</div><div class="risk">'+esc(c.risk)+'<br><b>Butoir '+esc(c.due)+'</b></div></div><div class="title"><h3>'+esc(c.title)+'</h3>'+icon(c.kind)+'</div>'+chips(c)+'<section class="body"><div class="simple"><section class="sec"><h4>Description</h4><p>'+esc(c.desc)+'</p></section><section class="sec q"><h4>Question Pantheon</h4><p>'+esc(c.question)+'</p></section><section class="sec"><h4>Décision attendue</h4><p>'+esc(c.decision)+'</p></section></div><div class="detail"><section class="sec"><h4>Sources</h4>'+srcs(c)+'</section><section class="sec"><h4>Analyse</h4><p>'+esc(c.analysis)+'</p></section><section class="sec"><h4>Notes</h4><p>'+esc(c.notes)+'</p></section><section class="sec"><h4>Journal</h4><p>'+esc(c.log)+'</p></section></div></section>'+rels(c)+'<div class="actions"><button data-a="ok">Valider</button><button data-a="no">Refuser</button><button data-a="mod">Modifier</button><button data-a="more">Recherche+</button></div></div></article>'}
function renderProjects(){return projects.map((p,pi)=>'<section class="swiper-slide pSlide"><div class="swiper sSw"><div class="swiper-wrapper">'+p.cards.map(c=>card(c,pi)).join('')+'</div></div></section>').join('')}
function find(id){for(let pi=0;pi<projects.length;pi++){let ci=projects[pi].cards.findIndex(c=>c.id===id);if(ci>=0)return{pi,ci,c:projects[pi].cards[ci]}}}
function setHead(){let p=projects[selected.p];barProject.textContent=p.name;barPhase.textContent='Phase · '+p.phase+' · '+p.cards.length+' cartes'}
function goto(id){let f=find(id);if(!f){toast('Carte liée absente dans ce prototype : '+id);return}selected={p:f.pi,id};pSw.slideTo(f.pi);setHead();setTimeout(()=>sSw[f.pi]?.slideTo(f.ci),50);closeOv()}
function relClass(c){if(c.id===selected.id)return'sel';let s=projects[selected.p].cards.find(x=>x.id===selected.id);if(!s)return'';let flat=(k)=>(s.rels[k]||[]).map(x=>x[0]);if(flat('dep').includes(c.id))return'depM';if(flat('impact').includes(c.id))return'impM';if(flat('coh').includes(c.id))return'cohM';if(flat('warn').includes(c.id))return'warnM';if(flat('res').includes(c.id))return'resM';return''}
function openOv(pi,id){selected={p:+pi,id};setHead();renderOv();ov.classList.add('open')}
function closeOv(){ov.classList.remove('open')}
function renderOv(){let p=projects[selected.p];ovTitle.textContent=p.name+' · '+p.phase;ovSub.textContent='Cartes liées en premier · '+selected.id;let active=p.cards.find(c=>c.id===selected.id);let related=[...(active?.rels.dep||[]),...(active?.rels.impact||[]),...(active?.rels.coh||[]),...(active?.rels.warn||[]),...(active?.rels.res||[])].map(x=>x[0]);let sorted=[...p.cards].sort((a,b)=>(a.id===selected.id?-1:b.id===selected.id?1:related.includes(a.id)&&!related.includes(b.id)?-1:!related.includes(a.id)&&related.includes(b.id)?1:0));ovGrid.innerHTML=sorted.map(c=>'<button class="mini '+relClass(c)+'" data-mini="'+c.id+'"><h4>'+esc(c.id)+' · '+esc(c.title)+'</h4>'+chips(c)+'</button>').join('')}
function info(){inf.classList.toggle('open')}function toast(s){to.textContent=s;to.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>to.classList.remove('show'),2100)}
function bind(){document.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};drag=false});document.addEventListener('pointermove',e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>12)drag=true});document.addEventListener('click',e=>{let body=e.target.closest('.body');if(body&&!drag){body.closest('.card').classList.toggle('detail-on');return}let c=e.target.closest('.card');if(c&&!drag&&!e.target.closest('button'))openOv(c.dataset.p,c.dataset.id);if(e.target.dataset.goto)goto(e.target.dataset.goto);if(e.target.dataset.mini){if(e.target.dataset.mini===selected.id){let i=projects[selected.p].cards.findIndex(c=>c.id===selected.id);sSw[selected.p]?.slideTo(i);closeOv()}else{selected.id=e.target.dataset.mini;renderOv();let i=projects[selected.p].cards.findIndex(c=>c.id===selected.id);sSw[selected.p]?.slideTo(i)}}if(e.target.dataset.close)closeOv();if(e.target.dataset.a)toast('Pantheon · intention candidate : '+e.target.dataset.a)});document.addEventListener('pointerdown',e=>{let card=e.target.closest('.card');if(!card)return;let id=card.dataset.id,pi=card.dataset.p;clearTimeout(timer);timer=setTimeout(()=>{openOv(pi,id)},650)});document.addEventListener('pointerup',()=>clearTimeout(timer));document.addEventListener('pointercancel',()=>clearTimeout(timer))}
function init(){sSw=[...document.querySelectorAll('.sSw')].map(s=>new Swiper(s,{direction:'vertical',slidesPerView:1,spaceBetween:8,nested:true,threshold:8,touchAngle:35}));pSw=new Swiper('.pSw',{direction:'horizontal',slidesPerView:1,spaceBetween:8,threshold:8,touchAngle:35,on:{slideChange(){selected.p=this.activeIndex;selected.id=projects[selected.p].cards[0].id;setHead()}}});setHead()}
function render(){mountPage('Cartes à résoudre','',tpl.innerHTML.replace('__PROJECTS__',renderProjects()));bind();init()}
</script><template id="tpl"><div class="app"><header class="head"><div><b id="barProject">Cartes à résoudre</b><small id="barPhase">Phase · —</small></div><button onclick="info()">Règle</button><button onclick="openOv(selected.p,selected.id)">Dézoom</button></header><main class="stage"><div class="swiper pSw"><div class="swiper-wrapper">__PROJECTS__</div></div></main><aside id="inf" class="info"><p>La fiche affiche le problème. Le footer affiche les relations. Le graphe vérifie les effets. La fiche de résolution traite les nœuds complexes. Pantheon formule en questions. L’humain tranche.</p><p>Swipe gauche/droite : projet. Swipe haut/bas : carte. Tap sur le corps : simple / détail. Appui long : dézoom.</p></aside><aside id="ov" class="ov"><div class="oh"><div><h3 id="ovTitle">Projet</h3><p id="ovSub">Dézoom</p></div><button data-close="1">×</button></div><div class="ob"><div id="ovGrid" class="grid"></div></div></aside><div id="to" class="toast"></div></div></template><script>render()</script></body></html>
