<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pantheon Control — Cartes à résoudre</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<style>
*{box-sizing:border-box}
body.ev,body.ev html{overflow:hidden}
body.ev .topbar,body.ev .bc,body.ev h2,body.ev .lede{display:none}
body.ev .layout,body.ev .content,body.ev #page{height:100dvh;max-width:none;overflow:hidden}
body.ev .content{padding:0!important}
.app{height:100%;display:grid;grid-template-rows:44px 1fr;gap:6px;padding:6px}
.head{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:14px;background:#0b0d12;padding:5px 8px}
.head b,.head small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.head b{font-size:13px}.head small{font-size:10.5px;color:var(--muted);margin-top:2px}.head button{margin:0;border-radius:999px;padding:6px 9px;font-size:12px}
.stage,.pSw,.pSw>.swiper-wrapper,.pSlide,.sSw,.sSw>.swiper-wrapper,.sSlide{height:100%;width:100%;min-width:0}.stage{border-radius:18px;overflow:hidden}.pSlide,.sSlide{padding:0}.sSlide{display:flex}
.card{height:100%;width:100%;margin:0;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:6px;border:1px solid var(--line);border-top:4px solid var(--orange);border-radius:17px;background:var(--card);padding:8px;overflow:hidden}.card.crit{border-top-color:var(--red)}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.meta{font-size:10.5px;color:var(--muted);line-height:1.25}.moment{display:block;color:var(--blue);font-size:10px;margin-top:2px}.risk{text-align:right;font-size:10.5px;color:var(--muted);line-height:1.25}.risk b{display:block;color:var(--orange);font-size:12.5px;font-weight:800}.crit .risk b{color:var(--red)}
.title{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}.card h3{margin:0;font-size:clamp(16px,4.8vw,22px);line-height:1.05}.ico{width:24px;height:24px;color:#fff}.ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:4px;flex-wrap:wrap}.chip{border:1px solid var(--line-2);border-radius:999px;padding:2px 7px;font-size:10px;color:var(--muted)}
.stack{height:100%;min-height:0;border:1px solid var(--line);border-radius:14px;background:#0a0d12;overflow:hidden;padding:0 9px;display:grid;grid-template-rows:auto minmax(0,1fr) auto}.contentToggle{cursor:pointer}.simple,.detail{display:grid;align-content:start;gap:0}.detail{display:none}.card.detail-on .simple{display:none}.card.detail-on .detail{display:grid}
.sec{padding:7px 0;border-top:1px solid var(--line)}.sec:first-child{border-top:0}.sec h4{display:block;color:#6f7783;text-transform:uppercase;font-size:8.8px;letter-spacing:.06em;margin:0 0 5px}.sec p{font-size:12.5px;line-height:1.32;color:#cdd3dc;margin:0}
.sec p.heroText{font-size:62px;font-weight:950;line-height:.86;color:#f2f0eb;letter-spacing:-.07em;margin:0;padding-bottom:8px;border-bottom:1px solid var(--line)}
.src{border:1px solid var(--line);border-radius:10px;background:#11151d;padding:5px 7px;margin-bottom:5px}.src b{font-size:10.5px;color:#fff}.src span,.src code{display:block;font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.src code{color:var(--blue)}
.rels{padding:8px 0;cursor:pointer;min-height:0}.rel-pills{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(40px,1fr);gap:5px;overflow-x:auto;overflow-y:hidden;align-items:center;min-height:28px;padding-bottom:1px}.pill{width:100%;min-width:0;height:28px;text-align:center;border:1px solid var(--line-2);border-radius:999px;background:#11151d;padding:4px 6px;font-size:10.5px;color:var(--muted);display:grid;place-items:center}.dep{border-color:#2c3a4d;color:var(--blue)}.impact{border-color:#4d3a2a;color:var(--orange)}.coh{border-color:#4d2c2c;color:var(--red)}.warn{border-color:#4d452a;color:var(--yellow)}.res{border-color:#2c4d3c;color:var(--green)}
.rel-detail{display:none;width:100%}.card.rels-on .contentToggle,.card.rels-on .suggestSection{display:none}.card.rels-on .stack{grid-template-rows:minmax(0,1fr)}.card.rels-on .rels{height:100%;overflow:auto;padding-top:0}.card.rels-on .rel-pills{display:none}.card.rels-on .rel-detail{display:block}.rel-item{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line);font-size:11px}.rel-item:first-child{border-top:0}.rel-item code{width:44px;justify-self:center;align-self:start;border:1px solid currentColor;border-radius:999px;padding:3px 5px;background:transparent;text-align:center;overflow:hidden;text-overflow:ellipsis}.rel-item b{display:block;font-size:11.3px;color:#f1f3f5;margin-bottom:2px}.rel-item span{display:block;color:var(--muted);line-height:1.25}
.suggestSection{align-self:end;border-top:1px solid var(--line);padding:7px 0}.suggestSection h4{display:block;color:#6f7783;text-transform:uppercase;font-size:8.8px;letter-spacing:.06em;margin:0 0 5px}.suggestChecks{display:grid;grid-template-columns:1fr 1fr;gap:5px}.suggestChecks label{display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:10px;background:#11151d;padding:6px 7px;font-size:11px;line-height:1.05;color:#d7dce4}.suggestChecks input{width:14px;height:14px;margin:0;accent-color:var(--blue)}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;align-self:end}.actions button{margin:0;border-radius:11px;padding:6px 2px;font-size:9px;white-space:nowrap}.actions [data-a=ok]{color:var(--green);border-color:#2c4d3c}.actions [data-a=no]{color:var(--red);border-color:#4d2c2c}.actions [data-a=mod]{color:var(--orange);border-color:#4d3a2a}.actions [data-a=more]{color:var(--blue);border-color:#2c3a4d}
.info,.ov{position:fixed;z-index:90;border:1px solid var(--line-2);border-radius:16px;background:rgba(13,16,22,.98);box-shadow:0 22px 80px rgba(0,0,0,.48)}.info{right:7px;top:50px;width:min(360px,calc(100vw - 14px));display:none;padding:11px}.info.open,.ov.open{display:block}.info p{font-size:11.5px;color:var(--muted);margin:7px 0}.ov{left:7px;right:7px;top:50px;bottom:7px;display:none;overflow:hidden}.oh{display:flex;justify-content:space-between;gap:8px;padding:10px;border-bottom:1px solid var(--line)}.oh h3{font-size:15px;margin:0}.oh p{font-size:11px;color:var(--muted);margin:2px 0 0}.oh button{width:32px;height:32px;border-radius:50%;margin:0}.ob{height:calc(100% - 58px);overflow-y:auto;touch-action:pan-y;padding:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mini{min-height:108px;border:1px solid var(--line);border-radius:14px;background:#0a0d12;padding:8px;text-align:left}.mini h4{margin:0 0 6px;font-size:11px;line-height:1.15;color:var(--fg)}.mini.sel{border-color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}.mini.depM{border-top:4px solid var(--blue)}.mini.impM{border-bottom:4px solid var(--orange)}.mini.cohM{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}.mini.warnM{border-top:4px solid var(--yellow)}.mini.resM{border-top:4px solid var(--green)}.toast{position:fixed;left:50%;bottom:10px;transform:translateX(-50%) translateY(70px);z-index:100;background:#11141a;border:1px solid var(--line-2);border-radius:14px;padding:8px 10px;font-size:12px;transition:.2s}.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-height:720px){.app{padding:5px}.card{gap:4px;padding:7px}.sec{padding:5px 0}.sec p.heroText{font-size:54px;line-height:.86}.suggestChecks{gap:4px}.suggestChecks label{font-size:10px;padding:5px}.actions button{font-size:8.5px;padding:5px 1px}.rel-item{padding:6px 0}}
</style>
</head>
<body><div id="shell"></div><script src="nav.js"></script><script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script><script>
document.body.classList.add('ev');
const DATA_URL='evidence_cards_game_data.json';
let projects=[],pSw,sSw=[],selected={p:0,id:null},timer,down,drag=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function shortText(s,max=105){s=String(s??'').trim();let cut=s.split(/(?<=[.!?])\s+/)[0]||s;if(cut.length>max)cut=cut.slice(0,max).replace(/\s+\S*$/,'')+'…';return cut}
function descriptionText(c){if(c.id==='SOL-001')return 'Demande MOA pour achat de fournitures hors circuit.';return shortText(c.desc,74)}
function suggestionOptions(c){if(c.id==='SOL-001')return ['Changer matériau','Avertir impacts','Acter et réviser','Tester variante'];let r=c.rels||{};if((r.impact||[]).length||(r.coh||[]).length)return ['Modifier option','Avertir impacts','Acter / réviser'];return [shortText(c.suggest,55)]}
function icon(k){const d={warn:'<path d="M12 4l9 16H3zM12 9v5M12 17h.01"/>',crit:'<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/>',ok:'<path d="M20 6L9 17l-5-5"/>'}[k]||'<circle cx="12" cy="12" r="7"/>';return'<span class="ico"><svg viewBox="0 0 24 24">'+d+'</svg></span>'}
function chips(c){return'<div class="chips">'+(c.labels||[]).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>'}
function srcs(c){return (c.sources||[]).map(s=>'<div class="src"><b>'+esc(s[0])+' · '+esc(s[3])+'</b><span>'+esc(s[1])+' · Date '+esc(s[2])+' · Indice '+esc(s[4])+'</span><span>Force '+esc(s[5])+' · Statut '+esc(s[6])+'</span><code>source candidate</code></div>').join('')||'<p>Aucune source renseignée.</p>'}
function relPill(items,cls){return (items||[]).map(x=>'<button class="pill '+cls+'">'+esc(x[0])+'</button>').join('')}
function relDetail(items,cls){return (items||[]).map(x=>'<div class="rel-item '+cls+'"><code>'+esc(x[0])+'</code><div><b>'+esc(x[1])+'</b><span>'+esc(x[2]||'Raison à qualifier.')+'</span></div></div>').join('')}
function rels(c){let r=c.rels||{};return'<section class="rels"><div class="rel-pills">'+relPill(r.dep,'dep')+relPill(r.impact,'impact')+relPill(r.coh,'coh')+relPill(r.warn,'warn')+relPill(r.res,'res')+'</div><div class="rel-detail">'+relDetail(r.dep,'dep')+relDetail(r.impact,'impact')+relDetail(r.coh,'coh')+relDetail(r.warn,'warn')+relDetail(r.res,'res')+'</div></section>'}
function suggestedChecks(c){return'<section class="suggestSection"><h4>Actions suggérées</h4><div class="suggestChecks">'+suggestionOptions(c).map((x,i)=>'<label><input type="checkbox" data-suggest="'+i+'"><span>'+esc(x)+'</span></label>').join('')+'</div></section>'}
function card(c,pi){let p=projects[pi];return'<article class="swiper-slide sSlide"><div class="card '+(c.risk==='Critique'?'crit':'')+'" data-p="'+pi+'" data-id="'+esc(c.id)+'"><div class="top"><div class="meta">'+esc(p.name.toUpperCase())+' · '+esc(c.id)+'<span class="moment">Date '+esc(c.date)+' · '+esc(c.moment)+'</span></div><div class="risk">Risque<br><b>'+esc(c.risk)+'</b></div></div><div class="title"><h3>'+esc(c.title)+'</h3>'+icon(c.kind)+'</div>'+chips(c)+'<section class="stack"><div class="contentToggle"><div class="simple"><section class="sec"><h4>Description</h4><p class="heroText">'+esc(descriptionText(c))+'</p></section></div><div class="detail"><section class="sec"><h4>Sources</h4>'+srcs(c)+'</section><section class="sec"><h4>Analyse</h4><p>'+esc(c.analysis)+'</p></section><section class="sec"><h4>Notes</h4><p>'+esc(c.notes)+'</p></section><section class="sec"><h4>Journal</h4><p>'+esc(c.log)+'</p></section></div></div>'+rels(c)+suggestedChecks(c)+'</section><div class="actions"><button data-a="ok">Valider</button><button data-a="no">Refuser</button><button data-a="mod">Modifier</button><button data-a="more">Recherche+</button></div></div></article>'}
function renderProjects(){return projects.map((p,pi)=>'<section class="swiper-slide pSlide"><div class="swiper sSw"><div class="swiper-wrapper">'+(p.cards||[]).map(c=>card(c,pi)).join('')+'</div></div></section>').join('')}
function find(id){for(let pi=0;pi<projects.length;pi++){let ci=(projects[pi].cards||[]).findIndex(c=>c.id===id);if(ci>=0)return{pi,ci,c:projects[pi].cards[ci]}}}
function setHead(){let p=projects[selected.p];barProject.textContent=p?.name||'Cartes à résoudre';barPhase.textContent=p?'Phase · '+p.phase+' · '+(p.cards||[]).length+' cartes':'Base non chargée'}
function relIds(c){let r=c?.rels||{};return [...(r.dep||[]),...(r.impact||[]),...(r.coh||[]),...(r.warn||[]),...(r.res||[])].map(x=>x[0])}
function relClass(c){if(c.id===selected.id)return'sel';let s=(projects[selected.p]?.cards||[]).find(x=>x.id===selected.id);if(!s)return'';let r=s.rels||{};let has=k=>(r[k]||[]).some(x=>x[0]===c.id);if(has('dep'))return'depM';if(has('impact'))return'impM';if(has('coh'))return'cohM';if(has('warn'))return'warnM';if(has('res'))return'resM';return''}
function openOv(pi,id){selected={p:+pi,id};setHead();renderOv();ov.classList.add('open')}
function closeOv(){ov.classList.remove('open')}
function renderOv(){let p=projects[selected.p];ovTitle.textContent=p.name+' · '+p.phase;ovSub.textContent='Cartes liées en premier · '+selected.id;let active=(p.cards||[]).find(c=>c.id===selected.id),related=active?relIds(active):[];let sorted=[...(p.cards||[])].sort((a,b)=>(a.id===selected.id?-1:b.id===selected.id?1:related.includes(a.id)&&!related.includes(b.id)?-1:!related.includes(a.id)&&related.includes(b.id)?1:0));ovGrid.innerHTML=sorted.map(c=>'<button class="mini '+relClass(c)+'" data-mini="'+esc(c.id)+'"><h4>'+esc(c.id)+' · '+esc(c.title)+'</h4>'+chips(c)+'</button>').join('')}
function info(){inf.classList.toggle('open')}function toast(s){to.textContent=s;to.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>to.classList.remove('show'),2100)}
function bind(){document.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};drag=false});document.addEventListener('pointermove',e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>12)drag=true});document.addEventListener('click',e=>{let rel=e.target.closest('.rels');if(rel&&!drag){rel.closest('.card').classList.toggle('rels-on');return}let body=e.target.closest('.contentToggle');if(body&&!drag){body.closest('.card').classList.toggle('detail-on');return}let c=e.target.closest('.card');if(c&&!drag&&!e.target.closest('button'))openOv(c.dataset.p,c.dataset.id);if(e.target.dataset.mini){if(e.target.dataset.mini===selected.id){let i=(projects[selected.p].cards||[]).findIndex(c=>c.id===selected.id);sSw[selected.p]?.slideTo(i);closeOv()}else{selected.id=e.target.dataset.mini;renderOv();let i=(projects[selected.p].cards||[]).findIndex(c=>c.id===selected.id);sSw[selected.p]?.slideTo(i)}}if(e.target.dataset.close)closeOv();if(e.target.dataset.a)toast('Pantheon · intention candidate : '+e.target.dataset.a)});document.addEventListener('pointerdown',e=>{let card=e.target.closest('.card');if(!card)return;let id=card.dataset.id,pi=card.dataset.p;clearTimeout(timer);timer=setTimeout(()=>{openOv(pi,id)},650)});document.addEventListener('pointerup',()=>clearTimeout(timer));document.addEventListener('pointercancel',()=>clearTimeout(timer))}
function init(){sSw=[...document.querySelectorAll('.sSw')].map(s=>new Swiper(s,{direction:'vertical',slidesPerView:1,spaceBetween:8,nested:true,threshold:8,touchAngle:35}));pSw=new Swiper('.pSw',{direction:'horizontal',slidesPerView:1,spaceBetween:8,threshold:8,touchAngle:35,on:{slideChange(){selected.p=this.activeIndex;selected.id=projects[selected.p]?.cards?.[0]?.id||null;setHead()}}});selected.id=projects[0]?.cards?.[0]?.id||null;setHead()}
function renderPage(){mountPage('Cartes à résoudre','',tpl.innerHTML.replace('__PROJECTS__',renderProjects()));bind();init()}
async function loadData(){try{let r=await fetch(DATA_URL,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let data=await r.json();projects=data.projects||[];renderPage()}catch(e){mountPage('Cartes à résoudre','', '<div class="app"><header class="head"><div><b>Base indisponible</b><small>'+esc(DATA_URL)+'</small></div></header><main class="stage"><div style="padding:16px;color:var(--muted)">Impossible de charger la base JSON. Vérifier le fichier <code>'+esc(DATA_URL)+'</code>.</div></main></div>');console.error(e)}}
</script><template id="tpl"><div class="app"><header class="head"><div><b id="barProject">Cartes à résoudre</b><small id="barPhase">Phase · —</small></div><button onclick="info()">Règle</button><button onclick="openOv(selected.p,selected.id)">Dézoom</button></header><main class="stage"><div class="swiper pSw"><div class="swiper-wrapper">__PROJECTS__</div></div></main><aside id="inf" class="info"><p>Le bloc principal occupe toute la hauteur disponible : description très grande, dépendances, puis actions suggérées en cases à cocher.</p><p>Tap description : détail sources/analyse. Tap dépendances : lecture pleine hauteur des relations, avec description et cases masquées.</p><p>Données chargées depuis <code>evidence_cards_game_data.json</code>.</p></aside><aside id="ov" class="ov"><div class="oh"><div><h3 id="ovTitle">Projet</h3><p id="ovSub">Dézoom</p></div><button data-close="1">×</button></div><div class="ob"><div id="ovGrid" class="grid"></div></div></aside><div id="to" class="toast"></div></div></template><script>loadData()</script></body></html>
