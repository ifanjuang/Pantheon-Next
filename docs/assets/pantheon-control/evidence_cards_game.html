let pSw,sSw=[],selected={p:0,id:'SOL-001'},timer,down,drag=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function icon(k){const d={warn:'<path d="M12 4l9 16H3zM12 9v5M12 17h.01"/>',crit:'<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/>',ok:'<path d="M20 6L9 17l-5-5"/>'}[k]||'<circle cx="12" cy="12" r="7"/>';return'<span class="ico"><svg viewBox="0 0 24 24">'+d+'</svg></span>'}
function chips(c){return'<div class="chips">'+c.labels.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>'}
function srcs(c){return c.sources.map(s=>'<div class="src"><b>'+esc(s[0])+' · '+esc(s[3])+'</b><span>'+esc(s[1])+' · Date '+esc(s[2])+' · Indice '+esc(s[4])+'</span><span>Force '+esc(s[5])+' · Statut '+esc(s[6])+'</span><code>source candidate</code></div>').join('')}
function relPill(items,cls){return (items||[]).map(x=>'<button class="pill '+cls+'">'+esc(x[0])+'</button>').join('')}
function relDetail(items,cls){return (items||[]).map(x=>'<div class="rel-item '+cls+'"><code>'+esc(x[0])+'</code><div><b>'+esc(x[1])+'</b><span>'+esc(x[2]||'Raison à qualifier.')+'</span></div></div>').join('')}
function rels(c){let r=c.rels||{};return'<section class="rels"><div class="rel-pills">'+relPill(r.dep,'dep')+relPill(r.impact,'impact')+relPill(r.coh,'coh')+relPill(r.warn,'warn')+relPill(r.res,'res')+'</div><div class="rel-detail">'+relDetail(r.dep,'dep')+relDetail(r.impact,'impact')+relDetail(r.coh,'coh')+relDetail(r.warn,'warn')+relDetail(r.res,'res')+'</div></section>'}
function card(c,pi){let p=projects[pi];return'<article class="swiper-slide sSlide"><div class="card '+(c.risk==='Critique'?'crit':'')+'" data-p="'+pi+'" data-id="'+c.id+'"><div class="top"><div class="meta">'+esc(p.name.toUpperCase())+' · '+esc(c.id)+'<span class="moment">Date '+esc(c.date)+' · '+esc(c.moment)+'</span></div><div class="risk">Risque<br><b>'+esc(c.risk)+'</b></div></div><div class="title"><h3>'+esc(c.title)+'</h3>'+icon(c.kind)+'</div>'+chips(c)+'<section class="body"><div class="simple"><section class="sec"><h4>Description</h4><p>'+esc(c.desc)+'</p></section><section class="sec suggestion"><h4>Suggestion Pantheon</h4><p>'+esc(c.suggest)+'</p></section><section class="sec"><h4>Actions</h4><p>'+esc(c.action)+'</p></section></div><div class="detail"><section class="sec"><h4>Sources</h4>'+srcs(c)+'</section><section class="sec"><h4>Analyse</h4><p>'+esc(c.analysis)+'</p></section><section class="sec"><h4>Notes</h4><p>'+esc(c.notes)+'</p></section><section class="sec"><h4>Journal</h4><p>'+esc(c.log)+'</p></section></div></section>'+rels(c)+'<div class="actions"><button data-a="ok">Valider</button><button data-a="no">Refuser</button><button data-a="mod">Modifier</button><button data-a="more">Recherche+</button></div></div></article>'}
function renderProjects(){return projects.map((p,pi)=>'<section class="swiper-slide pSlide"><div class="swiper sSw"><div class="swiper-wrapper">'+p.cards.map(c=>card(c,pi)).join('')+'</div></div></section>').join('')}
function find(id){for(let pi=0;pi<projects.length;pi++){let ci=projects[pi].cards.findIndex(c=>c.id===id);if(ci>=0)return{pi,ci,c:projects[pi].cards[ci]}}}
function setHead(){let p=projects[selected.p];barProject.textContent=p.name;barPhase.textContent='Phase · '+p.phase+' · '+p.cards.length+' cartes'}
function relIds(c){let r=c.rels||{};return [...(r.dep||[]),...(r.impact||[]),...(r.coh||[]),...(r.warn||[]),...(r.res||[])].map(x=>x[0])}
function relClass(c){if(c.id===selected.id)return'sel';let s=projects[selected.p].cards.find(x=>x.id===selected.id);if(!s)return'';let r=s.rels||{};let has=k=>(r[k]||[]).some(x=>x[0]===c.id);if(has('dep'))return'depM';if(has('impact'))return'impM';if(has('coh'))return'cohM';if(has('warn'))return'warnM';if(has('res'))return'resM';return''}
function openOv(pi,id){selected={p:+pi,id};setHead();renderOv();ov.classList.add('open')}
function closeOv(){ov.classList.remove('open')}
function renderOv(){let p=projects[selected.p];ovTitle.textContent=p.name+' · '+p.phase;ovSub.textContent='Cartes liées en premier · '+selected.id;let active=p.cards.find(c=>c.id===selected.id),related=active?relIds(active):[];let sorted=[...p.cards].sort((a,b)=>(a.id===selected.id?-1:b.id===selected.id?1:related.includes(a.id)&&!related.includes(b.id)?-1:!related.includes(a.id)&&related.includes(b.id)?1:0));ovGrid.innerHTML=sorted.map(c=>'<button class="mini '+relClass(c)+'" data-mini="'+c.id+'"><h4>'+esc(c.id)+' · '+esc(c.title)+'</h4>'+chips(c)+'</button>').join('')}
function info(){inf.classList.toggle('open')}function toast(s){to.textContent=s;to.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>to.classList.remove('show'),2100)}
function bind(){document.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};drag=false});document.addEventListener('pointermove',e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>12)drag=true});document.addEventListener('click',e=>{let rel=e.target.closest('.rels');if(rel&&!drag){rel.closest('.card').classList.toggle('rels-on');return}let body=e.target.closest('.body');if(body&&!drag){body.closest('.card').classList.toggle('detail-on');return}let c=e.target.closest('.card');if(c&&!drag&&!e.target.closest('button'))openOv(c.dataset.p,c.dataset.id);if(e.target.dataset.mini){if(e.target.dataset.mini===selected.id){let i=projects[selected.p].cards.findIndex(c=>c.id===selected.id);sSw[selected.p]?.slideTo(i);closeOv()}else{selected.id=e.target.dataset.mini;renderOv();let i=projects[selected.p].cards.findIndex(c=>c.id===selected.id);sSw[selected.p]?.slideTo(i)}}if(e.target.dataset.close)closeOv();if(e.target.dataset.a)toast('Pantheon · intention candidate : '+e.target.dataset.a)});document.addEventListener('pointerdown',e=>{let card=e.target.closest('.card');if(!card)return;let id=card.dataset.id,pi=card.dataset.p;clearTimeout(timer);timer=setTimeout(()=>{openOv(pi,id)},650)});document.addEventListener('pointerup',()=>clearTimeout(timer));document.addEventListener('pointercancel',()=>clearTimeout(timer))}
function init(){sSw=[...document.querySelectorAll('.sSw')].map(s=>new Swiper(s,{direction:'vertical',slidesPerView:1,spaceBetween:8,nested:true,threshold:8,touchAngle:35}));pSw=new Swiper('.pSw',{direction:'horizontal',slidesPerView:1,spaceBetween:8,threshold:8,touchAngle:35,on:{slideChange(){selected.p=this.activeIndex;selected.id=projects[selected.p].cards[0].id;setHead()}}});setHead()}
function render(){mountPage('Cartes à résoudre','',tpl.innerHTML.replace('__PROJECTS__',renderProjects()));bind();init()}
</script><template id="tpl"><div class="app"><header class="head"><div><b id="barProject">Cartes à résoudre</b><small id="barPhase">Phase · —</small></div><button onclick="info()">Règle</button><button onclick="openOv(selected.p,selected.id)">Dézoom</button></header><main class="stage"><div class="swiper pSw"><div class="swiper-wrapper">__PROJECTS__</div></div></main><aside id="inf" class="info"><p>La fiche affiche le problème. Le footer affiche les relations. Le graphe vérifie les effets. La fiche de résolution traite les nœuds complexes. Pantheon formule des suggestions sous forme de question. L’humain tranche.</p><p>Tap corps : détail sources/analyse sans ouvrir les relations. Tap bande colorée : détail des relations en pleine largeur. Appui long : dézoom.</p></aside><aside id="ov" class="ov"><div class="oh"><div><h3 id="ovTitle">Projet</h3><p id="ovSub">Dézoom</p></div><button data-close="1">×</button></div><div class="ob"><div id="ovGrid" class="grid"></div></div></aside><div id="to" class="toast"></div></div></template><script>render()</script></body></html>
