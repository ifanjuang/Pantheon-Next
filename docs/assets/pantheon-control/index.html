<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantheon Control — Accueil</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shell"></div>
<script src="data.js"></script>
<script src="nav.js"></script>
<script>
const enLigne = SERVICES.filter(s=>s.etat[0]==='En ligne').length;
const majDispo = SERVICES.filter(s=>s.maj).length;
const machinesOn = MACHINES.filter(m=>m.etat[0]==='Allumé').length;
const fournisseurs = PROVIDERS.filter(p=>p.etat[0]==='Connecté').length;
const skillsActifs = SKILLS.filter(s=>s.actif).length;
const aValider = EVIDENCE.filter(e=>e.statut[0]!=='Validé').length;

const synthese =
  '<div class="grid">' +
    '<div class="card"><h3>Services</h3><p>'+enLigne+'/'+SERVICES.length+' en ligne</p>'+
      (majDispo?chip(majDispo+' mise(s) à jour','blue'):chip('à jour','green'))+
      '<p><a href="services.html">Ouvrir</a></p></div>' +
    '<div class="card"><h3>Machines</h3><p>'+machinesOn+'/'+MACHINES.length+' allumées</p>'+
      '<p><a href="machines.html">Ouvrir</a></p></div>' +
    '<div class="card"><h3>Modèles & IA</h3><p>'+fournisseurs+' fournisseur(s) connecté(s)</p>'+
      '<p><a href="ia.html">Ouvrir</a></p></div>' +
    '<div class="card"><h3>Skills</h3><p>'+skillsActifs+'/'+SKILLS.length+' actifs</p>'+
      '<p><a href="skills.html">Ouvrir</a></p></div>' +
    '<div class="card"><h3>Preuves</h3><p>'+aValider+' à examiner</p>'+
      '<p><a href="evidence.html">Ouvrir</a></p></div>' +
    '<div class="card"><h3>Fichiers</h3><p>'+FICHIERS.length+' fichiers suivis</p>'+
      '<p><a href="files.html">Ouvrir</a></p></div>' +
  '</div>';

const impacts = IMPACTS.map(i=>
  '<li><b>'+i.declencheur+'</b> '+chip(i.gravite[0],i.gravite[1])+
  '<br><span class="t">touche : '+i.touche+'</span></li>').join('');

const aFaire =
  '<div class="panel"><h3>À traiter en priorité</h3>'+
    '<ul class="queue">'+impacts+'</ul>'+
    '<p class="hint">'+aValider+' preuve(s) en attente d’examen.</p>'+
  '</div>';

mountPage('Accueil', 'Vue d’ensemble et travail du jour.', synthese + aFaire);
</script>
</body>
</html>
