<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantheon Control — Services & outils</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shell"></div>
<script src="data.js"></script>
<script src="nav.js"></script>
<script>
const CATS = ['Toutes'].concat([...new Set(SERVICES.map(s=>s.categorie))]);

function depotLien(d){
  return d.indexOf('github.com')===0
    ? '<a href="https://'+d+'" target="_blank" rel="noopener">'+d+'</a>' : d;
}
function actions(s){
  const b=[];
  if(!s.installe){ b.push('<button class="primary" onclick="demander(this,\'Installation\',\''+s.nom+'\')">Installer</button>'); }
  if(s.installe && s.maj){ b.push('<button class="primary" onclick="demander(this,\'Mise à jour\',\''+s.nom+'\')">Mettre à jour ('+s.version+' → '+s.maj+')</button>'); }
  if(s.installe && !s.systeme){ b.push('<button onclick="demander(this,\'Suppression\',\''+s.nom+'\')">Supprimer</button>'); }
  if(s.systeme){ b.push('<span class="chip muted">service système</span>'); }
  return b.join('');
}
function carte(s){
  return '<div class="card"><h3>'+s.nom+info(s.role)+' '+chip(s.etat[0],s.etat[1])+'</h3>'+
    '<div class="kv"><span>Catégorie</span><b>'+s.categorie+'</b></div>'+
    '<div class="kv"><span>Port</span><b>'+s.port+'</b></div>'+
    '<div class="kv"><span>Version</span><b>'+s.version+(s.maj?' '+chip('MAJ '+s.maj,'blue'):'')+'</b></div>'+
    '<div class="kv"><span>Dépôt</span><b>'+depotLien(s.depot)+'</b></div>'+
    '<div class="kv"><span>Dépendances</span><b>'+s.deps.join(', ')+'</b></div>'+
    '<p style="margin-top:10px">'+actions(s)+'</p></div>';
}
function render(){
  const c=document.getElementById('cat').value;
  document.getElementById('grid').innerHTML=
    SERVICES.filter(s=>c==='Toutes'||s.categorie===c).map(carte).join('');
}
function demander(btn,quoi,nom){
  btn.textContent='Demandé ✓'; btn.disabled=true;
  document.getElementById('out').textContent =
    quoi+' de « '+nom+' » : demandé.\n\n'+document.getElementById('out').textContent;
}

const body =
  '<div class="toolbar"><select id="cat" onchange="render()">'+CATS.map(c=>'<option>'+c+'</option>').join('')+'</select></div>'+
  '<div id="grid" class="grid"></div>'+
  '<div class="panel"><h3>Demandes</h3><pre id="out">Aucune demande.</pre></div>';

mountPage(
  'Services & outils',
  'État, version, mises à jour, dépôt et dépendances. Survolez le « i » pour l’usage de chaque module.',
  body
);
render();
</script>
</body>
</html>
