<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantheon Control — Services installés</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shell"></div>
<script src="data.js"></script>
<script src="nav.js"></script>
<script>
const cards = STACKS.map(s=>
  '<div class="card"><h3>'+s.name+'</h3>'+
    '<p>'+s.kind+' · port '+s.port+'</p>'+
    chip(s.run[0],s.run[1])+' '+chip(s.gov[0],s.gov[1])+
    '<span class="dual">runtime · gouvernance — vérifiés depuis les logs et la liveness</span>'+
  '</div>').join('');

mountPage(
  'Services installés',
  'Stacks, conteneurs et services. Statut runtime et statut gouvernance affichés séparément.',
  'Vérification d’installs depuis leurs logs et leur liveness. Le succès runtime ≠ approbation ; « installé » ≠ « autorisé ».',
  '<div class="grid">'+cards+'</div>'
);
</script>
</body>
</html>
