<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantheon Control — Skills & mémoire</title>
<link rel="stylesheet" href="style.css?v=20260620-mobile-drawer-2">
</head>
<body>
<div id="shell"></div>
<script src="data.js?v=20260620-mobile-drawer-2"></script>
<script src="nav.js?v=20260703-editorial-nav-1"></script>
<script src="ui.js?v=20260621-pages-split-1"></script>
<script>
const skillCards = SKILLS.map(s =>
  '<div class="card"><h3>'+s.nom+' '+(s.actif ? chip('disponible','green') : chip('à admettre','yellow'))+'</h3><p>'+s.usage+'</p><p class="t">Un skill applique une méthode. Il ne valide pas le résultat.</p></div>'
).join('');

const html = `
<div class="panel">
  <h3>Skills : méthodes réutilisables, pas autorité</h3>
  <p>Un skill sert à refaire proprement une tâche : relire un document, extraire des points, comparer des pièces, préparer une note, appliquer une méthode de vérification. Il rend le travail plus régulier. Il ne transforme pas sa sortie en vérité, preuve ou décision.</p>
</div>

<div class="grid three">
  <div class="card"><h3>Admission</h3><p>Un skill doit avoir un périmètre clair : ce qu’il lit, ce qu’il produit, ce qu’il ne doit jamais faire.</p><p class="t">Installé ne veut pas dire admis.</p></div>
  <div class="card"><h3>Sortie</h3><p>La sortie attendue est une proposition : brouillon, comparaison, extraction, preuve candidate ou question à traiter.</p><p class="t">Sortie utile ≠ résultat validé.</p></div>
  <div class="card"><h3>Mémoire</h3><p>Un skill peut retrouver un contexte ou une méthode, mais la mémoire professionnelle reste bornée et validée.</p><p class="t">Mémoire retrouvée ≠ mémoire fiable.</p></div>
</div>

<div class="panel">
  <h3>Skills disponibles</h3>
  <div class="grid three">${skillCards}</div>
</div>

<div class="panel">
  <h3>Règle simple</h3>
  <p>Hermes peut apprendre ou appliquer une méthode. Pantheon décide comment cette méthode est admise, bornée, tracée et relue. L’humain reste responsable de l’usage professionnel.</p>
</div>`;

mountPage('Skills & mémoire', 'Méthodes réutilisables, mémoire de travail et limites de validation.', html);
</script>
</body>
</html>
