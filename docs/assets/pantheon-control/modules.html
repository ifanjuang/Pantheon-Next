<body>
<div id="shell"></div>
<script src="data.js?v=20260620-mobile-drawer-2"></script>

<script src="nav.js?v=20260703-editorial-nav-1"></script>
<script src="ui.js?v=20260621-pages-split-1"></script>
<script>
const html = `
<div class="panel">
  <h3>Lire la pile sans la confondre</h3>
  <p>Les modules ne valent pas par leur nom. Ils valent par leur rôle : rendre visible, préparer, retrouver, observer ou automatiser. Pantheon garde la limite : ce qui sort d’un module reste une proposition tant que la preuve, le périmètre et la validation ne sont pas établis.</p>
</div>

<div class="grid two">
  <div class="card"><h3>1. Surface visible</h3><p>OpenWebUI et le cockpit donnent un lieu lisible pour interroger, comparer, afficher les sources, suivre les cartes et voir les décisions attendues.</p><p class="t">Rôle : exposer. Limite : montrer ne veut pas dire décider.</p></div>
  <div class="card"><h3>2. Préparation & exécution</h3><p>Hermes, LangFlow, LangChain ou LangGraph peuvent préparer une méthode, lire des pièces, produire un brouillon, orchestrer une tâche ou retourner une trace.</p><p class="t">Rôle : préparer ou exécuter sous périmètre. Limite : réussite technique ≠ validation.</p></div>
  <div class="card"><h3>3. Recherche & mémoire</h3><p>RAG, pgvector, mémoire agent ou outils équivalents aident à retrouver des passages, contextes et méthodes déjà utilisés.</p><p class="t">Rôle : retrouver. Limite : retrouver ne veut pas dire prouver ni mémoriser canoniquement.</p></div>
  <div class="card"><h3>4. Observation & automatisation</h3><p>Langfuse, n8n ou une couche de suivi peuvent afficher traces, coûts, erreurs, étapes ou routines répétitives.</p><p class="t">Rôle : observer ou déclencher hors Pantheon. Limite : trace ou routine ne contourne jamais une validation.</p></div>
</div>

<div class="panel">
  <h3>Formule de lecture</h3>
  <p>L’interface rend visible. L’assistant prépare. La recherche retrouve. L’observabilité explique. Pantheon qualifie.</p>
  <p>Une capacité installée n’est pas une capacité approuvée. Une trace n’est pas une preuve. Une mémoire retrouvée n’est pas une mémoire validée. Une automatisation ne remplace pas une décision.</p>
</div>`;
mountPage('Modules et usages', 'Rôle des briques : visible, préparation, mémoire, observation.', html);
</script>
</body>
</html>
