<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantheon Control — Modèles & IA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shell"></div>
<script src="data.js"></script>
<script src="nav.js"></script>
<script>
function carte(p){
  const connecte = p.etat[0]==='Connecté';
  const btns = connecte
    ? '<button onclick="config(this,\''+p.nom+'\')">Configurer</button>'
    : '<button class="primary" onclick="config(this,\''+p.nom+'\')">Connecter</button>'+
      '<button onclick="config(this,\''+p.nom+'\')">Configurer</button>';
  return '<div class="card"><h3>'+p.nom+info(p.usage)+' '+chip(p.etat[0],p.etat[1])+'</h3>'+
    '<p>'+p.usage+'</p>'+
    '<div class="kv"><span>Type</span><b>'+p.type+'</b></div>'+
    '<div class="kv"><span>Modèles</span><b>'+p.modeles+'</b></div>'+
    '<p style="margin-top:10px">'+btns+'</p></div>';
}
function config(btn,nom){
  document.getElementById('out').textContent =
    'Configuration de « '+nom+' » ouverte (clé API, modèles autorisés…).\n\n'+
    document.getElementById('out').textContent;
}

const body =
  '<div class="grid">'+PROVIDERS.map(carte).join('')+'</div>'+
  '<p class="hint">Les modèles locaux et leurs machines sont détaillés sur la page <a href="machines.html">Machines</a>.</p>'+
  '<div class="panel"><h3>Configuration</h3><pre id="out">Aucune configuration ouverte.</pre></div>';

mountPage(
  'Modèles & IA',
  'Ollama en local et les fournisseurs externes. Connectez ou configurez chaque source.',
  body
);
</script>
</body>
</html>
