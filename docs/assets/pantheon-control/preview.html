<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantheon Control — aperçu autonome</title>
<style>
:root{--bg:#090a0d;--panel:#11141a;--card:#0d1016;--line:#202733;--line-2:#29303b;--fg:#f4f2ee;--muted:#9aa2ad;--green:#75e1aa;--yellow:#f2d36b;--red:#ff6d6d;--orange:#f6a15f;--blue:#88bbff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 18px;background:#0b0d12;border-bottom:1px solid var(--line-2)}
.topbar h1{font-size:18px;margin:0}
.topbar .doctrine{margin-left:auto;color:var(--muted);font-size:12px;text-align:right}
.burger{display:none;background:var(--card);border:1px solid var(--line-2);color:var(--fg);border-radius:10px;padding:8px 11px;cursor:pointer;font-size:16px}
.layout{display:flex;min-height:calc(100vh - 53px)}
.drawer{width:230px;flex:0 0 230px;background:#0b0d12;border-right:1px solid var(--line-2);padding:14px 10px}
.drawer a{display:block;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none;margin-bottom:4px;font-size:14px;cursor:pointer}
.drawer a:hover{background:var(--card);color:var(--fg)}
.drawer a.active{background:#151c27;color:var(--fg);border:1px solid var(--line-2)}
.drawer .sep{margin:14px 8px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#5b626d}
.content{flex:1;padding:26px;max-width:1100px}
.content h2{margin:0 0 4px}
.lede{color:var(--muted);margin:0 0 18px}
.rules{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.rules .rule{border:1px solid var(--line-2);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--muted)}
.content h2{display:flex;align-items:center}
.info{display:inline-flex;align-items:center;justify-content:center;margin-left:10px;width:20px;height:20px;font-size:12px;font-weight:700;font-style:italic;border:1px solid var(--line-2);border-radius:50%;color:var(--muted);cursor:help;position:relative}
.info:hover,.info:focus{color:var(--fg);border-color:var(--blue);outline:none}
.info::after{content:attr(data-tip);position:absolute;left:0;top:150%;width:340px;max-width:72vw;background:#0b0d12;border:1px solid #3a2f1c;border-radius:12px;padding:10px 13px;font-size:12.5px;font-weight:400;font-style:normal;line-height:1.45;color:#f0d9a6;box-shadow:0 12px 28px rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .12s;z-index:40}
.info:hover::after,.info:focus::after{opacity:1;visibility:visible}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid.two{grid-template-columns:repeat(2,1fr)}
.panel{border:1px solid var(--line-2);border-radius:20px;background:var(--panel);padding:18px;margin:0 0 18px}
.card{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:15px}
.card h3{margin:0 0 6px;font-size:15px}
.card p{margin:6px 0;color:var(--muted);font-size:13px}
.card .meta{font-size:12px;color:#778}
.chip{display:inline-block;border:1px solid var(--line-2);border-radius:999px;padding:3px 9px;font-size:12px;margin:2px 4px 2px 0;color:var(--muted)}
.chip.green{color:var(--green);border-color:#2c4d3c}.chip.yellow{color:var(--yellow);border-color:#4d452a}.chip.red{color:var(--red);border-color:#4d2c2c}.chip.orange{color:var(--orange);border-color:#4d3a2a}.chip.blue{color:var(--blue);border-color:#2c3a4d}.chip.muted{color:var(--muted)}
.dual{font-size:11px;color:#5b626d;display:block;margin-top:6px}
button,select,input{background:#151922;color:var(--fg);border:1px solid var(--line-2);border-radius:11px;padding:8px 11px;margin:3px 3px 3px 0;font-size:13px;cursor:pointer}
button.primary{background:#1c2a3a;border-color:#2c4256}
input{cursor:text}
.toolbar{margin:0 0 14px}
pre{white-space:pre-wrap;background:#080a0d;border:1px solid var(--line);border-radius:14px;padding:13px;color:#d8dde3;font-size:12.5px}
.queue{list-style:none;padding:0;margin:0}
.queue li{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 13px;margin-bottom:8px;font-size:13px}
.queue li .t{color:var(--muted);font-size:11px}
@media(max-width:900px){.burger{display:block}.drawer{position:fixed;top:53px;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s ease;z-index:30}body.nav-open .drawer{transform:translateX(0)}.grid,.grid.two{grid-template-columns:1fr}.content{padding:18px}.topbar .doctrine{display:none}}
</style>
</head>
<body>
<div class="topbar">
  <button class="burger" onclick="document.body.classList.toggle('nav-open')">☰</button>
  <h1>Pantheon Control</h1>
  <div class="doctrine">OpenWebUI expose · Hermes exécute · Pantheon gouverne · l’humain décide</div>
</div>
<div class="layout">
  <nav class="drawer" id="drawer"></nav>
  <div class="content">
    <div class="rules" id="rules"></div>
    <div id="page"></div>
  </div>
</div>
<script>
/* ====== Aperçu autonome — fidèle à la version multi-pages. Données mock. ====== */
function chip(label,tone){return '<span class="chip '+(tone||'muted')+'">'+label+'</span>';}

const STACKS=[{name:'OpenWebUI',kind:'Surface',port:'3000',run:['Online','green'],gov:['Surface active','green']},{name:'Hermes Agent',kind:'Runtime',port:'8000',run:['Online','green'],gov:['Candidate-only','yellow']},{name:'Ollama',kind:'Model host',port:'11434',run:['Online','green'],gov:['Hôte de modèles','blue']},{name:'SearXNG',kind:'Source',port:'8080',run:['Online','green'],gov:['Source candidate','yellow']},{name:'Qdrant',kind:'Index',port:'6333',run:['Online','green'],gov:['Index seul','blue']},{name:'RAGFlow',kind:'RAG',port:'9380',run:['Offline','red'],gov:['Candidate','yellow']},{name:'n8n',kind:'Workflow',port:'5678',run:['Suspended','red'],gov:['Non autorisé','red']},{name:'DocuSeal',kind:'Adapter',port:'3001',run:['Non installé','muted'],gov:['Gate requis','orange']}];
const BASE=[{name:'PostgreSQL',role:'Registre canonique',status:['Source de vérité','green']},{name:'pgvector',role:'Récupération par similarité',status:['Projection','blue']},{name:'mem0',role:'Mémoire agent (projetée)',status:['Projection','blue']},{name:'Registre Probatoire',role:'Entrées gouvernées',status:['Canon','green']},{name:'Registre de candidats',role:'Avant gate',status:['Candidate','yellow']},{name:'Backend sync',role:'État de synchronisation',status:['1 hors-sync','orange']}];
const MODELS=[{name:'qwen2.5:14b',kind:'chat',use:'rédaction'},{name:'qwen2.5-coder:14b',kind:'code',use:'config'},{name:'nomic-embed-text',kind:'embedding',use:'RAG'},{name:'llava:13b',kind:'vision',use:'image'},{name:'bge-m3',kind:'embedding',use:'multilingue'},{name:'llama-guard',kind:'safety',use:'filtrage'}];
const CONNECTIONS=[{name:'OpenWebUI',type:'Stack',group:'Accès utilisateur',diag:['Opérationnel','green'],gov:['Surface active','green'],note:'Interface principale utilisateur.'},{name:'Notion API',type:'API',group:'Connecteurs',diag:['Config requise','orange'],gov:['Pilotage only','yellow'],note:'Interface technique Notion.'},{name:'Notion MCP Server',type:'MCP Server',group:'Connecteurs',diag:['Disponible','blue'],gov:['Read-only first','yellow'],note:'Expose Notion via MCP.'},{name:'notion.update_page',type:'MCP Tool',group:'Connecteurs',diag:['Dépendance manquante','orange'],gov:['Gate requis','orange'],note:'Action d’écriture Notion.'},{name:'source-audit',type:'Skill Hermes',group:'Recherche',diag:['Disponible','blue'],gov:['Candidate','yellow'],note:'Vérifie autorité, date, version, contradiction.'},{name:'Google Workspace CLI',type:'Standalone Tool',group:'Connecteurs',diag:['Disponible','blue'],gov:['Read-only first','yellow'],note:'Gmail, Drive, Docs, Sheets, Calendar.'},{name:'OpenWebUI source-audit',type:'Plugin OpenWebUI',group:'Accès utilisateur',diag:['Disponible','blue'],gov:['Non autorisé','red'],note:'Bouton UI vers Hermes.'},{name:'RAGFlow',type:'Stack',group:'Documents / RAG',diag:['Disponible','blue'],gov:['Candidate','yellow'],note:'RAG documentaire.'}];
const FILES=[{name:'ABF_avis_bar_ERP.pdf',type:'PDF',scope:'Maison Lierre',parse:['OCR ok','green'],gov:['Source candidate','yellow']},{name:'inventaire_pieces.xlsx',type:'Tableur',scope:'Maison Lierre',parse:['Parsé','green'],gov:['Source candidate','yellow']},{name:'plan_terrasse_v3.dwg',type:'Plan',scope:'Champsaur',parse:['Non parsé','orange'],gov:['Gate requis','orange']},{name:'mail_client_budget.eml',type:'Email',scope:'Champsaur',parse:['Parsé','green'],gov:['Source candidate','yellow']},{name:'compte_rendu_chantier.jpg',type:'Image',scope:'Champsaur',parse:['OCR partiel','orange'],gov:['À revoir','orange']},{name:'devis_pac_piscine.pdf',type:'PDF scanné',scope:'Champsaur',parse:['OCR ok','green'],gov:['Lié à EV','blue']}];
const EVIDENCE=[{id:'EV-142',subject:'RE2020 rénovation bar ERP',status:['Questioned','orange'],risk:['High','red'],why:'Source ABF locale absente.'},{id:'EV-156',subject:'Inventaire pièces Maison Lierre',status:['Candidate','yellow'],risk:['Medium','yellow'],why:'14 pièces reçues, 3 absentes.'},{id:'EV-177',subject:'Notion pilotage only',status:['Promoted','green'],risk:['Medium','yellow'],why:'Notion n’est pas canonique.'}];
const IMPACTS=[{trigger:'Suppression piscine',impacted:'PAC piscine · terrasse · fondations · budget',sev:['Critique','red'],path:'governance_path'},{trigger:'Maj budget client',impacted:'Programme · arbitrage terrasse',sev:['Élevé','orange'],path:'review_path'}];
const CHECKS=['Role boundary','Task Contract required','External effect gate','Runtime success ≠ approval','Source candidate ≠ proof','Scope isolation','Memory promotion blocked','Capability gap visible','Installed ≠ authorized','Latest ≠ stable','Idempotency','Evidence questioned'].map((label,i)=>({id:String(i+1).padStart(2,'0'),label,result:i%5===0?['Warning','orange']:['Pass','green']}));
const AUDIT=[{t:'2026-06-13 08:02',msg:'EV-177 promu → décision enregistrée par le User Decision Gate (réf. GATE-204).'},{t:'2026-06-12 17:44',msg:'Candidat d’édition EV-156 soumis au chokepoint depuis le dashboard.'},{t:'2026-06-12 09:10',msg:'Doctor check « Memory promotion blocked » = Warning.'},{t:'2026-06-11 14:20',msg:'n8n marqué Non autorisé — runtime suspendu, statut gouvernance inchangé.'}];

const PAGES=[['home','Accueil / Liveness','Cockpit'],['evidence','Evidence → Mémoire','Gouvernance'],['files','Files','Gouvernance'],['base','Base & Mémoire','Gouvernance'],['surveillance','Surveillance','Gouvernance'],['infra','Infrastructure','Infrastructure']];
const RULES=['Installed ≠ Authorized','Latest ≠ Stable','Runtime success ≠ Approval','Evidence candidate ≠ Proof'];

let current='home';
function renderNav(){
  const groups={},order=[];
  PAGES.forEach(([id,label,grp])=>{if(!groups[grp]){groups[grp]=[];order.push(grp);}groups[grp].push([id,label]);});
  document.getElementById('drawer').innerHTML=order.map(grp=>'<div class="sep">'+grp+'</div>'+groups[grp].map(([id,label])=>'<a onclick="go(\''+id+'\')" class="'+(id===current?'active':'')+'">'+label+'</a>').join('')).join('');
  document.getElementById('rules').innerHTML=RULES.map(r=>'<span class="rule">'+r+'</span>').join('');
}
function head(title,lede,guard){const info=guard?' <span class="info" tabindex="0" role="note" aria-label="'+guard.replace(/"/g,'&quot;')+'" data-tip="'+guard.replace(/"/g,'&quot;')+'">i</span>':'';let h='<h2>'+title+info+'</h2>';if(lede)h+='<p class="lede">'+lede+'</p>';return h;}
function go(id){current=id;document.body.classList.remove('nav-open');renderNav();PAGE[id]();}

const PAGE={
  home(){
    const launch='<div class="grid">'+
      '<div class="card"><h3>OpenWebUI</h3><p>Surface utilisateur — point d’entrée.</p>'+chip('Online','green')+'<p><button class="primary">Ouvrir OpenWebUI</button></p><p class="meta">Le dashboard ouvre un lien ; il n’exécute rien.</p></div>'+
      '<div class="card"><h3>Hermes Agent</h3><p>Runtime d’exécution.</p>'+chip('Online','green')+' '+chip('Candidate-only','yellow')+'<p class="meta">Produit des candidats sous Task Contract. N’approuve pas.</p></div>'+
      '<div class="card"><h3>Gouvernance</h3><p>Source de vérité Pantheon.</p>'+chip('Active','green')+'<p><button onclick="go(\'evidence\')">Voir Evidence → Mémoire</button></p></div>'+
    '</div>';
    const impacts=IMPACTS.map(i=>'<li><b>'+i.trigger+'</b> '+chip(i.sev[0],i.sev[1])+' '+chip(i.path,'blue')+'<br><span class="t">impacte : '+i.impacted+'</span></li>').join('');
    const cands=EVIDENCE.filter(e=>e.status[0]!=='Promoted').length;
    const work='<div class="panel"><h3>À traiter en priorité</h3><p class="meta">File d’impact (arbitrages en attente)</p><ul class="queue">'+impacts+'</ul><p class="meta">'+cands+' candidat(s) Evidence en attente de revue — <a onclick="go(\'evidence\')" style="cursor:pointer;color:var(--blue)">ouvrir</a></p></div>';
    document.getElementById('page').innerHTML=head('Accueil / Liveness','Vue d’ensemble : surfaces vivantes et file de travail. Lecture seule.','Ce cockpit ne décide rien et n’exécute rien. Il rend l’état visible et prépare des candidats. Le User Decision Gate décide.')+launch+work;
  },
  infra(){
    const types=['Tous','Stack','API','Adapter','MCP Server','MCP Tool','Skill Hermes','Standalone Tool','Plugin OpenWebUI'];
    const stacks=STACKS.map(s=>'<div class="card"><h3>'+s.name+'</h3><p>'+s.kind+' · port '+s.port+'</p>'+chip(s.run[0],s.run[1])+' '+chip(s.gov[0],s.gov[1])+'<span class="dual">runtime · gouvernance — vérifiés depuis les logs et la liveness</span></div>').join('');
    const hermes='<div class="panel"><h3>Hermes Agent</h3><p>Runtime d’exécution. Produit des candidats sous Task Contract.</p>'+chip('Online','green')+' '+chip('Candidate-only','yellow')+'<p class="meta">Ne peut pas approuver, canoniser, promouvoir la mémoire, contourner les approbations ni fusionner.</p></div>';
    const models=MODELS.map(m=>'<div class="card"><h3>'+m.name+'</h3><p>'+m.kind+' · '+m.use+'</p>'+chip('disponible','blue')+'</div>').join('');
    document.getElementById('page').innerHTML=head('Infrastructure','Services installés, modèles & agents, connexions — en une vue.','Vérification d’installs depuis leurs logs et leur liveness. Runtime ≠ approbation ; installé ≠ autorisé. Diagnostic lecture seule : aucune installation n’est déclenchée ici, « Préparer candidat » route une proposition vers le gate.')+'<h3 style="margin:0 0 10px">Services installés</h3><div class="grid">'+stacks+'</div><h3 style="margin:22px 0 10px">IA & Agents</h3>'+hermes+'<div class="grid">'+models+'</div><h3 style="margin:22px 0 10px">Connexions</h3><div class="toolbar"><input id="q" placeholder="filtrer…" oninput="renderConn()"><select id="t" onchange="renderConn()">'+types.map(t=>'<option>'+t+'</option>').join('')+'</select></div><div id="cgrid" class="grid"></div><div class="panel"><h3>Candidats préparés</h3><pre id="cout">Aucun candidat préparé.</pre></div>';
    renderConn();
  },
  files(){
    const scopes=['Tous'].concat([...new Set(FILES.map(f=>f.scope))]);
    document.getElementById('page').innerHTML=head('Files','Matière brute ingérée : PDF, plans, emails, tableurs, images, comptes rendus.','Consultation des fichiers et de leur état d’extraction. Proposer un fichier comme source/evidence prépare un candidat routé vers le gate — jamais une promotion directe. Evidence candidate ≠ Proof.')+'<div class="toolbar"><input id="fq" placeholder="filtrer…" oninput="renderFiles()"><select id="fs" onchange="renderFiles()">'+scopes.map(s=>'<option>'+s+'</option>').join('')+'</select></div><div id="fgrid" class="grid"></div><div class="panel"><h3>Sources proposées</h3><pre id="fout">Aucune source proposée.</pre></div>';
    renderFiles();
  },
  base(){
    const cards=BASE.map(b=>'<div class="card"><h3>'+b.name+'</h3><p>'+b.role+'</p>'+chip(b.status[0],b.status[1])+'</div>').join('');
    const note='<div class="panel"><h3>Topologie</h3><pre>PostgreSQL enregistre le registre gouverné (canon).\npgvector récupère par similarité — ne définit pas la vérité.\nmem0 projette une mémoire utilisable — n’est pas le canon.\nHermes peut consommer/proposer — ne canonise pas.\nPantheon gouverne statut, scope, preuve et approbation.</pre></div>';
    document.getElementById('page').innerHTML=head('Base & Mémoire','Couche registre et données : canon PostgreSQL vs projections (pgvector / mem0).','Le registre canonique reste indépendant de tout backend mémoire. Une projection est explicite, réversible et auditable — jamais source de vérité.')+'<div class="grid">'+cards+'</div>'+note;
  },
  evidence(){
    const actions=[['Proposer promotion','Promoted','governance_path'],['Signaler un doute','Questioned','review_path'],['Proposer déclassement','Demoted','review_path'],['Proposer archivage','Archived','review_path']];
    const items=EVIDENCE.map(e=>'<div class="card"><h3>'+e.id+' · '+e.subject+'</h3><p>'+e.why+'</p>'+chip(e.status[0],e.status[1])+' '+chip(e.risk[0],e.risk[1])+(e.proposal?' '+chip('proposé → '+e.proposal.target,'blue'):'')+'<span class="dual">statut gouverné (lecture seule) · risque'+(e.proposal?' · proposition en attente du gate':'')+'</span><p>'+actions.map(a=>'<button onclick="proposeEv(\''+e.id+'\',\''+a[1]+'\',\''+a[2]+'\')">'+a[0]+'</button>').join('')+'</p></div>').join('');
    const pending=EVIDENCE.filter(e=>e.proposal);
    const gate=pending.length?pending.map(e=>'<li><b>'+e.id+'</b> '+chip(e.proposal.path,'blue')+'<br><span class="t">'+e.status[0]+' → '+e.proposal.target+'</span><p><button onclick="applyGate(\''+e.id+'\')">Appliquer (décision du gate)</button><button onclick="refuseGate(\''+e.id+'\')">Refuser</button></p></li>').join(''):'<li class="t">Aucune proposition. Les actions ci-dessus écrivent une proposition dans le tableau ; elles ne changent pas le statut gouverné.</li>';
    const impacts=IMPACTS.map(i=>'<li><b>'+i.trigger+'</b> '+chip(i.sev[0],i.sev[1])+' '+chip(i.path,'blue')+'<br><span class="t">impacte : '+i.impacted+'</span></li>').join('');
    document.getElementById('page').innerHTML=head('Evidence → Mémoire','Sources, candidats, sujets et file d’impact.','Discussion = signal ; promotion = statut gouverné. Le dashboard écrit une proposition dans le tableau ; seul le User Decision Gate change le statut gouverné. Jamais d’écriture directe du statut par le dashboard.')+'<div class="grid">'+items+'</div><div class="panel"><h3>Gate — autorité externe (simulation)</h3><p class="meta">Cette étape représente le User Decision Gate / chokepoint, hors du dashboard. Seule une décision du gate modifie le statut gouverné dans le tableau.</p><ul class="queue">'+gate+'</ul></div><div class="panel"><h3>File d’impact</h3><ul class="queue">'+impacts+'</ul><p class="meta">Chemins de friction : fast_path (sans promotion) · review_path (revue visible) · governance_path (gate explicite + audit).</p></div>';
  },
  surveillance(){
    const checks=CHECKS.map(c=>'<div class="card"><h3>T'+c.id+' · '+c.label+'</h3>'+chip(c.result[0],c.result[1])+'</div>').join('');
    const audit=AUDIT.map(a=>'<li><span class="t">'+a.t+'</span><br>'+a.msg+'</li>').join('');
    document.getElementById('page').innerHTML=head('Surveillance','Résultats des doctor checks read-only et journal d’audit.','Le dashboard affiche les checks exécutés par le mcp-server ; il n’exécute aucun test lui-même. Le journal d’audit est append-only.')+'<div class="toolbar"><button onclick="stampNow()">Rafraîchir l’affichage</button><span class="meta" id="stamp">Résultats fournis par les doctor checks read-only du mcp-server.</span></div><div class="grid">'+checks+'</div><div class="panel"><h3>Journal d’audit (append-only)</h3><ul class="queue">'+audit+'</ul></div>';
  }
};

function renderConn(){const q=(document.getElementById('q').value||'').toLowerCase(),t=document.getElementById('t').value;document.getElementById('cgrid').innerHTML=CONNECTIONS.filter(c=>(t==='Tous'||c.type===t)&&(c.name+' '+c.type+' '+c.group+' '+c.note).toLowerCase().includes(q)).map(c=>'<div class="card"><h3>'+c.name+'</h3><p>'+c.group+'</p>'+chip(c.type,'muted')+' '+chip(c.diag[0],c.diag[1])+' '+chip(c.gov[0],c.gov[1])+'<span class="dual">type · diagnostic · gouvernance</span><p class="meta">'+c.note+'</p><button onclick="proposeConn(this,\''+c.name.replace(/'/g,'')+'\')">Préparer candidat</button></div>').join('');}
function proposeConn(btn,name){btn.textContent='Candidat préparé ✓';btn.disabled=true;const o=document.getElementById('cout');o.textContent='Candidat préparé pour « '+name+' » → routé vers le chokepoint / User Decision Gate.\nAucune installation, aucun effet runtime déclenché ici.\n\n'+o.textContent;}
function renderFiles(){const q=(document.getElementById('fq').value||'').toLowerCase(),s=document.getElementById('fs').value;document.getElementById('fgrid').innerHTML=FILES.filter(f=>(s==='Tous'||f.scope===s)&&(f.name+' '+f.type+' '+f.scope).toLowerCase().includes(q)).map(f=>'<div class="card"><h3>'+f.name+'</h3><p>'+f.type+' · '+f.scope+'</p>'+chip(f.parse[0],f.parse[1])+' '+chip(f.gov[0],f.gov[1])+'<span class="dual">extraction · gouvernance</span><button onclick="proposeFile(this,\''+f.name.replace(/'/g,'')+'\')">Proposer comme source</button></div>').join('');}
function proposeFile(btn,name){btn.textContent='Candidat préparé ✓';btn.disabled=true;const o=document.getElementById('fout');o.textContent='« '+name+' » proposé comme source candidate → chokepoint / User Decision Gate.\nAucune écriture directe au Registre. La preuve reste candidate jusqu’à revue.\n\n'+o.textContent;}
const GATE_TONE={Promoted:'green',Questioned:'orange',Demoted:'red',Archived:'muted'};
function nowStamp(){return new Date().toISOString().slice(0,16).replace('T',' ');}
// Le dashboard PRÉPARE : il écrit une proposition dans le tableau, sans toucher au statut gouverné.
function proposeEv(id,target,path){const e=EVIDENCE.find(x=>x.id===id);e.proposal={target,path};PAGE.evidence();}
// Le Gate DÉCIDE (autorité externe) : seul lui modifie le statut gouverné dans le tableau.
function applyGate(id){const e=EVIDENCE.find(x=>x.id===id);const old=e.status[0];e.status=[e.proposal.target,GATE_TONE[e.proposal.target]||'yellow'];AUDIT.unshift({t:nowStamp(),msg:e.id+' '+old+' → '+e.proposal.target+' : décision enregistrée par le User Decision Gate.'});e.proposal=null;PAGE.evidence();}
function refuseGate(id){const e=EVIDENCE.find(x=>x.id===id);AUDIT.unshift({t:nowStamp(),msg:'Proposition sur '+e.id+' refusée par le gate ; statut gouverné inchangé ('+e.status[0]+').'});e.proposal=null;PAGE.evidence();}
function stampNow(){document.getElementById('stamp').textContent='Affichage rafraîchi depuis le mcp-server à '+new Date().toLocaleTimeString('fr-FR')+' (lecture seule).';}

renderNav();go('home');
</script>
