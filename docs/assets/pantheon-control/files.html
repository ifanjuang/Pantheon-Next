<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantheon Control — Fichiers</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shell"></div>
<script src="data.js"></script>
<script src="nav.js"></script>
<script>
const PROJETS = ['Tous'].concat([...new Set(FICHIERS.map(f=>f.projet))]);

function render(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const p=document.getElementById('p').value;
  const rows=FICHIERS.filter(f=>
    (p==='Tous'||f.projet===p) &&
    (f.nom+' '+f.type+' '+f.projet).toLowerCase().includes(q));
  document.getElementById('grid').innerHTML=rows.map(f=>
    '<div class="card"><h3>'+f.nom+'</h3>'+
      '<p>'+f.type+' · '+f.projet+'</p>'+
      chip(f.lecture[0],f.lecture[1])+' '+chip(f.statut[0],f.statut[1])+
      '<p style="margin-top:8px"><button onclick="ouvrir(this,\''+f.nom.replace(/'/g,'')+'\')">Utiliser comme source</button></p></div>').join('');
}
function ouvrir(btn,nom){
  btn.textContent='Ajouté ✓'; btn.disabled=true;
  document.getElementById('out').textContent='« '+nom+' » proposé comme source.\n\n'+document.getElementById('out').textContent;
  toast('Source proposée : '+nom,'blue');
}

const body =
  '<div class="toolbar"><input id="q" placeholder="filtrer…" oninput="render()">'+
    '<select id="p" onchange="render()">'+PROJETS.map(p=>'<option>'+p+'</option>').join('')+'</select></div>'+
  '<div id="grid" class="grid"></div>'+
  '<div class="panel"><h3>Sources proposées</h3><pre id="out">Aucune.</pre></div>';

mountPage('Fichiers', 'Les fichiers reçus et leur état de lecture.', body);
render();
</script>
</body>
</html>
