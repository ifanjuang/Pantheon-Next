<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 940" role="img" aria-labelledby="title desc">
  <title id="title">Pantheon Next system map</title>
  <desc id="desc">Hermes clients provide runtime interaction, Hermes Agent executes admitted work, Pantheon Next governs consequential rules and status, the co-located implementation carries candidate services and persistence, Pantheon Cockpit projects governed state, and the human decides when consequence requires it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#858e9c"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8db7ff"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f0b95b"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f5f7fa}
      .eyebrow{font-size:11px;font-weight:800;letter-spacing:.11em;fill:#8db7ff}
      .headline{font-size:21px;font-weight:720;letter-spacing:-.03em}
      .title{font-size:17px;font-weight:700}
      .body{font-size:13px;fill:#c4cad3}
      .note{font-size:11.5px;fill:#858e9c}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;letter-spacing:.09em;fill:#858e9c}
      .node{fill:#101216;stroke:#303641;stroke-width:1.5}
      .surface{fill:#101722;stroke:#8db7ff}
      .direct{fill:#0f1920;stroke:#56c7d6}
      .assisted{fill:#171326;stroke:#ad8cff;stroke-dasharray:7 5}
      .governance{fill:#14233b;stroke:#8db7ff}
      .human{fill:#201a11;stroke:#f0b95b}
      .server{fill:#10231d;stroke:#56d6a0;stroke-width:2}
      .projection{fill:#101722;stroke:#8db7ff}
      .edge{fill:none;stroke:#858e9c;stroke-width:1.6;marker-end:url(#arrow)}
      .edge-blue{stroke:#8db7ff;marker-end:url(#arrow-blue)}
      .edge-amber{stroke:#f0b95b;marker-end:url(#arrow-amber);stroke-dasharray:6 5}
      .rail{fill:none;stroke:#858e9c;stroke-width:1.4}
    </style>
  </defs>

  <rect x="1" y="1" width="398" height="938" rx="20" fill="#0d1015" stroke="#262b33" stroke-width="2"/>
  <text x="24" y="36" class="eyebrow">SYSTEM MAP</text>
  <text x="24" y="66" class="headline">Distinct responsibilities,</text>
  <text x="24" y="92" class="headline">explicit governance.</text>

  <rect x="22" y="112" width="356" height="84" rx="14" class="node surface"/>
  <text x="42" y="138" class="eyebrow">WORKING SURFACES</text>
  <text x="42" y="164" class="title">Hermes clients · Pantheon Cockpit</text>
  <text x="42" y="184" class="body">runtime interaction · governed projection</text>

  <path d="M200 196V216" class="edge"/>

  <rect x="22" y="222" width="356" height="102" rx="14" class="node direct"/>
  <text x="42" y="248" class="eyebrow" style="fill:#56c7d6">DETERMINISTIC POLICY · PANTHEON</text>
  <text x="42" y="276" class="title">Consultation and preflight</text>
  <text x="42" y="296" class="body">returns policy decisions as data</text>
  <text x="42" y="314" class="body">does not perform the consequential effect</text>

  <rect x="22" y="344" width="356" height="102" rx="14" class="node assisted"/>
  <text x="42" y="370" class="eyebrow" style="fill:#c1a9ff">EXTERNAL EXECUTION · HERMES</text>
  <text x="42" y="398" class="title">Hermes executes admitted work</text>
  <text x="42" y="418" class="body">replaceable models · skills · tools</text>
  <text x="42" y="436" class="body">returns observations and candidates</text>

  <path d="M22 273H12V452H200" class="rail"/>
  <path d="M22 395H12" class="rail"/>
  <path d="M200 448V464" class="edge"/>

  <rect x="22" y="470" width="356" height="96" rx="14" class="node governance"/>
  <text x="42" y="496" class="eyebrow">PANTHEON NEXT</text>
  <text x="42" y="522" class="title">governs rules and status</text>
  <text x="42" y="542" class="body">mission · scope · Evidence · approval</text>
  <text x="42" y="560" class="body">authority ≠ execution ≠ persistence</text>

  <path d="M200 566V592" class="edge edge-blue"/>
  <text x="212" y="584" class="mono" style="fill:#8db7ff">CONTRACTS</text>

  <rect x="22" y="598" width="356" height="112" rx="16" class="node server"/>
  <text x="42" y="624" class="eyebrow" style="fill:#56d6a0">IMPLEMENTATION/ · CO-LOCATED CANDIDATE</text>
  <text x="358" y="624" text-anchor="end" class="mono" style="fill:#56d6a0">NOT ADOPTED</text>
  <text x="42" y="652" class="title">candidate services and persistence</text>
  <text x="42" y="672" class="body">API · PostgreSQL · relations · Cockpit</text>
  <text x="42" y="690" class="body">co-location ≠ authority or activation</text>

  <path d="M200 710V736" class="edge edge-amber"/>
  <text x="212" y="728" class="mono" style="fill:#f0b95b">DECISION</text>

  <rect x="22" y="742" width="356" height="96" rx="14" class="node human"/>
  <text x="42" y="768" class="eyebrow" style="fill:#f0b95b">HUMAN · WHEN REQUIRED</text>
  <text x="42" y="794" class="title">decides what carries consequence</text>
  <text x="42" y="814" class="body">approve · refuse · request correction</text>
  <text x="42" y="832" class="body">technical success ≠ approval</text>

  <path d="M200 838V862" class="edge edge-blue"/>
  <rect x="22" y="868" width="356" height="36" rx="10" class="node projection"/>
  <text x="42" y="891" class="body">governed state projected to surfaces</text>
  <text x="358" y="891" text-anchor="end" class="mono">PROJECTED ≠ PERSISTED</text>

  <text x="24" y="926" class="mono">RUNTIME_SUCCESS ≠ EVIDENCE · CO-LOCATION ≠ AUTHORITY</text>
</svg>
