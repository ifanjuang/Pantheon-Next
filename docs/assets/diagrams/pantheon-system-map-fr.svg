<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 940" role="img" aria-labelledby="title desc">
  <title id="title">Carte du système Pantheon Next</title>
  <desc id="desc">Les surfaces de travail accèdent au serveur par un chemin direct ou un chemin assisté par Hermes. Pantheon Next définit les règles, le serveur applique et persiste, l’humain décide lorsque la conséquence l’exige, et les projections calculées reviennent aux surfaces.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#858e9c"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8db7ff"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f0b95b"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f5f7fa}
      .eyebrow{font-size:11px;font-weight:800;letter-spacing:.11em;fill:#8db7ff}
      .headline{font-size:21px;font-weight:720;letter-spacing:-.03em}
      .title{font-size:17px;font-weight:700}
      .body{font-size:13px;fill:#c4cad3}
      .note{font-size:11.5px;fill:#858e9c}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;letter-spacing:.09em;fill:#858e9c}
      .node{fill:#101216;stroke:#303641;stroke-width:1.5}
      .surface{fill:#101722;stroke:#8db7ff}
      .direct{fill:#0f1920;stroke:#56c7d6}
      .assisted{fill:#171326;stroke:#ad8cff;stroke-dasharray:7 5}
      .governance{fill:#14233b;stroke:#8db7ff}
      .human{fill:#201a11;stroke:#f0b95b}
      .server{fill:#10231d;stroke:#56d6a0;stroke-width:2}
      .projection{fill:#101722;stroke:#8db7ff}
      .edge{fill:none;stroke:#858e9c;stroke-width:1.6;marker-end:url(#arrow)}
      .edge-blue{stroke:#8db7ff;marker-end:url(#arrow-blue)}
      .edge-amber{stroke:#f0b95b;marker-end:url(#arrow-amber);stroke-dasharray:6 5}
      .rail{fill:none;stroke:#858e9c;stroke-width:1.4}
    </style>
  </defs>

  <rect x="1" y="1" width="398" height="938" rx="20" fill="#0d1015" stroke="#262b33" stroke-width="2"/>
  <text x="24" y="36" class="eyebrow">CARTE DU SYSTÈME</text>
  <text x="24" y="66" class="headline">Plusieurs portes d’entrée,</text>
  <text x="24" y="92" class="headline">une seule autorité métier.</text>

  <rect x="22" y="112" width="356" height="84" rx="14" class="node surface"/>
  <text x="42" y="138" class="eyebrow">SURFACES DE TRAVAIL</text>
  <text x="42" y="164" class="title">Cockpit · OpenWebUI</text>
  <text x="42" y="184" class="body">voir · dialoguer · contrôler · décider</text>

  <path d="M200 196V216" class="edge"/>

  <rect x="22" y="222" width="356" height="102" rx="14" class="node direct"/>
  <text x="42" y="248" class="eyebrow" style="fill:#56c7d6">CHEMIN DIRECT · HERMES NON REQUIS</text>
  <text x="42" y="276" class="title">API et actions déterministes</text>
  <text x="42" y="296" class="body">consulter une projection, déposer une pièce</text>
  <text x="42" y="314" class="body">appliquer une mutation déjà structurée</text>

  <rect x="22" y="344" width="356" height="102" rx="14" class="node assisted"/>
  <text x="42" y="370" class="eyebrow" style="fill:#c1a9ff">CHEMIN ASSISTÉ · EXTERNE ET OPTIONNEL</text>
  <text x="42" y="398" class="title">Hermes comprend et propose</text>
  <text x="42" y="418" class="body">outils remplaçables · mémoire externe</text>
  <text x="42" y="436" class="body">produit observations et candidats</text>

  <path d="M22 273H12V452H200" class="rail"/>
  <path d="M22 395H12" class="rail"/>
  <path d="M200 448V464" class="edge"/>

  <rect x="22" y="470" width="356" height="96" rx="14" class="node governance"/>
  <text x="42" y="496" class="eyebrow">PANTHEON NEXT</text>
  <text x="42" y="522" class="title">définit les règles</text>
  <text x="42" y="542" class="body">objets · schémas · statuts · portées</text>
  <text x="42" y="560" class="body">preuves · approbations · capacités</text>

  <path d="M200 566V592" class="edge edge-blue"/>
  <text x="212" y="584" class="mono" style="fill:#8db7ff">RÈGLES</text>

  <rect x="22" y="598" width="356" height="112" rx="16" class="node server"/>
  <text x="42" y="624" class="eyebrow" style="fill:#56d6a0">PANTHEON-MVP · CANDIDAT</text>
  <text x="42" y="652" class="title">le serveur applique et persiste</text>
  <text x="42" y="672" class="body">admission · API · base · relations · stockage</text>
  <text x="42" y="690" class="body">originaux, états et provenance restent distincts</text>
  <text x="358" y="624" text-anchor="end" class="mono" style="fill:#56d6a0">RESTE AUTORITAIRE</text>

  <path d="M200 710V736" class="edge edge-amber"/>
  <text x="212" y="728" class="mono" style="fill:#f0b95b">DÉCISION</text>

  <rect x="22" y="742" width="356" height="96" rx="14" class="node human"/>
  <text x="42" y="768" class="eyebrow" style="fill:#f0b95b">HUMAIN · SI NÉCESSAIRE</text>
  <text x="42" y="794" class="title">décide ce qui engage</text>
  <text x="42" y="814" class="body">valider · refuser · demander correction</text>
  <text x="42" y="832" class="body">succès technique ≠ approbation</text>

  <path d="M200 838V862" class="edge edge-blue"/>
  <rect x="22" y="868" width="356" height="36" rx="10" class="node projection"/>
  <text x="42" y="891" class="body">projections calculées</text>
  <text x="358" y="891" text-anchor="end" class="mono">PROJECTED ≠ PERSISTED</text>

  <text x="24" y="926" class="mono">DIRECT ≠ ASSISTÉ · RUNTIME_SUCCESS ≠ EVIDENCE</text>
</svg>
