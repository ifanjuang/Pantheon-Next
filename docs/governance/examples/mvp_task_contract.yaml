# MVP governed task loop — step 2: Task Contract candidate (illustrative, non-normative).
# Fictional scenario: recovery quote, dangerous client validation (architecture_devis_reprise).
# This file validates nothing and authorizes nothing; the gate decides.

contract_id: mvp.devis-reprise.tc-001
status: candidate
created_at: "2026-07-07T10:00:00Z"
requested_by: practitioner
exposure_surface: openwebui

request_summary: >
  Draft a reply to the client email about the recovery quote for lot 06.
  The reply must not validate, accept or approve any scope by itself.

declared_scope:
  sources:
    - fictional-doc://client-email-2026-07-05
    - fictional-doc://quote-Q-2026-041
    - fictional-doc://cctp-excerpt-lot06
  operations:
    - read_selected_sources
    - retrieve_scoped_passages   # pgvector, inside this perimeter only
    - draft_reply_candidate
    - prepare_evidence_pack_candidate

forbidden_scope:
  - external_send
  - commitment_language_without_flag
  - source_outside_declared_perimeter
  - register_write
  - approval_of_any_kind

expected_output:
  type: result_candidate
  status_on_return: draft_to_review
  evidence_pack_required: true

consequence_class: K3        # reply could commit the practitioner externally (K = consequence axis)
approval_ceiling: C3         # human authorization required (C = approval axis)
retrieval:
  store: pgvector
  boundary: retrieval_only   # indexed is not evidence; retrieved is not truth

governance_refs:
  - docs/governance/MVP_GOVERNED_TASK_LOOP.md
  - docs/governance/TASK_CONTRACTS.md
  - docs/governance/USER_DECISION_GATE.md
