name: Temporary canonical contract stage A

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  route-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/contracts-direct-consumption
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Route Task Contract and decision vocabulary to canonical schemas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          impl = root / "implementation"

          def replace_region(path: Path, start_marker: str, end_marker: str, replacement: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"{label}: start marker missing")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"{label}: end marker missing")
              path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          contract = impl / "mvp_vertical/contract.py"
          text = contract.read_text(encoding="utf-8")
          if "from . import pantheon_contracts" not in text:
              if "import yaml\n" not in text:
                  raise SystemExit("contract.py: yaml import anchor missing")
              text = text.replace("import yaml\n", "import yaml\n\nfrom . import pantheon_contracts\n", 1)
              contract.write_text(text, encoding="utf-8")

          replace_region(
              contract,
              "# The vendored governance schema is the authority for a contract's shape",
              "\n\nclass ContractError",
              '''# Pantheon Next's canonical governed-loop schema owns the contract shape.\n# A monorepo checkout resolves it directly from root schemas/. A built wheel\n# resolves the exact generated build-artifact copy. Neither path transfers\n# governance authority to the implementation.\nSCHEMA_PATH = pantheon_contracts.schema_path("mvp_governed_loop_objects")\n''',
              "contract.py schema owner",
          )
          text = contract.read_text(encoding="utf-8")
          old = '''@functools.lru_cache(maxsize=1)\ndef _schema() -> dict:\n    return yaml.safe_load(SCHEMA_PATH.read_text(encoding="utf-8"))\n'''
          new = '''@functools.lru_cache(maxsize=1)\ndef _schema() -> dict:\n    return pantheon_contracts.load_schema("mvp_governed_loop_objects")\n'''
          if old not in text:
              raise SystemExit("contract.py: _schema block missing")
          text = text.replace(old, new, 1)
          text = text.replace("vendored schema", "canonical schema")
          text = text.replace("vendored governance schema", "canonical governance schema")
          contract.write_text(text, encoding="utf-8")

          gate = impl / "mvp_vertical/terminal_gate_standin.py"
          text = gate.read_text(encoding="utf-8")
          if "from . import pantheon_contracts" not in text:
              anchor = "from .contract import _schema\n"
              if anchor not in text:
                  raise SystemExit("terminal gate: contract import anchor missing")
              text = text.replace(anchor, "from . import pantheon_contracts\n" + anchor, 1)
              gate.write_text(text, encoding="utf-8")
          replace_region(
              gate,
              "# The closed decision vocabulary is governed by Pantheon",
              "\n\nclass GateRefusal",
              '''# The closed decision vocabulary is governed by Pantheon and read directly\n# from the canonical governed-loop schema. Candidate possible_decisions remain\n# advisory display data only; retrieval does not create authority.\n@functools.lru_cache(maxsize=1)\ndef allowed_decisions() -> frozenset:\n    return frozenset(\n        pantheon_contracts.definition_enum(\n            "mvp_governed_loop_objects", "decision_value"\n        )\n    )\n''',
              "terminal gate vocabulary",
          )
          text = gate.read_text(encoding="utf-8")
          text = text.replace("vendored schema", "canonical schema")
          gate.write_text(text, encoding="utf-8")
          PY
      - name: Install implementation
        run: python -m pip install --disable-pip-version-check -e "implementation[test]"
      - name: Prove canonical runtime routing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from mvp_vertical import pantheon_contracts, vendor_contracts
          from mvp_vertical.contract import SCHEMA_PATH, _schema
          from mvp_vertical.terminal_gate_standin import allowed_decisions

          root = Path.cwd().resolve()
          canonical = (root / "schemas/mvp_governed_loop_objects.schema.yaml").resolve()
          assert SCHEMA_PATH.resolve() == canonical
          assert pantheon_contracts.schema_path("mvp_governed_loop_objects").resolve() == canonical
          assert vendor_contracts.schema_path("mvp_governed_loop_objects").resolve() == canonical
          assert _schema()["title"] == pantheon_contracts.load_schema("mvp_governed_loop_objects")["title"]
          assert allowed_decisions() == frozenset(
              pantheon_contracts.definition_enum("mvp_governed_loop_objects", "decision_value")
          )
          source = pantheon_contracts.provenance("project_claim")
          assert source["posture"] == "canonical-repository", source
          assert source["authority_transfer"] is False
          PY
          cd implementation
          pytest -q tests/test_decision_record.py tests/test_block1.py tests/test_runner_output_validation.py
      - name: Commit verified stage A and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-contract-stage-a.yml
          git add implementation/mvp_vertical/contract.py implementation/mvp_vertical/terminal_gate_standin.py
          git diff --cached --check
          git commit -m "refactor(contracts): route runtime through canonical schemas"
          git push origin HEAD:refactor/contracts-direct-consumption
