name: Obsolete Authority Consistency

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  obsolete-authority:
    name: Obsolete document authority consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/architecture-audit-zones
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify retired document classifications before convergence
        shell: bash
        env:
          GOVERNANCE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check_obsolete_authority_consistency.py

      - name: Execute bounded self-removing convergence helper
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install PyYAML pytest jsonschema
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          helper = Path('.github/workflows/_architecture-zone-convergence.yml')
          workflow = yaml.safe_load(helper.read_text(encoding='utf-8'))
          steps = workflow['jobs']['converge']['steps']
          wanted = {
              'Convert architecture tooling from repositories to zones',
              'Validate transformed tools and invariants',
          }
          for step in steps:
              if step.get('name') not in wanted:
                  continue
              subprocess.run(
                  ['bash', '--noprofile', '--norc', '-e', '-o', 'pipefail', '-c', step['run']],
                  check=True,
              )
          PY

      - name: Restore read-only guard and publish converged tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/obsolete-authority-ci.yml
          rm .github/workflows/_architecture-zone-convergence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ci): audit monorepo zones explicitly"
          git push origin HEAD:refactor/architecture-audit-zones
