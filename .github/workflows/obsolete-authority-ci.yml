name: Obsolete Authority Consistency

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  obsolete-authority:
    name: Obsolete document authority consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify retired document classifications
        shell: bash
        env:
          GOVERNANCE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check_obsolete_authority_consistency.py

  converge-contract-consumers:
    name: Converge legacy contract consumers
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 691
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/contracts-direct-consumption
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded implementation test dependencies
        working-directory: implementation
        run: python -m pip install -e ".[test]"
      - name: Converge all remaining direct vendor-path consumers
        run: |
          set -euo pipefail
          if [ ! -f implementation/tools/tmp_converge_contract_consumers.py ]; then
            echo "Convergence helper already consumed."
            exit 0
          fi
          sed -i '/replace_all(path, "vendored Pantheon Next governance schema"/d' implementation/tools/tmp_converge_contract_consumers.py
          python implementation/tools/tmp_converge_contract_consumers.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add implementation/mvp_vertical implementation/tests implementation/tools/tmp_converge_contract_consumers.py
          if git diff --cached --quiet; then
            echo "No contract consumer changes remain."
            exit 0
          fi
          git commit -m "refactor(contracts): route runtime consumers through canonical registry"
          git push origin HEAD:refactor/contracts-direct-consumption
