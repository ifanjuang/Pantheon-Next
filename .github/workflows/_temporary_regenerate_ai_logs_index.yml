name: Temporary AI logs index regeneration

on:
  push:
    branches:
      - docs/post-440-cockpit-reconciliation-final
    paths:
      - .github/workflows/_temporary_regenerate_ai_logs_index.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/post-440-cockpit-reconciliation-final
          fetch-depth: 0
      - name: Regenerate index
        run: python3 .github/scripts/generate_ai_logs_index.py
      - name: Commit generated index
        run: |
          if git diff --quiet -- ai_logs/INDEX.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_logs/INDEX.md
          git commit -m "docs: regenerate ai logs index from sources"
          git push origin HEAD:docs/post-440-cockpit-reconciliation-final
