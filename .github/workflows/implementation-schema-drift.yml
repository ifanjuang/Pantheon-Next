name: Implementation schema drift monitor

# Transitional report-only monitor. It stays active until the implementation
# consumes canonical root schemas directly and committed vendoring is removed.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install PyYAML
      - name: Check vendored schema against upstream
        run: python tools/check_schema_drift.py
