name: Generate G0 AI log index

on:
  push:
    branches:
      - feature/g-project-change-variant-contract
    paths:
      - ai_logs/2026/Q3/2026-08-07-project-change-variant-contract.md

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generate canonical index
        run: python3 .github/scripts/generate_ai_logs_index.py
      - name: Commit generated index
        run: |
          if git diff --quiet -- ai_logs/INDEX.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_logs/INDEX.md
          git commit -m "docs(ai-log): regenerate index for G0"
          git push
