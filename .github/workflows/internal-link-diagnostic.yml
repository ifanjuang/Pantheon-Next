name: Internal Link Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          show-progress: false
      - name: Capture internal-link findings
        shell: bash
        env:
          GOVERNANCE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          python3 .github/scripts/check_internal_links.py --list > /tmp/internal-links.log 2>&1
          status=$?
          cat /tmp/internal-links.log
          echo "$status" > /tmp/internal-links-status.txt
          exit 0
      - name: Upload findings
        uses: actions/upload-artifact@v4
        with:
          name: internal-link-diagnostic
          path: |
            /tmp/internal-links.log
            /tmp/internal-links-status.txt
          if-no-files-found: error
          retention-days: 1
