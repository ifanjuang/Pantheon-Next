name: LiveSync Real Obsidian S2

on:
  pull_request:
    paths:
      - ".github/workflows/implementation-livesync-real-obsidian-s2.yml"
      - "tests/test_livesync_real_obsidian_s2_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: pytest -q tests/test_livesync_real_obsidian_s2_contract.py

  real-obsidian-two-vault:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LIVESYNC_COMMIT: 32e827692f1a552cd581de9da45cecd0711573d3
      LIVESYNC_VERSION: 1.0.18
      OBSIDIAN_VERSION: 1.13.7
      E2E_OBSIDIAN_INCLUDE_MARKDOWN_CONFLICT: "true"
      E2E_OBSIDIAN_INCLUDE_CONFLICT_OPERATIONS: "true"
    steps:
      - name: Checkout exact Self-hosted LiveSync release commit
        uses: actions/checkout@v4
        with:
          repository: vrtmrz/obsidian-livesync
          ref: ${{ env.LIVESYNC_COMMIT }}
          path: obsidian-livesync
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: obsidian-livesync/package-lock.json

      - name: Verify exact upstream identity and install dependencies
        working-directory: obsidian-livesync
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$LIVESYNC_COMMIT"
          node -e "const p=require('./package.json'); if(p.version!==process.env.LIVESYNC_VERSION) process.exit(1)"
          npm ci

      - name: Install current official Obsidian AppImage fixture
        working-directory: obsidian-livesync
        shell: bash
        run: |
          mkdir -p _testdata/obsidian/current
          curl --fail --location --retry 3 \
            "https://github.com/obsidianmd/obsidian-releases/releases/download/v${OBSIDIAN_VERSION}/Obsidian-${OBSIDIAN_VERSION}.AppImage" \
            --output _testdata/obsidian/current/Obsidian.AppImage
          chmod +x _testdata/obsidian/current/Obsidian.AppImage
          cd _testdata/obsidian/current
          ./Obsidian.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/obsidian
          echo "OBSIDIAN_BINARY=${GITHUB_WORKSPACE}/obsidian-livesync/_testdata/obsidian/current/squashfs-root/obsidian" >> "$GITHUB_ENV"

      - name: Start upstream CouchDB test fixture
        working-directory: obsidian-livesync
        run: npm run test:docker-couchdb:start

      - name: Run upstream maintained real-Obsidian two-vault scenario
        working-directory: obsidian-livesync
        shell: bash
        run: xvfb-run -a npm run test:e2e:obsidian:focused -- two-vault-sync

      - name: Capture bounded acceptance summary
        if: success()
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/livesync-real-obsidian-s2"
          cat > "${RUNNER_TEMP}/livesync-real-obsidian-s2/acceptance-summary.json" <<EOF
          {
            "kind": "livesync_real_obsidian_s2_acceptance",
            "status": "passed",
            "livesync_commit": "${LIVESYNC_COMMIT}",
            "livesync_version": "${LIVESYNC_VERSION}",
            "obsidian_version": "${OBSIDIAN_VERSION}",
            "scenario": "two-vault-sync",
            "real_obsidian": true,
            "markdown_conflict_check": true,
            "conflict_operations_check": true,
            "nas_deployment_tested": false,
            "hindsight_ingestion_activated": false,
            "pantheon_state_mutated": false,
            "evidence_admitted": false
          }
          EOF

      - name: Stop upstream CouchDB fixture
        if: always()
        working-directory: obsidian-livesync
        run: npm run test:docker-couchdb:stop || true

      - name: Upload bounded acceptance summary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: livesync-real-obsidian-s2-${{ github.run_id }}
          path: ${{ runner.temp }}/livesync-real-obsidian-s2/acceptance-summary.json
          if-no-files-found: error
          retention-days: 14
