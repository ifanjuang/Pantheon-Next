name: Temporary regenerate ai log index 824

on:
  push:
    branches:
      - codex/824-prune-absorbed-research-distillations

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/824-prune-absorbed-research-distillations
          fetch-depth: 0
      - name: Regenerate and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/generate_ai_logs_index.py
          git rm .github/workflows/tmp-regenerate-ai-log-index-824.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_logs/INDEX.md
          git commit -m "chore(ai-logs): regenerate index"
          git push origin HEAD:codex/824-prune-absorbed-research-distillations
