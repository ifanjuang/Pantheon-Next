name: Hermes LiveSync Reverse Q3

on:
  pull_request:
    paths:
      - ".github/workflows/hermes-livesync-reverse-q3.yml"
      - "implementation/qualification/external-pins.json"
      - "implementation/tools/export_external_qualification_pins.py"
      - "implementation/tools/run_hermes_livesync_reverse_q3.sh"
      - "tests/test_hermes_livesync_reverse_q3_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./implementation[test]"
      - run: PYTHONPATH=implementation pytest -q tests/test_hermes_livesync_reverse_q3_contract.py implementation/tests/test_external_qualification_pins.py

  reverse-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout current Pantheon candidate
        uses: actions/checkout@v4
        with:
          path: monorepo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve current external qualification pins
        shell: bash
        run: |
          python monorepo/implementation/tools/export_external_qualification_pins.py \
            hermes-agent self-hosted-livesync self-hosted-livesync-cli couchdb \
            --github-env "$GITHUB_ENV"

      - name: Checkout qualified Hermes revision
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HERMES_REPOSITORY }}
          ref: ${{ env.HERMES_REF }}
          path: hermes-agent
          fetch-depth: 1

      - name: Checkout qualified Self-hosted LiveSync revision
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LIVESYNC_REPOSITORY }}
          ref: ${{ env.LIVESYNC_REF }}
          path: obsidian-livesync
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: obsidian-livesync/package-lock.json

      - name: Verify resolved upstream identities
        shell: bash
        run: |
          test "$(git -C hermes-agent rev-parse HEAD)" = "$HERMES_REF"
          test -f hermes-agent/skills/note-taking/obsidian/SKILL.md
          git -C hermes-agent hash-object skills/note-taking/obsidian/SKILL.md \
            > "${RUNNER_TEMP}/hermes-obsidian-skill-blob.txt"
          test "$(git -C obsidian-livesync rev-parse HEAD)" = "$LIVESYNC_REF"
          node -e "const p=require('./obsidian-livesync/src/apps/cli/package.json'); if(p.version!==process.env.LIVESYNC_CLI_VERSION) process.exit(1)"

      - name: Install Hermes runtime
        working-directory: hermes-agent
        run: python -m pip install -e .

      - name: Build qualified LiveSync CLI
        working-directory: obsidian-livesync
        run: |
          npm ci
          npm run check -w self-hosted-livesync-cli
          npm run test:unit -w self-hosted-livesync-cli
          npm run build -w self-hosted-livesync-cli
          test -f src/apps/cli/dist/index.cjs

      - name: Execute Hermes filesystem to CouchDB to separate-client qualification
        working-directory: monorepo/implementation
        env:
          HERMES_ROOT: ${{ github.workspace }}/hermes-agent
          LIVESYNC_ROOT: ${{ github.workspace }}/obsidian-livesync
        run: bash tools/run_hermes_livesync_reverse_q3.sh

      - name: Stop bounded test service
        if: always()
        run: docker stop pantheon-hermes-livesync-q3-couchdb || true

      - name: Upload bounded observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hermes-livesync-reverse-q3-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hermes-livesync-reverse-q3/artifacts/
            ${{ runner.temp }}/hermes-obsidian-skill-blob.txt
          if-no-files-found: error
          retention-days: 14
