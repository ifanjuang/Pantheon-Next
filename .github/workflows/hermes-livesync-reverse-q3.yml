name: Hermes LiveSync Reverse Q3

on:
  pull_request:
    paths:
      - ".github/workflows/hermes-livesync-reverse-q3.yml"
      - "implementation/tools/run_hermes_livesync_reverse_q3.sh"
      - "tests/test_hermes_livesync_reverse_q3_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: pytest -q tests/test_hermes_livesync_reverse_q3_contract.py

  reverse-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HERMES_COMMIT: 4c1f53be10d0fce1d25aee1975e5149b6c54f25a
      HERMES_OBSIDIAN_SKILL_BLOB: cc8f3cf737a78fc68e73e5770ef0158815cb4028
      LIVESYNC_COMMIT: 32e827692f1a552cd581de9da45cecd0711573d3
      LIVESYNC_CLI_VERSION: 1.0.18-cli
    steps:
      - name: Checkout current Pantheon candidate
        uses: actions/checkout@v4
        with:
          path: monorepo

      - name: Checkout exact Hermes revision
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_COMMIT }}
          path: hermes-agent
          fetch-depth: 1

      - name: Checkout qualified Self-hosted LiveSync revision
        uses: actions/checkout@v4
        with:
          repository: vrtmrz/obsidian-livesync
          ref: ${{ env.LIVESYNC_COMMIT }}
          path: obsidian-livesync
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: obsidian-livesync/package-lock.json

      - name: Verify exact upstream identities
        shell: bash
        run: |
          test "$(git -C hermes-agent rev-parse HEAD)" = "$HERMES_COMMIT"
          test "$(git -C hermes-agent hash-object skills/note-taking/obsidian/SKILL.md)" = "$HERMES_OBSIDIAN_SKILL_BLOB"
          test "$(git -C obsidian-livesync rev-parse HEAD)" = "$LIVESYNC_COMMIT"
          node -e "const p=require('./obsidian-livesync/src/apps/cli/package.json'); if(p.version!==process.env.LIVESYNC_CLI_VERSION) process.exit(1)"

      - name: Install Hermes runtime
        working-directory: hermes-agent
        run: python -m pip install -e .

      - name: Build qualified LiveSync CLI
        working-directory: obsidian-livesync
        run: |
          npm ci
          npm run check -w self-hosted-livesync-cli
          npm run test:unit -w self-hosted-livesync-cli
          npm run build -w self-hosted-livesync-cli
          test -f src/apps/cli/dist/index.cjs

      - name: Execute Hermes filesystem to CouchDB to separate-client qualification
        working-directory: monorepo/implementation
        env:
          HERMES_ROOT: ${{ github.workspace }}/hermes-agent
          LIVESYNC_ROOT: ${{ github.workspace }}/obsidian-livesync
        run: bash tools/run_hermes_livesync_reverse_q3.sh

      - name: Stop bounded test service
        if: always()
        run: docker stop pantheon-hermes-livesync-q3-couchdb || true

      - name: Upload bounded observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-livesync-reverse-q3-${{ github.run_id }}
          path: ${{ runner.temp }}/hermes-livesync-reverse-q3/artifacts/
          if-no-files-found: error
          retention-days: 14
