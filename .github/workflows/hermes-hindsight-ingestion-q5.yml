name: Hermes Hindsight Ingestion Q5

on:
  pull_request:
    paths:
      - ".github/workflows/hermes-hindsight-ingestion-q5.yml"
      - "implementation/tools/run_hermes_hindsight_ingestion_q5.sh"
      - "tests/test_hermes_hindsight_ingestion_q5_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: pytest -q tests/test_hermes_hindsight_ingestion_q5_contract.py

  ingestion-separation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HERMES_COMMIT: 4c1f53be10d0fce1d25aee1975e5149b6c54f25a
      HERMES_OBSIDIAN_SKILL_BLOB: cc8f3cf737a78fc68e73e5770ef0158815cb4028
      OBSIDIAN_SYNC_COMMIT: daf529aacad14a5b8f7db9f34a7f49c9e3629b61
      HINDSIGHT_VERSION: "0.9.1"
      HINDSIGHT_API_URL: http://127.0.0.1:8888
      HINDSIGHT_BANK_ID: pantheon-hermes-q5-synthetic
    steps:
      - name: Checkout current Pantheon candidate
        uses: actions/checkout@v4
        with:
          path: monorepo

      - name: Checkout exact Hermes revision
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_COMMIT }}
          path: hermes-agent
          fetch-depth: 1

      - name: Checkout current qualified Hindsight Obsidian integration
        uses: actions/checkout@v4
        with:
          repository: vectorize-io/hindsight-obsidian
          ref: ${{ env.OBSIDIAN_SYNC_COMMIT }}
          path: hindsight-obsidian
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hindsight-obsidian/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact upstream identities
        shell: bash
        run: |
          test "$(git -C hermes-agent rev-parse HEAD)" = "$HERMES_COMMIT"
          test "$(git -C hermes-agent hash-object skills/note-taking/obsidian/SKILL.md)" = "$HERMES_OBSIDIAN_SKILL_BLOB"
          test "$(git -C hindsight-obsidian rev-parse HEAD)" = "$OBSIDIAN_SYNC_COMMIT"
          node -e "const p=require('./hindsight-obsidian/package.json'); if(p.version!=='0.2.1'||p.bin['hindsight-obsidian-sync']!=='dist/cli.js') process.exit(1)"

      - name: Install Hermes runtime
        working-directory: hermes-agent
        run: python -m pip install -e .

      - name: Build and test qualified Hindsight Obsidian producer
        working-directory: hindsight-obsidian
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          test -f dist/cli.js

      - name: Start ephemeral Hindsight 0.9.1
        shell: bash
        run: |
          docker pull "ghcr.io/vectorize-io/hindsight:${HINDSIGHT_VERSION}"
          docker run -d --rm \
            --name pantheon-hermes-q5-hindsight \
            -p 8888:8888 \
            -e HINDSIGHT_API_WORKER_ID=pantheon-hermes-q5-hindsight \
            -e HINDSIGHT_API_RETAIN_EXTRACTION_MODE=chunks \
            -e HINDSIGHT_API_ENABLE_AUTO_CONSOLIDATION=false \
            -e HINDSIGHT_API_ENABLE_OBSERVATIONS=false \
            -e HINDSIGHT_API_LLM_PROVIDER=openai \
            -e HINDSIGHT_API_LLM_API_KEY=unused-q5-lab-key \
            "ghcr.io/vectorize-io/hindsight:${HINDSIGHT_VERSION}"
          for _ in $(seq 1 180); do
            curl -fsS http://127.0.0.1:8888/health >/dev/null && exit 0
            sleep 1
          done
          docker logs pantheon-hermes-q5-hindsight
          exit 1

      - name: Execute Hermes to sole Hindsight producer separation lab
        working-directory: monorepo/implementation
        env:
          HERMES_ROOT: ${{ github.workspace }}/hermes-agent
          OBSIDIAN_ROOT: ${{ github.workspace }}/hindsight-obsidian
        run: bash tools/run_hermes_hindsight_ingestion_q5.sh

      - name: Capture runtime identity and logs
        if: always()
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/hermes-hindsight-ingestion-q5/artifacts"
          docker image inspect "ghcr.io/vectorize-io/hindsight:${HINDSIGHT_VERSION}" \
            --format '{{json .RepoDigests}}' \
            > "${RUNNER_TEMP}/hermes-hindsight-ingestion-q5/artifacts/hindsight-image-repodigests.json" || true
          docker logs pantheon-hermes-q5-hindsight \
            > "${RUNNER_TEMP}/hermes-hindsight-ingestion-q5/artifacts/hindsight.log" 2>&1 || true

      - name: Stop ephemeral Hindsight
        if: always()
        run: docker stop pantheon-hermes-q5-hindsight || true

      - name: Upload bounded observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-hindsight-ingestion-q5-${{ github.run_id }}
          path: ${{ runner.temp }}/hermes-hindsight-ingestion-q5/artifacts/
          if-no-files-found: error
          retention-days: 14
