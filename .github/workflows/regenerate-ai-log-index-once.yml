name: Regenerate AI log index once

on:
  push:
    branches:
      - agent/common-installation-baseline
    paths:
      - .github/workflows/regenerate-ai-log-index-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/common-installation-baseline
      - name: Regenerate and verify bounded change
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/generate_ai_logs_index.py
          changed="$(git diff --name-only)"
          test "$changed" = "ai_logs/INDEX.md"
          grep -F 'Total indexed entries: **662**.' ai_logs/INDEX.md
          grep -F '| 2026-07-22 | `2026-07-22-common-installation-baseline.md` | Common installation baseline and self-review |' ai_logs/INDEX.md
      - name: Commit generated index and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/regenerate-ai-log-index-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_logs/INDEX.md .github/workflows/regenerate-ai-log-index-once.yml
          git commit -m 'chore: regenerate ai logs index'
          git push origin HEAD:agent/common-installation-baseline
