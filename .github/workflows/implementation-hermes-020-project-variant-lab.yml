name: Hermes 0.20.0 Project Variant Lab

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/implementation-hermes-020-project-variant-lab.yml"
      - "implementation/hermes/distribution/pantheon-standard.lock.yaml"
      - "implementation/mvp_vertical/hermes_execution_api.py"
      - "implementation/mvp_vertical/hermes_run_binding.py"
      - "implementation/mvp_vertical/hermes_runtime_return.py"
      - "implementation/mvp_vertical/project_change_variant_api.py"
      - "implementation/mvp_vertical/project_change_variants.py"
      - "schemas/project_change_variant_candidate.schema.yaml"
      - "implementation/tools/hermes_020_lab_fixture.py"
      - "implementation/tools/hermes_020_variant_lab_fixture.py"
      - "implementation/tools/run_hermes_020_lab_acceptance.py"
      - "implementation/tools/run_hermes_020_lab_acceptance.sh"
      - "implementation/tools/run_hermes_020_variant_lab_acceptance.py"
      - "implementation/tools/run_hermes_020_variant_lab_acceptance.sh"
      - "implementation/tests/test_hermes_project_change_variant_binding.py"
      - "implementation/tests/test_hermes_project_change_variant_return.py"
      - "implementation/tests/test_project_change_variant_api.py"

permissions:
  contents: read

concurrency:
  group: hermes-020-project-variant-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ephemeral-project-variant-lab:
    name: produce alternatives and rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HERMES_RELEASE_COMMIT: 3c27eb6234bf91b8ceee9e9071591b31e9b148cb
      HERMES_VERSION: 0.20.0
      PANTHEON_NEXT_REF: 8227d1c78ca48e5aea04f825d80ecde159fa5434
      PROFILE: pantheon-governed
      PROFILE_KEY: hermes-profile-lab-key
      FIXTURE_URL: http://127.0.0.1:9010
      HERMES_API_BASE: http://127.0.0.1:8642/p/pantheon-governed
      HERMES_API_KEY: hermes-profile-lab-key
      PANTHEON_HERMES_API_BASE: http://127.0.0.1:9010
      PANTHEON_HERMES_API_KEY: pantheon-lab-key
      PANTHEON_HERMES_ACTOR: hermes-020-variant-lab-binding

    steps:
      - name: Checkout current monorepo candidate
        uses: actions/checkout@v4
        with:
          path: monorepo

      - name: Expose transitional pantheon-mvp workspace alias
        shell: bash
        run: ln -s "$GITHUB_WORKSPACE/monorepo/implementation" "$GITHUB_WORKSPACE/pantheon-mvp"

      - name: Checkout pinned Pantheon-Next variant authority
        uses: actions/checkout@v4
        with:
          repository: ifanjuang/Pantheon-Next
          ref: ${{ env.PANTHEON_NEXT_REF }}
          path: Pantheon-Next

      - name: Checkout exact Hermes 0.20.0 source
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_RELEASE_COMMIT }}
          path: hermes-upstream
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute bounded Project variant laboratory
        working-directory: monorepo/implementation
        shell: bash
        run: bash tools/run_hermes_020_variant_lab_acceptance.sh

      - name: Upload Project variant laboratory observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-020-project-variant-lab-${{ github.run_id }}
          path: ${{ runner.temp }}/hermes-020-lab/artifacts/
          if-no-files-found: error
          retention-days: 14
