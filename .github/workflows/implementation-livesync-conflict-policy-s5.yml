name: LiveSync Conflict Policy S5

on:
  pull_request:
    paths:
      - ".github/workflows/implementation-livesync-conflict-policy-s5.yml"
      - "implementation/qualification/external-pins.json"
      - "implementation/tools/export_external_qualification_pins.py"
      - "implementation/tools/obsidian_e2e_with_flake_report.sh"
      - "tests/test_livesync_conflict_policy_s5_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: pytest -q tests/test_livesync_conflict_policy_s5_contract.py

  real-conflict-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout current monorepo candidate
        uses: actions/checkout@v4
        with:
          path: monorepo

      - name: Load canonical LiveSync and Obsidian qualification pins
        shell: bash
        run: python3 monorepo/implementation/tools/export_external_qualification_pins.py --github-env "$GITHUB_ENV" self-hosted-livesync obsidian-desktop

      - name: Checkout exact Self-hosted LiveSync release commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LIVESYNC_REPOSITORY }}
          ref: ${{ env.LIVESYNC_REF }}
          path: obsidian-livesync
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: obsidian-livesync/package-lock.json

      - name: Verify exact upstream identity, install dependencies and build plugin
        working-directory: obsidian-livesync
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$LIVESYNC_REF"
          node -e "const p=require('./package.json'); if(p.version!==process.env.LIVESYNC_VERSION) process.exit(1)"
          npm ci
          npm run build

      - name: Install qualified official Obsidian AppImage fixture
        working-directory: obsidian-livesync
        shell: bash
        run: |
          mkdir -p _testdata/obsidian/current
          curl --fail --location --retry 3 \
            "https://github.com/obsidianmd/obsidian-releases/releases/download/v${OBSIDIAN_VERSION}/Obsidian-${OBSIDIAN_VERSION}.AppImage" \
            --output _testdata/obsidian/current/Obsidian.AppImage
          chmod +x _testdata/obsidian/current/Obsidian.AppImage
          cd _testdata/obsidian/current
          ./Obsidian.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/obsidian
          test -x squashfs-root/obsidian-cli
          echo "OBSIDIAN_BINARY=${GITHUB_WORKSPACE}/obsidian-livesync/_testdata/obsidian/current/squashfs-root/obsidian" >> "$GITHUB_ENV"
          echo "OBSIDIAN_CLI=${GITHUB_WORKSPACE}/obsidian-livesync/_testdata/obsidian/current/squashfs-root/obsidian-cli" >> "$GITHUB_ENV"

      - name: Run upstream real-Obsidian conflict policy scenario
        working-directory: obsidian-livesync
        shell: bash
        # One bounded retry around the shared upstream session-start wait.
        # The scenario runs in full and must pass; a real regression fails
        # both attempts. A first-attempt failure is always written to the run
        # summary, so the flake stays countable instead of silently absorbed.
        run: >-
          "$GITHUB_WORKSPACE/monorepo/implementation/tools/obsidian_e2e_with_flake_report.sh"
          xvfb-run -a npm run test:e2e:obsidian:conflict-dialog-policy

      - name: Capture bounded acceptance summary
        if: success()
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/livesync-conflict-policy-s5"
          cat > "${RUNNER_TEMP}/livesync-conflict-policy-s5/acceptance-summary.json" <<EOF
          {
            "kind": "livesync_conflict_policy_s5_acceptance",
            "status": "passed",
            "livesync_commit": "${LIVESYNC_REF}",
            "livesync_version": "${LIVESYNC_VERSION}",
            "obsidian_version": "${OBSIDIAN_VERSION}",
            "scenario": "conflict-dialog-policy",
            "real_obsidian": true,
            "three_live_versions_reviewed_pairwise": true,
            "concat_resolution_verified": true,
            "postponed_conflict_persists_restart": true,
            "ordinary_repeat_prompt_suppressed": true,
            "explicit_conflict_command_reopens_dialog": true,
            "replicated_resolution_clears_dialog_state": true,
            "transport_origin_conflict_tested": false,
            "two_vault_transport_conflict_tested": false,
            "nas_deployment_tested": false,
            "hindsight_ingestion_activated": false,
            "pantheon_state_mutated": false,
            "evidence_admitted": false
          }
          EOF

      - name: Upload bounded acceptance summary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: livesync-conflict-policy-s5-${{ github.run_id }}
          path: ${{ runner.temp }}/livesync-conflict-policy-s5/acceptance-summary.json
          if-no-files-found: error
          retention-days: 14
