name: LiveSync Production Dependency Audit S6

on:
  pull_request:
    paths:
      - ".github/workflows/implementation-livesync-production-audit-s6.yml"
      - "implementation/qualification/external-pins.json"
      - "implementation/tools/export_external_qualification_pins.py"
      - "tests/test_livesync_production_audit_s6_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: pytest -q tests/test_livesync_production_audit_s6_contract.py

  classify-production-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout current monorepo candidate
        uses: actions/checkout@v4
        with:
          path: monorepo

      - name: Load canonical LiveSync qualification pins
        shell: bash
        run: python3 monorepo/implementation/tools/export_external_qualification_pins.py --github-env "$GITHUB_ENV" self-hosted-livesync self-hosted-livesync-cli

      - name: Checkout exact Self-hosted LiveSync release commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LIVESYNC_REPOSITORY }}
          ref: ${{ env.LIVESYNC_REF }}
          path: obsidian-livesync
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: obsidian-livesync/package-lock.json

      - name: Verify exact upstream identity and install locked tree
        working-directory: obsidian-livesync
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$LIVESYNC_REF"
          node - <<'NODE'
          const root = require('./package.json');
          const cli = require('./src/apps/cli/package.json');
          if (root.version !== process.env.LIVESYNC_VERSION) process.exit(1);
          if (cli.version !== process.env.LIVESYNC_CLI_VERSION) process.exit(1);
          NODE
          npm ci

      - name: Run complete and production-only npm audits
        working-directory: obsidian-livesync
        shell: bash
        run: |
          set +e
          npm audit --json > "${RUNNER_TEMP}/livesync-audit-all.json"
          echo "ALL_AUDIT_EXIT=$?" >> "$GITHUB_ENV"
          npm audit --omit=dev --json > "${RUNNER_TEMP}/livesync-audit-production.json"
          echo "PRODUCTION_AUDIT_EXIT=$?" >> "$GITHUB_ENV"
          npm audit --omit=dev --workspace self-hosted-livesync-cli --json > "${RUNNER_TEMP}/livesync-audit-cli-production.json"
          echo "CLI_PRODUCTION_AUDIT_EXIT=$?" >> "$GITHUB_ENV"
          npm ls --omit=dev --workspace self-hosted-livesync-cli --all --json > "${RUNNER_TEMP}/livesync-cli-production-tree.json"
          echo "CLI_TREE_EXIT=$?" >> "$GITHUB_ENV"
          set -e

      - name: Classify observed findings without treating audit exit as authorization
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.env.RUNNER_TEMP;
          function read(name) {
            const file = path.join(root, name);
            const parsed = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!parsed.metadata || !parsed.metadata.vulnerabilities || !parsed.vulnerabilities) {
              throw new Error(`npm audit output is not structurally valid: ${name}`);
            }
            const counts = parsed.metadata.vulnerabilities;
            const vulnerabilities = Object.entries(parsed.vulnerabilities).map(([name, value]) => ({
              name,
              severity: value.severity,
              isDirect: Boolean(value.isDirect),
              range: value.range,
              fixAvailable: value.fixAvailable,
              nodes: Array.isArray(value.nodes) ? value.nodes : [],
              via: Array.isArray(value.via)
                ? value.via.map((item) => typeof item === 'string' ? item : {
                    source: item.source,
                    name: item.name,
                    severity: item.severity,
                    title: item.title,
                    url: item.url,
                    range: item.range,
                  })
                : value.via,
            }));
            return {counts, vulnerabilities};
          }
          const all = read('livesync-audit-all.json');
          const production = read('livesync-audit-production.json');
          const cliProduction = read('livesync-audit-cli-production.json');
          const summary = {
            kind: 'livesync_production_dependency_audit_s6',
            status: 'classified',
            livesync_commit: process.env.LIVESYNC_REF,
            livesync_version: process.env.LIVESYNC_VERSION,
            livesync_cli_version: process.env.LIVESYNC_CLI_VERSION,
            audit_exit_codes: {
              all: Number(process.env.ALL_AUDIT_EXIT),
              production: Number(process.env.PRODUCTION_AUDIT_EXIT),
              cli_production: Number(process.env.CLI_PRODUCTION_AUDIT_EXIT),
              cli_tree: Number(process.env.CLI_TREE_EXIT),
            },
            all_tree: all,
            production_tree: production,
            cli_production_tree: cliProduction,
            security_qualified: false,
            exploitability_assessed: false,
            nas_deployment_tested: false,
            runtime_success_is_authorization: false,
          };
          const out = path.join(root, 'livesync-production-audit-s6-summary.json');
          fs.writeFileSync(out, JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify({
            all: all.counts,
            production: production.counts,
            cliProduction: cliProduction.counts,
            productionNames: production.vulnerabilities.map(v => `${v.name}:${v.severity}${v.isDirect ? ':direct' : ''}`),
            cliProductionNames: cliProduction.vulnerabilities.map(v => `${v.name}:${v.severity}${v.isDirect ? ':direct' : ''}`),
          }, null, 2));
          NODE

      - name: Upload audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: livesync-production-audit-s6-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/livesync-audit-all.json
            ${{ runner.temp }}/livesync-audit-production.json
            ${{ runner.temp }}/livesync-audit-cli-production.json
            ${{ runner.temp }}/livesync-cli-production-tree.json
            ${{ runner.temp }}/livesync-production-audit-s6-summary.json
          if-no-files-found: error
          retention-days: 14
