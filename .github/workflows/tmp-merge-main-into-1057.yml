name: Temporary merge main into PR 1057

on:
  push:
    branches:
      - codex/governed-runtime-capabilities

permissions:
  contents: write

jobs:
  merge-main:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/governed-runtime-capabilities
          fetch-depth: 0
      - name: Merge current main and regenerate the only conflict
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          MAIN_HEAD="$(git rev-parse origin/main)"

          test "$(git rev-parse "${MAIN_HEAD}:implementation/hermes/distribution/pantheon-standard.lock.yaml")" = "c6f937f3428c4f8a2f9d784ad4f8a312234b1409"
          test "$(git rev-parse "${MAIN_HEAD}:templates/hermes/profiles/pantheon-governed/SOUL.append.md")" = "379533680bffb6d1f6065c603b229425f2c9164e"

          merge_status=0
          if git merge --no-commit --no-ff "$MAIN_HEAD"; then
            merge_status=0
          else
            merge_status=$?
          fi
          if [ "$merge_status" -ne 0 ] && [ "$merge_status" -ne 1 ]; then
            exit "$merge_status"
          fi

          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          if [ -n "$conflicts" ] && [ "$conflicts" != "ai_logs/INDEX.md" ]; then
            printf 'Unexpected conflicts:\n%s\n' "$conflicts"
            exit 1
          fi
          if [ "$conflicts" = "ai_logs/INDEX.md" ]; then
            git checkout --theirs -- ai_logs/INDEX.md
            git add ai_logs/INDEX.md
          fi

          python3 .github/scripts/generate_ai_logs_index.py
          git add ai_logs/INDEX.md

          grep -q 'version: "0.21.2"' implementation/hermes/distribution/pantheon-standard.lock.yaml
          grep -q 'sha256:e65d6844d499afbf7831917a7af08097bd4d24a1dac99eb36c15026a62a16ad6' implementation/hermes/distribution/pantheon-standard.lock.yaml
          grep -q 'sha256:d8e22444cd647a8b943beacffad9e60d28d9fd41a49d97ad2396ad79525d93cb' implementation/hermes/distribution/pantheon-standard.lock.yaml
          grep -q 'pantheon-governed-method' templates/hermes/profiles/pantheon-governed/SOUL.append.md
          grep -q 'handling.metathoughts' templates/hermes/profiles/pantheon-governed/SOUL.append.md
          grep -q 'source preflight' templates/hermes/profiles/pantheon-governed/SOUL.append.md
          grep -q 'ready_with_limits' templates/hermes/profiles/pantheon-governed/SOUL.append.md

          rm -f .github/tmp-merge-diagnostic.txt
          git add -u .github/tmp-merge-diagnostic.txt 2>/dev/null || true
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          git commit -m "merge(main): reconcile governed runtime capabilities"
          git push origin HEAD:codex/governed-runtime-capabilities
