name: Temporary merge main into PR 1057

on:
  push:
    branches:
      - codex/governed-runtime-capabilities

permissions:
  contents: write

jobs:
  merge-main:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/governed-runtime-capabilities
          fetch-depth: 0
      - name: Diagnose bounded main reconciliation
        shell: bash
        run: |
          set -Eeuo pipefail
          stage=init
          readonly DIAG=.github/tmp-merge-diagnostic.txt
          diagnose() {
            code=$?
            conflicts="$(git diff --name-only --diff-filter=U 2>/dev/null | sort | tr '\n' ' ' || true)"
            main_head="$(git rev-parse origin/main 2>/dev/null || true)"
            main_lock="$(git rev-parse "${main_head}:implementation/hermes/distribution/pantheon-standard.lock.yaml" 2>/dev/null || true)"
            main_soul="$(git rev-parse "${main_head}:templates/hermes/profiles/pantheon-governed/SOUL.append.md" 2>/dev/null || true)"
            git merge --abort >/dev/null 2>&1 || true
            printf 'stage=%s\nexit=%s\nmain=%s\nmain_lock=%s\nmain_soul=%s\nconflicts=%s\n' "$stage" "$code" "$main_head" "$main_lock" "$main_soul" "$conflicts" > "$DIAG"
            git add "$DIAG"
            git commit -m "chore(ci): capture #1057 reconciliation diagnostic" || true
            git push origin HEAD:codex/governed-runtime-capabilities || true
            exit "$code"
          }
          trap diagnose ERR

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stage=fetch
          git fetch origin main
          readonly MAIN_HEAD="$(git rev-parse origin/main)"
          stage=blob-check
          test "$(git rev-parse "${MAIN_HEAD}:implementation/hermes/distribution/pantheon-standard.lock.yaml")" = "c6f937f3428c4f8a2f9d784ad4f8a312234b1409"
          test "$(git rev-parse "${MAIN_HEAD}:templates/hermes/profiles/pantheon-governed/SOUL.append.md")" = "379533680bffb6d1f6065c603b229425f2c9164e"

          stage=merge
          set +e
          git merge --no-commit --no-ff "$MAIN_HEAD"
          merge_status=$?
          set -e
          stage=conflict-set
          conflicts="$(git diff --name-only --diff-filter=U | sort | tr '\n' ' ')"
          python3 - "$conflicts" <<'PY'
          import sys
          allowed = {
              "ai_logs/INDEX.md",
              "implementation/hermes/distribution/pantheon-standard.lock.yaml",
              "templates/hermes/profiles/pantheon-governed/SOUL.append.md",
          }
          actual = {p for p in sys.argv[1].split() if p}
          unexpected = actual - allowed
          if unexpected:
              raise SystemExit(f"unexpected conflicts: {sorted(unexpected)}")
          PY
          stage=intentional-stop
          false
