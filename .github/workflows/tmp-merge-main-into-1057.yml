name: Temporary merge main into PR 1057

on:
  push:
    branches:
      - codex/governed-runtime-capabilities

permissions:
  contents: write

jobs:
  merge-main:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/governed-runtime-capabilities
          fetch-depth: 0
      - name: Merge current main with bounded conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          expected = [
              "ai_logs/INDEX.md",
              "implementation/hermes/distribution/pantheon-standard.lock.yaml",
              "templates/hermes/profiles/pantheon-governed/SOUL.append.md",
          ]
          conflicts = sorted(
              line for line in subprocess.check_output(
                  ["git", "diff", "--name-only", "--diff-filter=U"], text=True
              ).splitlines() if line
          )
          if conflicts != expected:
              raise SystemExit(f"unexpected conflicts: {conflicts}")

          # Generated index: current main is a valid starting point; regenerate later.
          subprocess.run(["git", "checkout", "--theirs", "--", "ai_logs/INDEX.md"], check=True)

          lock_path = "implementation/hermes/distribution/pantheon-standard.lock.yaml"
          ours_lock = subprocess.check_output(["git", "show", f":2:{lock_path}"], text=True)
          theirs_lock = subprocess.check_output(["git", "show", f":3:{lock_path}"], text=True)
          digest_match = re.search(
              r"component_id: runtime-observer.*?content_digest: (sha256:[0-9a-f]+)",
              theirs_lock,
              re.S,
          )
          if not digest_match:
              raise SystemExit("runtime-observer digest not found in current main")
          merged_lock, count = re.subn(
              r"(component_id: runtime-observer.*?content_digest: )sha256:[0-9a-f]+",
              rf"\g<1>{digest_match.group(1)}",
              ours_lock,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"expected one runtime-observer digest, replaced {count}")
          if 'version: "0.21.2"' not in merged_lock:
              raise SystemExit("Hermes 0.21.2 pin was not preserved")
          Path(lock_path).write_text(merged_lock, encoding="utf-8")

          soul_path = "templates/hermes/profiles/pantheon-governed/SOUL.append.md"
          ours_soul = subprocess.check_output(["git", "show", f":2:{soul_path}"], text=True)
          theirs_soul = subprocess.check_output(["git", "show", f":3:{soul_path}"], text=True)
          start = "When an observed Pantheon `classify_request` result contains\n"
          end = "report that later transition separately.\n\n"
          if start not in theirs_soul or end not in theirs_soul:
              raise SystemExit("current-main metathought block not found")
          block = theirs_soul[theirs_soul.index(start):theirs_soul.index(end) + len(end)]
          needle = "An explicit request for the skill must visibly include at least:\n"
          if needle not in ours_soul:
              raise SystemExit("#1057 SOUL insertion point not found")
          if start in ours_soul:
              raise SystemExit("metathought block unexpectedly already present in #1057 side")
          merged_soul = ours_soul.replace(needle, block + needle, 1)
          required = (
              "`pantheon-governed-method` and `pantheon-activity-projection` skills",
              "handling.metathoughts",
              "source preflight",
              "ready_with_limits",
          )
          missing = [item for item in required if item not in merged_soul]
          if missing:
              raise SystemExit(f"merged SOUL missing required content: {missing}")
          Path(soul_path).write_text(merged_soul, encoding="utf-8")
          PY
            git add ai_logs/INDEX.md implementation/hermes/distribution/pantheon-standard.lock.yaml templates/hermes/profiles/pantheon-governed/SOUL.append.md
          fi

          python3 .github/scripts/generate_ai_logs_index.py
          git add ai_logs/INDEX.md

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git diff --check

          git commit -m "merge(main): reconcile governed runtime capabilities"
          git push origin HEAD:codex/governed-runtime-capabilities
