name: One-time reviewed stale branch cleanup

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - .github/workflows/one-time-stale-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'chore/repository-branch-cleanup-next'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete reviewed stale branches and cleanup branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          branches=(
            "agent/rebase-document-runtime-live-observations-20260725"
            "agent/rebase-document-runtime-status-projection-20260725"
            "agent/rebase-hermes-paperless-intake-binding-20260725"
            "agent/rebase-paperless-initial-installation-20260725"
            "agent/reconcile-mvp-demo-link"
            "agent/simplify-cockpit-card-model"
            "agent/tool-card-governance-convergence"
            "backup/policy-http-pre-reconcile-20260722"
            "backup/pr-438-pre-rebase-f9228c6"
            "ci/roles-rites-spaces-change-guard"
            "ci/roles-rites-spaces-change-guard-v2"
            "claude/analyze-dependent-repos-optimization-x1udnu"
            "claude/mcp-sdk-pin-v1"
            "docs/post-440-cockpit-reconciliation-main"
            "docs/tool-card-model"
            "replay/pr-438-on-common-baseline"
            "tmp-test-base-tree-delete-me"
            "chore/repository-branch-cleanup-next"
          )

          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" || "$branch" == "agent/revit-local-adapter-v0" ]]; then
              echo "Refusing protected branch: $branch" >&2
              exit 1
            fi

            encoded_branch="${branch//\//%2F}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded_branch}" >/dev/null 2>&1; then
              echo "Deleting $branch"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_branch}"
            else
              echo "Already absent: $branch"
            fi
          done
