name: Temporary regenerate ai_logs index

on:
  push:
    branches:
      - codex/simplify-distillation-registry

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/simplify-distillation-registry
          fetch-depth: 0
      - name: Regenerate index
        run: python3 .github/scripts/generate_ai_logs_index.py
      - name: Commit generated index when changed
        run: |
          if git diff --quiet -- ai_logs/INDEX.md; then
            echo "Index already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_logs/INDEX.md
          git commit -m "chore(ai-logs): regenerate index"
          git push origin HEAD:codex/simplify-distillation-registry
