name: Temporary AI log index refresh

on:
  push:
    branches:
      - codex/governed-runtime-capabilities

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/governed-runtime-capabilities
          fetch-depth: 0
      - name: Regenerate canonical AI log index
        run: python3 .github/scripts/generate_ai_logs_index.py
      - name: Commit generated index
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_logs/INDEX.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(governance): refresh ai log index"
          git push origin HEAD:codex/governed-runtime-capabilities
