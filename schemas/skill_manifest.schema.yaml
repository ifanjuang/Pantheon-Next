$schema: "https://json-schema.org/draft/2020-12/schema"
title: Pantheon Next Skill Manifest
description: Governance schema for declaring a candidate skill or capability without installing or executing it.
type: object
required:
  - skill_id
  - title
  - purpose
  - owner_role
  - lifecycle_state
  - required_approvals
  - risk_level
  - allowed_use
  - forbidden_use
properties:
  skill_id:
    type: string
    pattern: "^[a-z0-9._-]+$"
  title:
    type: string
    minLength: 3
  purpose:
    type: string
    minLength: 10
  owner_role:
    type: string
    enum:
      - athena-agent
      - argos-agent
      - themis-agent
      - apollo-agent
      - zeus-agent
      - iris-agent
      - hephaistos-agent
  lifecycle_state:
    type: string
    enum:
      - candidate
      - active
      - probation
      - quarantine
      - archived
      - rejected
  required_approvals:
    type: array
    minItems: 1
    items:
      type: string
      enum:
        - C0
        - C1
        - C2
        - C3
        - C4
        - C5
  risk_level:
    type: string
    enum:
      - low
      - medium
      - high
      - critical
  allowed_use:
    type: array
    minItems: 1
    items:
      type: string
  forbidden_use:
    type: array
    minItems: 1
    items:
      type: string
  evidence_pack_id:
    type:
      - string
      - "null"
  external_dependencies:
    type: array
    items:
      type: string
  governance_refs:
    type: array
    items:
      type: string
    default:
      - docs/governance/SKILL_LIFECYCLE.md
      - docs/governance/HERMES_INTEGRATION.md
      - docs/governance/EXTERNAL_TOOLS_POLICY.md
additionalProperties: false
x-boundary:
  runtime_execution: false
  autonomous_loop: false
  provider_routing: false
  scheduler: false
  queue_system: false
  plugin_manager: false
  automatic_installation: false
  tool_runtime: false
  memory_promotion: false
