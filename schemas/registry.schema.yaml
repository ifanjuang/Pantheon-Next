$schema: https://json-schema.org/draft/2020-12/schema
$id: https://pantheon.local/schemas/registry.schema.yaml
title: Pantheon Registry Projection
type: object
additionalProperties: false
required:
  - schema_version
  - registry_id
  - registry_kind
  - version
  - status
  - owner
  - authority_document
  - entries
  - x_boundary
properties:
  schema_version:
    type: string
    const: "1"
  registry_id:
    type: string
    pattern: "^[a-z][a-z0-9_]*$"
  registry_kind:
    type: string
    pattern: "^[a-z][a-z0-9_]*$"
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  status:
    type: string
    enum:
      - candidate
      - active
      - under_review
      - deprecated
      - superseded
  owner:
    type: object
    additionalProperties: false
    required:
      - id
      - repository
    properties:
      id:
        type: string
        minLength: 1
      repository:
        type: string
        const: Pantheon-Next
  authority_document:
    type: string
    pattern: "^(docs|registries)/.+"
  description:
    type: string
    minLength: 1
  entries:
    type: array
    items:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9_.-]*$"
      additionalProperties: true
  x_boundary:
    type: object
    additionalProperties: false
    required:
      - runtime_execution
      - provider_routing
      - task_authorization
      - approval
      - evidence_promotion
      - memory_promotion
    properties:
      runtime_execution:
        const: false
      provider_routing:
        const: false
      task_authorization:
        const: false
      approval:
        const: false
      evidence_promotion:
        const: false
      memory_promotion:
        const: false
