$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Project Understanding Derivation
description: >-
  V0.2 provenance record describing how one or more attribute or relation claims
  were produced. It may describe deterministic calculation, source extraction,
  model-assisted reasoning or a human assertion. It records method/version,
  inputs and computed uncertainty; it never executes the method itself.
type: object
additionalProperties: false
required: [derivation_id, produces_claim_refs, method_id, method_kind]
properties:
  derivation_id:
    type: string
    minLength: 1
  produces_claim_refs:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
  method_id:
    type: string
    minLength: 1
  method_version:
    type: string
    minLength: 1
  method_kind:
    type: string
    enum: [deterministic, source_extraction, model_assisted, human_assertion, other]
  input_refs:
    type: array
    uniqueItems: true
    default: []
    description: Claim, representation, calibration, Evidence or other declared input references.
    items:
      type: string
      minLength: 1
  binding_ref:
    type: string
    minLength: 1
  tool_version:
    type: string
    minLength: 1
  method_penalty:
    type: number
    description: Optional computed-confidence penalty applied by the method, never a governance approval.
    exclusiveMinimum: 0
    maximum: 1
  rule:
    type: string
    description: Human-readable deterministic rule or reasoning method for audit.
    minLength: 1
  formula:
    type: string
    minLength: 1
  produced_certainty_score:
    type: number
    minimum: 0
    maximum: 1
    description: Internal method score; the governed claim carries only its declared E0-E4 certainty band.
  produced_tolerance:
    type: object
    additionalProperties: true
  limitations:
    type: array
    uniqueItems: true
    default: []
    items:
      type: string
      minLength: 1
  notes:
    type: string
  governance_refs:
    type: array
    items: { type: string }
    default:
      - docs/domain-packs/architecture/PROJECT_UNDERSTANDING.md
      - docs/domain-packs/architecture/PROJECT_ANATOMY_V02_DESIGN_REVIEW.md
      - schemas/architecture-project-understanding/shared.schema.yaml
x-boundary:
  runtime_execution: false
  provider_routing: false
  scheduler: false
  queue_system: false
  memory_promotion: false
  automatic_canonization: false
  approval_engine: false
