$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Project Understanding Derivation
description: >-
  A provenance DAG node that produces an attribute claim from inputs (other
  claims, calibrations, detections). Makes inference auditable and confidence
  computable (L2): the produced confidence is <= min of input confidences, and
  tolerance composes input tolerances. Structure only; it records a derivation,
  it does not execute one.
type: object
additionalProperties: false
required: [derivation_id, produces, method]
properties:
  derivation_id: { type: string, minLength: 1 }
  produces: { $ref: "shared.schema.yaml#/$defs/attribute_ref" }
  method:
    type: string
    description: >-
      e.g. dimensioned_on_plan, inferred_from_pdf_symbol,
      scaled_from_calibration, revit_parameter, ifc_property, vision_detection,
      human_assertion.
    minLength: 1
  inputs:
    type: array
    description: References to calibration ids, attribute_claim ids or detection ids.
    default: []
    items: { type: string }
  method_penalty:
    type: number
    description: Multiplicative confidence penalty applied by the method (0..1].
    exclusiveMinimum: 0
    maximum: 1
  rule:
    type: string
    description: Human-readable statement of the computation, for audit.
  produced_certainty_score:
    type: number
    minimum: 0
    maximum: 1
    description: "Internal computed score (<= min of input scores * method_penalty). Banded to the E0-E4 certainty carried by the attribute_claim / match; not itself a governance field (decision A: single governance representation is E0-E4)."
  produced_tolerance: { type: object }
  notes: { type: string }
  governance_refs:
    type: array
    items: { type: string }
    default:
      - docs/domain-packs/architecture/PROJECT_UNDERSTANDING.md
      - schemas/architecture-project-understanding/shared.schema.yaml
x-boundary:
  runtime_execution: false
  provider_routing: false
  memory_promotion: false
  automatic_canonization: false
  approval_engine: false
