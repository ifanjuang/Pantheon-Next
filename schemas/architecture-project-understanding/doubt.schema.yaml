$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Project Understanding Doubt
description: >-
  An active doubt. It carries what would resolve it (resolved_by) and what it
  blocks (blocks), driving an acquisition/question backlog. A doubt is not
  decorative. Structure only; it records a doubt and a proposed backlog, it does
  not execute any action.
type: object
additionalProperties: false
required: [doubt_id, about]
properties:
  doubt_id: { type: string, minLength: 1 }
  about: { $ref: "shared.schema.yaml#/$defs/attribute_ref" }
  statement: { type: string }
  resolved_by:
    type: array
    default: []
    items:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { $ref: "shared.schema.yaml#/$defs/resolution_action" }
        question: { type: string }
        document: { type: string }
        responsibility: { $ref: "shared.schema.yaml#/$defs/responsibility_party" }
  blocks:
    type: array
    description: Check candidate ids (or other object ids) blocked by this doubt.
    default: []
    items: { type: string }
  effort: { $ref: "shared.schema.yaml#/$defs/effort" }
  evidence_refs:
    type: array
    default: []
    items: { $ref: "shared.schema.yaml#/$defs/evidence_ref" }
  notes: { type: string }
  governance_refs:
    type: array
    items: { type: string }
    default:
      - docs/domain-packs/architecture/PROJECT_UNDERSTANDING.md
      - schemas/architecture-project-understanding/shared.schema.yaml
x-boundary:
  runtime_execution: false
  provider_routing: false
  memory_promotion: false
  automatic_canonization: false
  approval_engine: false
