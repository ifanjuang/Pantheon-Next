$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Project Understanding Contradiction
description: >-
  A governed contradiction object (L4). It holds the competing claims, links
  their evidence, may carry a non-binding policy_hint, and stays pending_human.
  The system never resolves a contradiction on its own. Structure only.
type: object
additionalProperties: false
required: [contradiction_id, about, claims, resolution]
properties:
  contradiction_id: { type: string, minLength: 1 }
  about: { $ref: "shared.schema.yaml#/$defs/attribute_ref" }
  claims:
    type: array
    minItems: 2
    items:
      type: object
      additionalProperties: false
      required: [source_authority]
      properties:
        attribute_claim_id: { type: string }
        value: { type: object }
        source_authority: { $ref: "shared.schema.yaml#/$defs/source_authority_level" }
        evidence_ref: { $ref: "shared.schema.yaml#/$defs/evidence_ref" }
  policy_hint:
    type: string
    description: Non-binding ordering proposal from the project source policy.
  resolution:
    type: string
    enum: [pending_human, resolved_by_human, withdrawn]
  resolved_value: { type: object }
  resolved_by: { type: string }
  notes: { type: string }
  governance_refs:
    type: array
    items: { type: string }
    default:
      - docs/governance/ARCHITECTURE_PROJECT_UNDERSTANDING.md
      - schemas/architecture-project-understanding/shared.schema.yaml
allOf:
  # L4: a resolved value can only exist once a human has resolved it.
  - if:
      required: [resolved_value]
    then:
      properties:
        resolution: { const: resolved_by_human }
      required: [resolved_by]
x-boundary:
  runtime_execution: false
  provider_routing: false
  memory_promotion: false
  automatic_canonization: false
  approval_engine: false
