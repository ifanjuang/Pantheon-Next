$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Project Object Model Spatial Node
description: >-
  Containment hierarchy node: project / site / parcel / building / level / zone /
  space / room / subspace. A zone carries a zone_type and may be transversal
  (cross levels, group non-contiguous objects). Physical tree plus transversal
  groups, never a tree alone. See ARCHITECTURE_PROJECT_OBJECT_MODEL.md. Structure
  only.
type: object
additionalProperties: false
required: [spatial_node_id, node_kind]
properties:
  spatial_node_id: { type: string, minLength: 1 }
  human_ref: { $ref: "shared.schema.yaml#/$defs/human_ref" }
  node_kind: { $ref: "#/$defs/node_kind" }
  zone_type: { $ref: "#/$defs/zone_type" }
  parent_id: { type: string }
  spans_levels:
    type: array
    default: []
    items: { type: string }
  member_object_ids:
    description: "Transversal members (rooms or objects) for zones that are not pure containers."
    type: array
    default: []
    items: { type: string }
  source_refs:
    type: array
    default: []
    items: { type: string }
  notes: { type: string }
  governance_refs:
    type: array
    items: { type: string }
    default:
      - docs/governance/ARCHITECTURE_PROJECT_OBJECT_MODEL.md
      - schemas/shared_axes.schema.yaml
allOf:
  # A zone is a typed grouping, not a bare container: it must carry a zone_type
  # before transversal zones can be relied upon (#169).
  - if:
      properties:
        node_kind: { const: zone }
      required: [node_kind]
    then:
      required: [zone_type]
$defs:
  node_kind:
    type: string
    enum: [project, site, parcel, building, level, zone, space, room, subspace]
  zone_type:
    type: string
    enum: [functional, programmatic, technical, spatial, phasing, facade, work_zone]
x-boundary:
  runtime_execution: false
  provider_routing: false
  memory_promotion: false
  automatic_canonization: false
  approval_engine: false
