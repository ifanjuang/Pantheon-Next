$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Project Object Model Property Set
description: >-
  A semi-structured property set applied to an object or a group. Minimal rigid
  core plus optional qualified property claims, inherited by type or group, with
  per-instance exceptions handled by instance_override. Properties are not frozen
  into rigid columns. See ARCHITECTURE_PROJECT_OBJECT_MODEL.md. Structure only.
type: object
additionalProperties: false
required: [property_set_id, applies_to, property_set_type, claims]
properties:
  property_set_id: { type: string, minLength: 1 }
  applies_to:
    description: "An object stable_id or an object_group id."
    type: string
    minLength: 1
  property_set_type: { type: string, minLength: 1 }
  claims:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [property_key, status]
      properties:
        property_key: { type: string, minLength: 1 }
        value: { type: string }
        value_type: { $ref: "shared.schema.yaml#/$defs/value_type" }
        unit: { type: string }
        status: { $ref: "shared.schema.yaml#/$defs/property_status" }
        source_refs:
          type: array
          default: []
          items: { type: string }
  notes: { type: string }
  governance_refs:
    type: array
    items: { type: string }
    default:
      - docs/governance/ARCHITECTURE_PROJECT_OBJECT_MODEL.md
      - schemas/shared_axes.schema.yaml
x-boundary:
  runtime_execution: false
  provider_routing: false
  memory_promotion: false
  automatic_canonization: false
  approval_engine: false
