$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Project Understanding Evidence
description: >-
  A localized proof: a source artifact plus a locator (page+bbox, ElementId,
  grid ref or IFC GUID). Mirrors the proof-register evidence/anchor shape so the
  two families stay interoperable. Structure only. Shared definitions are factored
  into shared.schema.yaml and referenced (issue #169 $defs factoring); validators
  resolve them through the family registry.
type: object
additionalProperties: false
required: [evidence_id, source_artifact_id, locator]
properties:
  evidence_id: { $ref: "shared.schema.yaml#/$defs/uuid" }
  human_ref: { $ref: "shared.schema.yaml#/$defs/human_ref" }
  source_artifact_id: { type: string, minLength: 1 }
  source_authority: { $ref: "shared.schema.yaml#/$defs/source_authority_level" }
  evidence_type: { type: string }
  locator: { $ref: "shared.schema.yaml#/$defs/locator" }
  captured_at: { $ref: "shared.schema.yaml#/$defs/date" }
  notes: { type: string }
  governance_refs:
    type: array
    items: { type: string }
    default:
      - docs/domain-packs/architecture/PROJECT_UNDERSTANDING.md
      - docs/governance/EVIDENCE_PACK.md
      - schemas/architecture-project-understanding/shared.schema.yaml
x-boundary:
  runtime_execution: false
  provider_routing: false
  memory_promotion: false
  automatic_canonization: false
  approval_engine: false
