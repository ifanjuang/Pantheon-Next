$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Project Understanding Stable Object
description: >-
  Persistent project identity across indices and sources. The match between a
  stable object and its per-source candidates is itself a probative candidate,
  not a fact (see ARCHITECTURE_PROJECT_UNDERSTANDING.md). Status vocabulary is
  aligned with schemas/architecture-proof-register/shared.schema.yaml. Structure
  only; executes nothing and canonizes nothing automatically.
type: object
additionalProperties: false
required: [stable_object_id, kind, proof_status]
properties:
  stable_object_id: { type: string, minLength: 1 }
  human_ref: { $ref: "shared.schema.yaml#/$defs/human_ref" }
  kind: { $ref: "shared.schema.yaml#/$defs/object_kind" }
  proof_status: { $ref: "shared.schema.yaml#/$defs/proof_status" }
  scope_type: { $ref: "shared.schema.yaml#/$defs/scope_type" }
  scope_id: { type: string }
  matches:
    type: array
    default: []
    items:
      type: object
      additionalProperties: false
      required: [source_candidate_id, status]
      properties:
        source_candidate_id: { type: string, minLength: 1 }
        source_artifact_id: { type: string }
        certainty: { $ref: "shared.schema.yaml#/$defs/certainty" }
        status: { $ref: "shared.schema.yaml#/$defs/match_status" }
        match_axis: { $ref: "shared.schema.yaml#/$defs/match_axis" }
        match_evidence:
          type: array
          items: { type: string }
  spans_levels:
    description: "Levels this object crosses (duplex, lift shaft, stairwell, duct, curtain wall)."
    type: array
    default: []
    items: { type: string }
  supersedes_stable_object_id: { type: string }
  superseded_by_stable_object_id: { type: string }
  notes: { type: string }
  governance_refs:
    type: array
    items: { type: string }
    default:
      - docs/governance/ARCHITECTURE_PROJECT_UNDERSTANDING.md
      - schemas/architecture-project-understanding/shared.schema.yaml
x-boundary:
  runtime_execution: false
  provider_routing: false
  memory_promotion: false
  automatic_canonization: false
  approval_engine: false
