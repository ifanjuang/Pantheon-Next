$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Project Understanding Attribute Claim
description: >-
  The elementary datum: one attribute of one stable object, with per-attribute
  provenance (L3). confidence and tolerance are computed outputs of a derivation
  (L2), never hand-entered. There is no can_support_regulatory_claim boolean; the
  regulatory right travels only as the regulatory_claim use_type in allowed_use,
  opened by the gate (L5). Status/use vocabularies are aligned with the proof
  register. Structure only.
type: object
additionalProperties: false
required: [attribute_claim_id, about, source_authority, proof_status]
properties:
  attribute_claim_id: { type: string, minLength: 1 }
  about: { $ref: "shared.schema.yaml#/$defs/attribute_ref" }
  modality:
    description: "required = intent (program); observed/as_built = state; proposed = candidate design."
    $ref: "shared.schema.yaml#/$defs/claim_modality"
  value:
    description: "Free-form value object, e.g. metres, a type label or an azimuth."
    type: object
  source_authority: { $ref: "shared.schema.yaml#/$defs/source_authority_level" }
  derived_from:
    type: array
    description: References to derivation ids that produced this claim (L2).
    default: []
    items: { type: string }
  certainty:
    description: "Governance certainty on the E0-E4 axis, banded from the derivation's computed score (decision A). The numeric score lives only in derivation.produced_certainty_score; this banded value is the contract representation."
    $ref: "shared.schema.yaml#/$defs/certainty"
  tolerance:
    description: "COMPUTED by uncertainty propagation, e.g. a metre tolerance."
    type: object
  proof_status: { $ref: "shared.schema.yaml#/$defs/proof_status" }
  approval_state: { $ref: "shared.schema.yaml#/$defs/approval_state" }
  allowed_use:
    type: array
    uniqueItems: true
    default: []
    items: { $ref: "shared.schema.yaml#/$defs/use_type" }
  forbidden_use:
    type: array
    uniqueItems: true
    default: []
    items: { $ref: "shared.schema.yaml#/$defs/use_type" }
  evidence_refs:
    type: array
    default: []
    items: { $ref: "shared.schema.yaml#/$defs/evidence_ref" }
  validity:
    description: Knowledge-validity time axis (three time axes).
    type: object
    additionalProperties: false
    properties:
      established_at_phase: { $ref: "shared.schema.yaml#/$defs/phase_code" }
      invalidated_by: { type: string }
      still_valid: { type: boolean }
  notes: { type: string }
  governance_refs:
    type: array
    items: { type: string }
    default:
      - docs/domain-packs/architecture/PROJECT_UNDERSTANDING.md
      - schemas/architecture-project-understanding/shared.schema.yaml
allOf:
  # L5: a regulatory_claim use may only be granted with an approved approval_state
  # and supporting evidence. It can never be self-asserted by an adapter.
  - if:
      properties:
        allowed_use:
          contains: { const: regulatory_claim }
      required: [allowed_use]
    then:
      required: [approval_state, evidence_refs]
      properties:
        approval_state: { enum: [approved_for_contractual_action] }
        evidence_refs: { minItems: 1 }
x-boundary:
  runtime_execution: false
  provider_routing: false
  memory_promotion: false
  automatic_canonization: false
  approval_engine: false
