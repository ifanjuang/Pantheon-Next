$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Project Understanding Attribute Claim
description: >-
  V0.2 elementary value assertion about a stable project object or a source
  representation. This is the sole canonical value-bearing carrier in APU.
  Classification, project phase/state and human correction are expressed through
  this same claim mechanism. Approval/use grants remain separate governance
  records and cannot be self-declared by an adapter claim. Structure only.
type: object
additionalProperties: false
required:
  - attribute_claim_id
  - subject_ref
  - attribute_key
  - value
  - assertion_mode
  - source_authority
  - proof_status
properties:
  attribute_claim_id:
    type: string
    minLength: 1
  subject_ref:
    $ref: "shared.schema.yaml#/$defs/entity_ref"
  attribute_key:
    $ref: "shared.schema.yaml#/$defs/attribute_key"
  value:
    $ref: "shared.schema.yaml#/$defs/claim_value"
  assertion_mode:
    $ref: "shared.schema.yaml#/$defs/claim_assertion_mode"
  source_authority:
    $ref: "shared.schema.yaml#/$defs/source_authority_level"
  proof_status:
    $ref: "shared.schema.yaml#/$defs/proof_status"
  certainty:
    $ref: "shared.schema.yaml#/$defs/certainty"
  tolerance:
    description: Computed or sourced tolerance/uncertainty details; never an implicit unit.
    type: object
    additionalProperties: true
  source_representation_refs:
    type: array
    uniqueItems: true
    default: []
    items:
      type: string
      minLength: 1
  derivation_refs:
    type: array
    uniqueItems: true
    default: []
    items:
      type: string
      minLength: 1
  evidence_refs:
    type: array
    default: []
    items:
      $ref: "shared.schema.yaml#/$defs/evidence_ref"
  supersedes_claim_ref:
    description: Prior claim replaced for a declared context without deleting its history.
    type: string
    minLength: 1
  validity:
    description: Knowledge/project validity; documentary source versioning remains on source_representation.
    type: object
    additionalProperties: false
    properties:
      valid_from: { $ref: "shared.schema.yaml#/$defs/date_time" }
      valid_until: { $ref: "shared.schema.yaml#/$defs/date_time" }
      established_at_phase: { $ref: "shared.schema.yaml#/$defs/phase_code" }
      invalidated_by: { type: string, minLength: 1 }
  rationale:
    type: string
    minLength: 1
  governance_refs:
    type: array
    items: { type: string }
    default:
      - docs/domain-packs/architecture/PROJECT_UNDERSTANDING.md
      - docs/domain-packs/architecture/PROJECT_ANATOMY_V02_DESIGN_REVIEW.md
      - docs/domain-packs/architecture/PROOF_REGISTER.md
      - schemas/architecture-project-understanding/shared.schema.yaml
x-boundary:
  runtime_execution: false
  provider_routing: false
  scheduler: false
  queue_system: false
  memory_promotion: false
  automatic_canonization: false
  approval_engine: false
