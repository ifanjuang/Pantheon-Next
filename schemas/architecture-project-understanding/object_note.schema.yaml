$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Project Object Model Object Note
description: >-
  A typed note attached to an object. It may reference Pantheon registers, but a
  remark never becomes a property or a truth automatically. See
  ARCHITECTURE_PROJECT_OBJECT_MODEL.md. Structure only.
type: object
additionalProperties: false
required: [note_id, target_object, note_type, content]
properties:
  note_id: { type: string, minLength: 1 }
  target_object: { type: string, minLength: 1 }
  note_type: { $ref: "#/$defs/note_type" }
  content: { type: string, minLength: 1 }
  visibility: { $ref: "#/$defs/visibility" }
  status: { $ref: "#/$defs/note_status" }
  register_refs:
    description: "References into Pantheon registers (evidence_ref, decision_ref...), as ids; not embedded lifecycle."
    type: array
    default: []
    items: { type: string }
  author: { type: string }
  created_at: { $ref: "#/$defs/date" }
  governance_refs:
    type: array
    items: { type: string }
    default:
      - docs/governance/ARCHITECTURE_PROJECT_OBJECT_MODEL.md
      - schemas/shared_axes.schema.yaml
$defs:
  date: { type: string, format: date }
  note_type:
    type: string
    enum: [description, comment, internal_note, site_observation, design_intent, visa_note, coordination_note]
  visibility:
    type: string
    enum: [internal, shared, external]
  note_status:
    type: string
    enum: [candidate, to_verify, reviewed, rejected]
x-boundary:
  runtime_execution: false
  provider_routing: false
  memory_promotion: false
  automatic_canonization: false
  approval_engine: false
