$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Project Object Model Object Group
description: >-
  A transversal group of objects (possibly non-contiguous, possibly mixed kinds)
  that share properties for inheritance, with per-instance exceptions. Distinct
  from the belief contract's space_group (a composite spatial identity such as a
  T2). See ARCHITECTURE_PROJECT_OBJECT_MODEL.md. Structure only.
type: object
additionalProperties: false
required: [object_group_id, kind, members]
properties:
  object_group_id: { type: string, minLength: 1 }
  human_ref: { $ref: "shared.schema.yaml#/$defs/human_ref" }
  kind: { type: string, minLength: 1 }
  members:
    type: array
    minItems: 1
    items: { type: string }
  property_set_ids:
    type: array
    default: []
    items: { type: string }
  notes: { type: string }
  governance_refs:
    type: array
    items: { type: string }
    default:
      - docs/governance/ARCHITECTURE_PROJECT_OBJECT_MODEL.md
      - schemas/shared_axes.schema.yaml
x-boundary:
  runtime_execution: false
  provider_routing: false
  memory_promotion: false
  automatic_canonization: false
  approval_engine: false
