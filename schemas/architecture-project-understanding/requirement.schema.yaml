$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Project Understanding Requirement
description: >-
  A prescriptive claim from a program (modality required). Quantitative,
  relational, count or classificatory. Targets a stable object, a space function,
  a space group or a classification value over a scope. See
  PROGRAM_AND_CONFORMANCE.md. Structure only.
type: object
additionalProperties: false
required: [requirement_id, from_program, modality, kind, target]
properties:
  requirement_id: { type: string, minLength: 1 }
  human_ref: { $ref: "#/$defs/human_ref" }
  from_program: { type: string, minLength: 1 }
  modality: { $ref: "#/$defs/claim_modality" }
  kind: { $ref: "#/$defs/requirement_kind" }
  target: { $ref: "#/$defs/req_target" }
  value:
    description: "Free-form requirement value object, e.g. an area, a height or a count."
    type: object
  related_target: { $ref: "#/$defs/req_target" }
  scope_type: { $ref: "#/$defs/scope_type" }
  scope_id: { type: string }
  tolerance: { type: object }
  source_authority: { $ref: "#/$defs/source_authority_level" }
  proof_status: { $ref: "#/$defs/proof_status" }
  notes: { type: string }
  governance_refs:
    type: array
    items: { type: string }
    default:
      - docs/governance/PROGRAM_AND_CONFORMANCE.md
      - schemas/architecture-project-understanding/shared.schema.yaml
$defs:
  human_ref: { type: string, minLength: 1, maxLength: 160 }
  claim_modality:
    type: string
    enum: [required, proposed, observed, as_built]
  requirement_kind:
    type: string
    enum: [area_min, area_max, area_target, ceiling_height_min, ceiling_height_target, dimension_min, must_connect, must_be_adjacent, must_have_access_to, count, group_count, classification, attribute]
  scope_type:
    type: string
    enum: [project, phase, lot, agency_library, global_reference, external_project_subset]
  proof_status:
    type: string
    enum: [candidate, source_missing, source_incomplete, source_complete_for_task, source_superseded, contradictory_evidence, authority_too_low, requires_more_evidence, accepted_as_support, rejected, obsolete, superseded]
  source_authority_level:
    type: string
    enum: [law_or_regulation, operation_contract, signed_market_document, approved_phase_decision, signed_or_contradictory_site_evidence, approved_client_decision, contractor_signed_response, approved_technical_report, agency_standard, project_working_document, derived_text, semantic_search_result, model_interpretation_candidate]
  req_target:
    type: object
    additionalProperties: false
    properties:
      stable_object_id: { type: string }
      space_function: { type: string }
      space_group_id: { type: string }
      attribute: { type: string }
      classification:
        type: object
        additionalProperties: false
        required: [scheme, value]
        properties:
          scheme: { type: string }
          value: { type: string }
x-boundary:
  runtime_execution: false
  provider_routing: false
  memory_promotion: false
  automatic_canonization: false
  approval_engine: false
