$schema: "https://json-schema.org/draft/2020-12/schema"
title: Pantheon Next Task Contract
description: Governance contract defining bounded execution intent for Hermes Agent.
type: object
required:
  - contract_id
  - title
  - objective
  - approval_level
  - requested_by
  - created_at
  - allowed_outputs
  - forbidden_outputs
properties:
  contract_id:
    type: string
    pattern: "^[a-z0-9._-]+$"
  title:
    type: string
    minLength: 3
  objective:
    type: string
    minLength: 10
  approval_level:
    type: string
    enum:
      - C0
      - C1
      - C2
      - C3
      - C4
      - C5
  requested_by:
    type: string
  created_at:
    type: string
    format: date-time
  allowed_outputs:
    type: array
    minItems: 1
    items:
      type: string
  forbidden_outputs:
    type: array
    minItems: 1
    items:
      type: string
  evidence_required:
    type: boolean
    default: true
  governance_refs:
    type: array
    items:
      type: string
    default:
      - docs/governance/TASK_CONTRACTS.md
      - docs/governance/APPROVALS.md
      - docs/governance/HERMES_INTEGRATION.md
additionalProperties: false
x-boundary:
  runtime_execution: false
  autonomous_loop: false
  provider_routing: false
  memory_promotion: false
