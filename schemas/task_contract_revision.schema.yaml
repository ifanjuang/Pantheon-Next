$schema: "https://json-schema.org/draft/2020-12/schema"
title: Pantheon Next Task Contract Revision
description: Governance schema for controlled Task Contract revision records.
type: object
required:
  - revision_id
  - contract_id
  - reason
  - requested_by
  - created_at
  - change_summary
  - approval_level
properties:
  revision_id:
    type: string
    pattern: "^[a-z0-9._-]+$"
  contract_id:
    type: string
    pattern: "^[a-z0-9._-]+$"
  reason:
    type: string
    minLength: 10
  requested_by:
    type: string
  created_at:
    type: string
    format: date-time
  change_summary:
    type: string
    minLength: 10
  approval_level:
    type: string
    enum:
      - C0
      - C1
      - C2
      - C3
      - C4
      - C5
  supersedes_revision_id:
    type:
      - string
      - "null"
  evidence_pack_id:
    type:
      - string
      - "null"
  governance_refs:
    type: array
    items:
      type: string
    default:
      - docs/governance/TASK_CONTRACT_REVISIONS.md
      - docs/governance/TASK_CONTRACTS.md
      - docs/governance/APPROVALS.md
additionalProperties: false
x-boundary:
  self_mutation: false
  automatic_approval: false
  runtime_execution: false
