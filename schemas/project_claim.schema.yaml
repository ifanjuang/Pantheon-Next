$schema: "https://json-schema.org/draft/2020-12/schema"
title: Pantheon Next Project Claim
description: >-
  Governance schema for a typed, status-qualified value projected on a Project.
  A ProjectClaim is a semantic linking seam, not a visible Cockpit card family and
  not an approved/opposable value. Source-backed states reference a governed
  semantic entity through backing_ref. The schema does not execute, ingest, admit
  Evidence, mutate Agency Data or run synchronization.
type: object
required:
  - claim_id
  - project_id
  - claim_type
  - value
  - provenance
  - status
  - observed_at
properties:
  claim_id:
    type: string
    pattern: "^[a-z0-9._-]+$"
  project_id:
    type: string
    minLength: 1
    description: Agency Data project/affaire identity on which this claim may be projected.
  claim_type:
    type: string
    minLength: 1
    description: >-
      Open semantic vocabulary such as zone_plu, surface_project, permit_number,
      market_amount or reception_date. It is not a UX family and not a Project column.
  value:
    type: [string, number, boolean, "null"]
    description: Displayable value. Authority and professional reliance are qualified separately.
  unit:
    type: [string, "null"]
    description: Optional unit for numeric claims, for example m2 or EUR.
  backing_ref:
    type: [object, "null"]
    description: >-
      Optional semantic entity that backs the claim. Required by source_backed and
      verified states. References semantic identity, never a visual card family.
    required: [entity_type, entity_id]
    properties:
      entity_type:
        type: string
        minLength: 1
        description: Semantic entity type, for example information, evidence, knowledge, decision or document.
      entity_id:
        type: string
        minLength: 1
      observed_status:
        type: [string, "null"]
        description: Status observed on the backing entity when cited. Not an approval.
    additionalProperties: false
  provenance:
    type: object
    required: [source_kind]
    properties:
      source_kind:
        type: string
        enum:
          - information
          - document
          - human_assertion
          - derived
          - external_projection
      source_ref:
        type: [string, "null"]
        description: Optional pointer to the originating source or external projection.
      asserted_by:
        type: [string, "null"]
      derivation_note:
        type: [string, "null"]
        description: For derived claims, how the value was computed from governed material.
    additionalProperties: false
  status:
    type: string
    enum:
      - asserted
      - source_backed
      - verified
      - contested
      - retired
    description: >-
      Claim lifecycle. asserted != source_backed != verified; none implies approval,
      Evidence admission or legal opposability.
  observed_at:
    type: string
    format: date-time
  revision:
    type: integer
    minimum: 0
    default: 0
    description: Optimistic-concurrency marker; not an approval state.
  supersedes:
    type: [string, "null"]
    description: claim_id of a prior claim this one replaces.
  note:
    type: [string, "null"]
  governance_refs:
    type: array
    items:
      type: string
    default:
      - docs/domain-packs/architecture/PROJECT_CARD_DECK_COMPOSITION.md
      - docs/governance/AGENCY_DATA_SYSTEM_OF_RECORD.md
      - docs/governance/CARD_STACK_MODEL.md
additionalProperties: false
allOf:
  - if:
      properties:
        status:
          enum: [source_backed, verified]
      required: [status]
    then:
      required: [backing_ref]
      properties:
        backing_ref:
          type: object
  - if:
      properties:
        status:
          const: asserted
      required: [status]
    then:
      description: Asserted claims may exist without a backing_ref; they are not source-backed.
x-boundary:
  runtime_execution: false
  autonomous_loop: false
  provider_routing: false
  scheduler: false
  queue_system: false
  memory_promotion: false
  automatic_canonization: false
  evidence_admission: false
  automatic_ingestion: false
  system_of_record_mutation: false
