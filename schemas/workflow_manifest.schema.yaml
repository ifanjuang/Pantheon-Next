$schema: "https://json-schema.org/draft/2020-12/schema"
title: Pantheon Next Workflow Manifest
description: Governance schema for declaring a repeatable governance workflow without runtime execution semantics.
type: object
required:
  - workflow_id
  - title
  - purpose
  - scope
  - entry_criteria
  - governed_phases
  - role_viewpoints
  - task_contract_requirements
  - evidence_requirements
  - approval_requirements
  - allowed_outputs
  - memory_rules
  - risk_notes
  - completion_criteria
  - forbidden_runtime_patterns
properties:
  workflow_id:
    type: string
    pattern: "^[a-z0-9._-]+$"
  title:
    type: string
    minLength: 3
  purpose:
    type: string
    minLength: 10
  scope:
    type: object
    required:
      - scope_type
      - included
      - excluded
      - authority_limits
    properties:
      scope_type:
        type: string
        enum:
          - session
          - task
          - dossier
          - project
          - domain
          - user
          - organization
          - repository
          - governance
          - system
      included:
        type: array
        items:
          type: string
      excluded:
        type: array
        items:
          type: string
      authority_limits:
        type: array
        items:
          type: string
      expected_inputs:
        type: array
        items:
          type: string
      expected_outputs:
        type: array
        items:
          type: string
    additionalProperties: false
  entry_criteria:
    type: array
    minItems: 1
    items:
      type: string
  governed_phases:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - phase_id
        - purpose
        - role_viewpoint
        - expected_output
      properties:
        phase_id:
          type: string
          pattern: "^[a-z0-9._-]+$"
        purpose:
          type: string
        role_viewpoint:
          type: string
          enum:
            - ATHENA
            - ARGOS
            - THEMIS
            - APOLLO
            - ZEUS
            - IRIS
            - HEPHAISTOS
        expected_input:
          type: array
          items:
            type: string
        expected_output:
          type: array
          items:
            type: string
        evidence_expectation:
          type: array
          items:
            type: string
        approval_expectation:
          type: string
        risk_condition:
          type: string
      additionalProperties: false
  role_viewpoints:
    type: array
    minItems: 1
    items:
      type: string
      enum:
        - ATHENA
        - ARGOS
        - THEMIS
        - APOLLO
        - ZEUS
        - IRIS
        - HEPHAISTOS
  task_contract_requirements:
    type: array
    minItems: 1
    items:
      type: string
  evidence_requirements:
    type: array
    minItems: 1
    items:
      type: string
  approval_requirements:
    type: array
    minItems: 1
    items:
      type: string
      enum:
        - C0
        - C1
        - C2
        - C3
        - C4
        - C5
  approval_level:
    type: string
    deprecated: true
    enum:
      - C0
      - C1
      - C2
      - C3
      - C4
      - C5
  allowed_outputs:
    type: array
    minItems: 1
    items:
      type: string
  forbidden_outputs:
    type: array
    items:
      type: string
  memory_rules:
    type: object
    required:
      - memory_candidates_allowed
      - automatic_promotion_allowed
    properties:
      memory_candidates_allowed:
        type: boolean
      automatic_promotion_allowed:
        type: boolean
        const: false
      notes:
        type: string
    additionalProperties: false
  risk_notes:
    type: array
    items:
      type: string
  completion_criteria:
    type: array
    minItems: 1
    items:
      type: string
  forbidden_runtime_patterns:
    type: array
    minItems: 1
    items:
      type: string
    default:
      - execution_engine
      - scheduler
      - queue
      - message_bus
      - provider_router
      - autonomous_loop
      - automatic_memory_promotion
      - hidden_workflow_runtime
  governance_refs:
    type: array
    items:
      type: string
    default:
      - docs/governance/WORKFLOW_SCHEMA.md
      - docs/governance/REQUEST_ORCHESTRATION.md
      - docs/governance/TASK_CONTRACTS.md
      - docs/governance/EVIDENCE_PACK.md
additionalProperties: false
x-boundary:
  runtime_execution: false
  autonomous_loop: false
  provider_routing: false
  scheduler: false
  queue_system: false
  message_bus: false
  workflow_engine: false
  graph_executor: false
  automatic_dispatch: false
  memory_promotion: false
