$schema: "https://json-schema.org/draft/2020-12/schema"
title: Pantheon Next Workflow Manifest
description: Governance schema for declaring a governed workflow without implementing runtime execution semantics.
type: object
required:
  - workflow_id
  - title
  - purpose
  - owner_role
  - participating_roles
  - approval_level
  - expected_evidence
  - forbidden_runtime_patterns
properties:
  workflow_id:
    type: string
    pattern: "^[a-z0-9._-]+$"
  title:
    type: string
    minLength: 3
  purpose:
    type: string
    minLength: 10
  owner_role:
    type: string
    enum:
      - athena-agent
      - argos-agent
      - themis-agent
      - apollo-agent
      - zeus-agent
      - iris-agent
      - hephaistos-agent
  participating_roles:
    type: array
    minItems: 1
    items:
      type: string
      enum:
        - athena-agent
        - argos-agent
        - themis-agent
        - apollo-agent
        - zeus-agent
        - iris-agent
        - hephaistos-agent
  approval_level:
    type: string
    enum:
      - C0
      - C1
      - C2
      - C3
      - C4
      - C5
  expected_evidence:
    type: array
    minItems: 1
    items:
      type: string
  allowed_outputs:
    type: array
    items:
      type: string
  forbidden_outputs:
    type: array
    items:
      type: string
  forbidden_runtime_patterns:
    type: array
    minItems: 1
    items:
      type: string
    default:
      - execution_engine
      - scheduler
      - queue
      - message_bus
      - provider_router
      - autonomous_loop
      - automatic_memory_promotion
      - hidden_workflow_runtime
  governance_refs:
    type: array
    items:
      type: string
    default:
      - docs/governance/WORKFLOW_SCHEMA.md
      - docs/governance/WORKFLOW_ADAPTATION.md
      - docs/governance/REQUEST_ORCHESTRATION.md
additionalProperties: false
x-boundary:
  runtime_execution: false
  autonomous_loop: false
  provider_routing: false
  scheduler: false
  queue_system: false
  message_bus: false
  workflow_engine: false
  graph_executor: false
  automatic_dispatch: false
  memory_promotion: false
